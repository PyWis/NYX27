function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);const k=s>=1?Math.floor(s):s;const w=VW*k,h=VH*k;
  cv.style.width=w+'px';cv.style.height=h+'px';const wr=document.getElementById('wrap');wr.style.width=w+'px';wr.style.height=h+'px';}

// ---------- utils ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng=mulberry(1);
const rr=()=>rng(), ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
const pickR=(r,a)=>a[Math.floor(r()*a.length)];
const R=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function hx(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function shade(h,f){const c=hx(h).map(v=>f>=0?v+(255-v)*f:v*(1+f));return'#'+c.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');}
function hash(n){n=Math.imul(n^61^(n>>>16),9);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return(n>>>0)/4294967296;}
function pc(g,cx,cy,r,col){g.fillStyle=col;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));g.fillRect(cx-w,cy+dy,2*w+1,1);}}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};

// ---------- bitmap font 5x7 ----------
const FONT_SRC={
A:'01110 10001 10001 11111 10001 10001 10001',B:'11110 10001 10001 11110 10001 10001 11110',C:'01110 10001 10000 10000 10000 10001 01110',
D:'11110 10001 10001 10001 10001 10001 11110',E:'11111 10000 10000 11110 10000 10000 11111',F:'11111 10000 10000 11110 10000 10000 10000',
G:'01110 10001 10000 10111 10001 10001 01111',H:'10001 10001 10001 11111 10001 10001 10001',I:'01110 00100 00100 00100 00100 00100 01110',
J:'00111 00010 00010 00010 00010 10010 01100',K:'10001 10010 10100 11000 10100 10010 10001',L:'10000 10000 10000 10000 10000 10000 11111',

S:'01111 10000 10000 01110 00001 00001 11110',T:'11111 00100 00100 00100 00100 00100 00100',U:'10001 10001 10001 10001 10001 10001 01110',
V:'10001 10001 10001 10001 10001 01010 00100',W:'10001 10001 10001 10101 10101 10101 01010',X:'10001 10001 01010 00100 01010 10001 10001',
Y:'10001 10001 10001 01010 00100 00100 00100',Z:'11111 00001 00010 00100 01000 10000 11111',
'0':'01110 10001 10011 10101 11001 10001 01110','1':'00100 01100 00100 00100 00100 00100 01110','2':'01110 10001 00001 00010 00100 01000 11111',
'3':'11111 00010 00100 00010 00001 10001 01110','4':'00010 00110 01010 10010 11111 00010 00010','5':'11111 10000 11110 00001 00001 10001 01110',
'6':'00110 01000 10000 11110 10001 10001 01110','7':'11111 00001 00010 00100 01000 01000 01000','8':'01110 10001 10001 01110 10001 10001 01110',
'9':'01110 10001 10001 01111 00001 00010 01100',' ':'00000 00000 00000 00000 00000 00000 00000',
'.':'00000 00000 00000 00000 00000 01100 01100',',':'00000 00000 00000 00000 01100 00100 01000',':':'00000 01100 01100 00000 01100 01100 00000',
'-':'00000 00000 00000 11111 00000 00000 00000','!':'00100 00100 00100 00100 00100 00000 00100','?':'01110 10001 00001 00010 00100 00000 00100',
'/':'00001 00010 00010 00100 01000 01000 10000',"'":'00100 00100 01000 00000 00000 00000 00000','(':'00010 00100 01000 01000 01000 00100 00010',
')':'01000 00100 00010 00010 00010 00100 01000','+':'00000 00100 00100 11111 00100 00100 00000','%':'11000 11001 00010 00100 01000 10011 00011',
'>':'01000 00100 00010 00001 00010 00100 01000','<':'00010 00100 01000 10000 01000 00100 00010','=':'00000 00000 11111 00000 11111 00000 00000',
'#':'01010 01010 11111 01010 11111 01010 01010','*':'00000 00100 10101 01110 10101 00100 00000','[':'01110 01000 01000 01000 01000 01000 01110',
']':'01110 00010 00010 00010 00010 00010 01110','_':'00000 00000 00000 00000 00000 00000 11111','|':'00100 00100 00100 00100 00100 00100 00100','$':'00100 01111 10100 01110 00101 11110 00100'
};
const GL={};for(const k in FONT_SRC)GL[k]=FONT_SRC[k].split(' ').map(r=>parseInt(r,2));
const norm=s=>String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function glyphs(g,s,x,y,sc,col){g.fillStyle=col;for(let i=0;i<s.length;i++){const gl=GL[s[i]]||GL[' '];for(let r=0;r<7;r++){const row=gl[r];if(!row)continue;for(let j=0;j<5;j++)if(row&(1<<(4-j)))g.fillRect(x+(i*6+j)*sc,y+r*sc,sc,sc);}}}
const tcache=new Map();
function textW(s,sc){return norm(s).length*6*sc-sc;}
function txt(s,x,y,col='#fff',sc=1,align='left',shadow='#000'){
  s=norm(s);const key=s+'|'+col+'|'+sc+'|'+shadow;let c=tcache.get(key);
  if(!c){c=mk(Math.max(1,s.length*6*sc),8*sc);const g=c.getContext('2d');if(shadow)glyphs(g,s,sc,sc,sc,shadow);glyphs(g,s,0,0,sc,col);tcache.set(key,c);if(tcache.size>700)tcache.delete(tcache.keys().next().value);}
  let dx=x;if(align==='center')dx=x-(c.width>>1);else if(align==='right')dx=x-c.width;ctx.drawImage(c,Math.round(dx),Math.round(y));
}

// ---------- roster ----------
const ROSTER=[
 {name:'Zephyr',sex:'UOMO',color:'#e8384f',wpn:{k:'gun',cd:.6,dmg:10,spd:3*BASE,rng:20*BL,label:'PISTOLA'},punch:{dmg:2,cd:.4},spd:1,skin:'#c68a5e',hair:'#1b1b1f',visor:'#ffe03c'},
 {name:'Atlas',sex:'UOMO',color:'#3fd46b',wpn:{k:'melee',cd:.3,dmg:3,rad:26,style:'swords',label:'DOPPIA SPADA'},punch:{dmg:2,cd:.4},spd:1,skin:'#8d5a3b',hair:'#0e0e10',visor:'#3cf2ff'},
 {name:'Caspian',sex:'UOMO',color:'#f2f2f2',wpn:null,punch:{dmg:3,cd:.4},spd:2,skin:'#f0c8a0',hair:'#dfe3f0',visor:'#ff3df2'},
 {name:'Vesper',sex:'DONNA',color:'#3a7bff',wpn:{k:'gun',cd:.3,dmg:8,spd:5*BASE,rng:10*BL,label:'PISTOLA RAPIDA'},punch:{dmg:2,cd:.4},spd:1,skin:'#e0b090',hair:'#2b4bd8',visor:'#3cf2ff'},
 {name:'Indigo',sex:'DONNA',color:'#16121f',rim:'#8a6bff',wpn:{k:'melee',cd:.5,dmg:4,rad:44,style:'whip',label:'FRUSTA'},punch:{dmg:2,cd:.4},spd:1,skin:'#a8704a',hair:'#3b1f6b',visor:'#b48cff'},
 {name:'Nova',sex:'DONNA',color:'#ff6ec7',wpn:null,punch:{dmg:1,cd:.3},spd:1,skin:'#f2c6a8',hair:'#ff4fb0',visor:'#ffe03c'},
];
ROSTER.forEach(r=>r.ui=r.rim||r.color);
const NEON=['#ff3df2','#3cf2ff','#ffe03c','#ff4d6d','#7dff6a','#a66bff'];
const ACID='#c6ff3a';

// ---------- city generation ----------
let ys,bands,solid,kind,blocks,nodes,edges,garage,neons,lamps,miniCv;
// kind: 0 building,1 road,2 sidewalk,3 park,4 garage
function genCity(seed){
  rng=mulberry(seed);
  ys=[0];for(;;){const n=ys[ys.length-1]+RW+ri(9,15);if(n+RW+9>MH-RW){ys.push(MH-RW);break;}ys.push(n);}
  bands=[];let prev=[];
  for(let i=0;i<ys.length-1;i++){
    const xs=[0];let x=0;
    for(;;){let n=x+RW+ri(8,14);
      // evita l'allineamento con le strade verticali della fascia sopra -> incroci a T, quasi mai a +
      for(let k=0;k<3;k++){if(prev.some(p=>p>0&&p<MW-RW&&Math.abs(p-n)<6)&&rr()>0.05)n+=7;else break;}
      if(n+RW+8>MW-RW){xs.push(MW-RW);break;}
      xs.push(n);x=n;}
    bands.push(xs);prev=xs;}
  solid=new Uint8Array(MW*MH).fill(1);kind=new Uint8Array(MW*MH);
  const carve=(x,y,w,h,k)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){const id=j*MW+i;solid[id]=0;kind[id]=k;}};
  for(const y of ys)carve(0,y,MW,RW,1);
  bands.forEach((xs,i)=>{for(const x of xs)carve(x,ys[i],RW,ys[i+1]-ys[i]+RW,1);});
  blocks=[];
  bands.forEach((xs,i)=>{for(let j=0;j<xs.length-1;j++){blocks.push({x:xs[j]+RW,y:ys[i]+RW,w:xs[j+1]-xs[j]-RW,h:ys[i+1]-ys[i]-RW,band:i,col:j,type:'city',seed:ri(1,1e9),neon:[],lots:[]});}});
  // nodes / edges
  nodes=[];const nodeMap=new Map();
  const nid=(cx,row)=>{const k=cx+','+row;let id=nodeMap.get(k);if(id===undefined){id=nodes.length;nodes.push({cx,row,x:(cx+1.5)*CELL,y:(row+1.5)*CELL,nb:[]});nodeMap.set(k,id);}return id;};
  edges=[];
  const link=(a,b,h)=>{const A=nodes[a],B=nodes[b];const len=Math.hypot(A.x-B.x,A.y-B.y);A.nb.push({to:b,len});B.nb.push({to:a,len});edges.push({a,b,h});};
  for(let i=0;i<ys.length;i++){const set=new Set();if(i>0)bands[i-1].forEach(x=>set.add(x));if(i<bands.length)bands[i].forEach(x=>set.add(x));
    const arr=[...set].sort((p,q)=>p-q);for(let k=0;k<arr.length-1;k++)link(nid(arr[k],ys[i]),nid(arr[k+1],ys[i]),true);}
  bands.forEach((xs,i)=>xs.forEach(x=>link(nid(x,ys[i]),nid(x,ys[i+1]),false)));
  // garage
  const mid=Math.floor(bands.length/2);const gx=bands[mid];let j=0,bd=1e9;
  for(let k=0;k<gx.length-1;k++){const c=(gx[k]+gx[k+1])/2;if(Math.abs(c-MW/2)<bd){bd=Math.abs(c-MW/2);j=k;}}
  const gb=blocks.find(b=>b.band===mid&&b.col===j);gb.type='garage';
  const ix=(gb.x+1)*CELL,iy=(gb.y+1)*CELL,iw=(gb.w-2)*CELL,ih=(gb.h-2)*CELL;
  garage={b:gb,x:gb.x*CELL,y:gb.y*CELL,w:gb.w*CELL,h:gb.h*CELL,node:nid(gx[j],ys[mid]),cx:(gb.x+gb.w/2)*CELL,cy:(gb.y+gb.h/2)*CELL,bays:[]};
  for(let r=0;r<2;r++)for(let c=0;c<3;c++)garage.bays.push({x:Math.round(ix+iw*(c+.5)/3),y:Math.round(iy+ih*(r?0.78:0.27))});
  // parks
  for(const b of blocks)if(b.type==='city'&&rr()<0.07&&dist(b.x,b.y,gb.x,gb.y)>6)b.type='park';
  for(const b of blocks){
    carve(b.x,b.y,b.w,1,2);carve(b.x,b.y+b.h-1,b.w,1,2);carve(b.x,b.y,1,b.h,2);carve(b.x+b.w-1,b.y,1,b.h,2);
    if(b.type==='park')carve(b.x+1,b.y+1,b.w-2,b.h-2,3);
    else if(b.type==='garage')carve(b.x+1,b.y+1,b.w-2,b.h-2,4);
    else{
      const r=mulberry(b.seed);const out=[];splitLots(r,b.x+1,b.y+1,b.w-2,b.h-2,out,0);
      for(const L of out){L.seed=Math.floor(r()*1e9);L.hgt=2+Math.floor(r()*5);
        L.roof=pickR(r,['#3b3552','#45405e','#2f3b4a','#4a3b3b','#3a4a44','#504a5c','#2e2e3e','#5a4a3a','#36404f','#3e4658','#4b3f52']);
        const ix2=b.x+1,iy2=b.y+1,ex=b.x+b.w-1,ey=b.y+b.h-1;
        const side=(cond,mkN)=>{if(cond&&r()<0.28){const n=mkN();n.c=pickR(r,NEON);n.ph=r()*10;n.fl=r()<.18;b.neon.push(n);}};
        const ln=(len)=>Math.max(8,Math.floor(len*(0.3+r()*0.5)));
        side(L.y===iy2,()=>{const l=ln(L.w*CELL);return{x:L.x*CELL+4+Math.floor(r()*Math.max(1,L.w*CELL-l-8)),y:L.y*CELL-2,w:l,h:2};});
        side(L.y+L.h===ey,()=>{const l=ln(L.w*CELL);return{x:L.x*CELL+4+Math.floor(r()*Math.max(1,L.w*CELL-l-8)),y:(L.y+L.h)*CELL,w:l,h:2};});
        side(L.x===ix2,()=>{const l=ln(L.h*CELL);return{x:L.x*CELL-2,y:L.y*CELL+4+Math.floor(r()*Math.max(1,L.h*CELL-l-8)),w:2,h:l};});
        side(L.x+L.w===ex,()=>{const l=ln(L.h*CELL);return{x:(L.x+L.w)*CELL,y:L.y*CELL+4+Math.floor(r()*Math.max(1,L.h*CELL-l-8)),w:2,h:l};});
      }
      b.lots=out;
    }
  }
  neons=[];for(const b of blocks)for(const n of b.neon)neons.push(n);
  genShops();
  // street lamps
  lamps=[];
  nodes.forEach((n,i)=>{const h=hash(i*7+3);if(h>0.62)return;const cs=[[1,1],[1,-1],[-1,1],[-1,-1]];const s=Math.floor(hash(i*13+1)*4);
    for(let k=0;k<4;k++){const c=cs[(s+k)%4];const x=n.x+c[0]*32,y=n.y+c[1]*32;if(kindAt(x,y)===2){lamps.push({x,y,c:hash(i*5)<.6?'#ffcf7a':pickR(()=>hash(i*11),['#3cf2ff','#ff3df2','#a66bff'])});break;}}});
  // minimap (1 px = 2 cells)
  miniCv=mk(MW/2,MH/2);const mg=miniCv.getContext('2d');const id=mg.createImageData(MW/2,MH/2);
  const COLS={1:[107,93,146],2:[46,39,66],0:[18,14,26],3:[31,90,51],4:[255,61,242]};
  for(let y=0;y<MH/2;y++)for(let x=0;x<MW/2;x++){let best=0;const ks=[kind[(2*y)*MW+2*x],kind[(2*y)*MW+2*x+1],kind[(2*y+1)*MW+2*x],kind[(2*y+1)*MW+2*x+1]];
    best=ks.includes(4)?4:ks.includes(1)?1:ks.includes(3)?3:ks.includes(2)?2:0;const c=COLS[best];const o=(y*MW/2+x)*4;id.data[o]=c[0];id.data[o+1]=c[1];id.data[o+2]=c[2];id.data[o+3]=255;}
  mg.putImageData(id,0,0);
  bcache.clear();
}
// ---------- shops: 5 farmacie, 5 meccanici, 20 negozi + 6 edifici speciali ----------
const SHOP_T={pharm:{c:'#5cff7a',name:'FARMACIA',icon:['0011100','0011100','1111111','1111111','1111111','0011100','0011100']},
  mech:{c:'#ffb03c',name:'MECCANICO',icon:['0001110','0011100','0111000','1111110','0001100','0011000','0110000']},
  shop:{c:'#ffe03c',name:'NEGOZIO',icon:['0010000','0111100','1010000','0111000','0010100','1111000','0010000']},
  church:{c:'#e6e0ff',name:'CHIESA',sp:1,icon:['0001000','0001000','0111110','0001000','0001000','0001000','0001000']},
  cop:{c:'#3a7bff',name:'COMMISSARIATO',sp:1,icon:['0001000','0011100','1111111','0111110','0011100','0110110','1100011']},
  nasa:{c:'#9fd4ff',name:'CENTRO NASA',sp:1,icon:['0011100','0100010','1111111','1000001','1111111','0100010','0011100']},
  hosp:{c:'#ff4d6d',name:'OSPEDALE',sp:1,icon:['1100011','1100011','1111111','1111111','1100011','1100011','1100011']},
  bikes:{c:'#ff6ec7',name:'NEGOZIO MOTO',sp:1,icon:['0111110','1000001','1011101','1010101','1011101','1000001','0111110']},
  bank:{c:'#ffd27a',name:'BANCA',sp:1,icon:['0001000','0011100','1111111','0101010','0101010','0101010','1111111']},
  alien:{c:'#c6ff3a',name:'CENTRO ALIENI',sp:1,icon:['0111110','1111111','1001001','1111111','0111110','0010100','0110110']},
  guns:{c:'#d0d0dc',name:'ARMERIA',sp:1,icon:['0000000','1111111','1111111','0011010','0011000','0010000','0000000']}};
const SPECIALS=['church','cop','nasa','hosp','bikes','guns','alien','bank'];
const SHOP_NAMES=['BODEGA 24','SYNTH MART','NEON DELI','KOMBINI 9','RAMEN STOP','CHIP SHOP','VOLT MARKET','DROID DINER','PIXEL GROCER','ZERO BAR',
  'MEGA BAZAAR','NOODLE BOX','PAWN 2099','CYBER CAFE','LOTUS STORE','DOLLAR 99','NIGHT OWL','RETRO VIDEO','GHOST MARKET','SODA LAB'];
let shops=[];
function genShops(){
  shops=[];const GX=7,GY=6,used=new Set(),slots=[];
  for(let gy=0;gy<GY;gy++)for(let gx=0;gx<GX;gx++){
    const cand=blocks.filter(b=>b.type==='city'&&b.lots.length&&!used.has(b)&&(b.x+b.w/2)>=gx*MW/GX&&(b.x+b.w/2)<(gx+1)*MW/GX&&(b.y+b.h/2)>=gy*MH/GY&&(b.y+b.h/2)<(gy+1)*MH/GY);
    if(!cand.length)continue;const b=cand[Math.floor(rr()*cand.length)];
    const opts=[];for(const L of b.lots){if(L.y===b.y+1)opts.push([L,'t']);if(L.y+L.h===b.y+b.h-1)opts.push([L,'b']);if(L.x===b.x+1)opts.push([L,'l']);if(L.x+L.w===b.x+b.w-1)opts.push([L,'r']);}
    if(!opts.length)continue;used.add(b);opts.sort((p,q)=>q[0].w*q[0].h-p[0].w*p[0].h);slots.push({b,opts});}
  for(let i=slots.length-1;i>0;i--){const j=Math.floor(rr()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]];}
  const types=[...SPECIALS];for(let i=0;i<5;i++)types.push('pharm','mech');for(let i=0;i<20;i++)types.push('shop');
  let ni=0;
  types.forEach((type,k)=>{const sl=slots[k];if(!sl)return;const b=sl.b;const [L,side]=SHOP_T[type].sp?sl.opts[0]:sl.opts[Math.floor(rr()*sl.opts.length)];
    let x,y;if(side==='t'){x=(L.x+L.w/2)*CELL;y=(b.y+.5)*CELL;}else if(side==='b'){x=(L.x+L.w/2)*CELL;y=(b.y+b.h-.5)*CELL;}
    else if(side==='l'){x=(b.x+.5)*CELL;y=(L.y+L.h/2)*CELL;}else{x=(b.x+b.w-.5)*CELL;y=(L.y+L.h/2)*CELL;}
    const s={i:shops.length,type,x:Math.round(x),y:Math.round(y),side,L,b,name:type==='shop'?SHOP_NAMES[ni++%SHOP_NAMES.length]:SHOP_T[type].name,anger:0,calm:0,cd:0};
    b.shop=s;b.neon=b.neon.filter(n=>dist(n.x,n.y,s.x,s.y)>40);shops.push(s);});
}
// chiesa gotica vista dall'alto: pianta a croce latina, torri campanarie con guglie, rosone, contrafforti, vetrate e cimitero

let AC=null,master=null,musicGain=null,noiseBuf=null,musicOn=true,muted=false,nextT=0,step=0;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=.45;master.connect(AC.destination);musicGain=AC.createGain();musicGain.gain.value=.10;musicGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(schedule,40);}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,type,t,dur,vol,f2,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.02);}
function noise(t,dur,vol,freq,type,dest){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||2000;const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+dur+.02);}
function sfx(n){if(!AC||muted)return;const t=AC.currentTime;
  switch(n){case'shoot':tone(900,'square',t,.09,.07,200);break;case'rapid':tone(1400,'square',t,.05,.05,500);break;
  case'slash':noise(t,.1,.12,3000,'bandpass');break;case'whip':noise(t,.14,.12,4500,'highpass');tone(1800,'sine',t,.06,.03,600);break;
  case'punch':noise(t,.08,.2,900);tone(140,'sine',t,.08,.15,60);break;case'hit':tone(220,'square',t,.05,.05,120);break;
  case'hurt':tone(160,'sawtooth',t,.15,.08,70);break;case'boom':noise(t,.5,.3,1200);tone(90,'sine',t,.4,.2,30);break;
  case'switch':[0,4,7,12].forEach((k,i)=>tone(mf(72+k),'triangle',t+i*.05,.08,.07));break;
  case'charge':tone(660,'sine',t,.1,.06);tone(990,'sine',t+.08,.12,.06);break;case'alert':tone(1200,'square',t,.05,.04);tone(1200,'square',t+.09,.05,.04);break;
  case'bump':noise(t,.08,.12,500);break;case'buy':[0,7,12].forEach((k,i)=>tone(mf(76+k),'square',t+i*.06,.07,.05));break;
  case'cash':[0,4,7,12,16].forEach((k,i)=>tone(mf(79+k),'square',t+i*.05,.06,.05));break;
  case'siren':for(let i=0;i<4;i++)tone(i%2?620:880,'square',t+i*.18,.17,.035);break;case'nitro':noise(t,.4,.15,800,'bandpass');tone(200,'sawtooth',t,.4,.06,900);break;case'mount':tone(300,'triangle',t,.06,.06,500);break;case'empty':tone(200,'square',t,.2,.05,100);break;}}
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
function schedule(){if(!AC||!musicOn||muted){if(AC)nextT=AC.currentTime;return;}
  while(nextT<AC.currentTime+.15){if(nextT<AC.currentTime)nextT=AC.currentTime;const bar=Math.floor(step/16)%4,s=step%16,ch=PROG[bar];
    if(s%2===0)tone(mf(ch[0]-24+(s%4===2?12:0)),'sawtooth',nextT,.16,.5,0,musicGain);
    tone(mf(ch[s%3]+12+(s>=8?12:0)),'square',nextT,.07,.12,0,musicGain);
    if(s%4===0)tone(120,'sine',nextT,.12,.9,40,musicGain);if(s%8===4)noise(nextT,.12,.5,3000,'highpass',musicGain);
    nextT+=60/112/4;step++;}}

function updatePolice(c,dt){

    if(d<75&&sees){c.v=0;alive.forEach((k,i)=>{const a=c.a+(i?1:-1)*Math.PI/2;const x=c.x+Math.cos(a)*12,y=c.y+Math.sin(a)*12;k.x=blocked(x,y,3)?c.x:x;k.y=blocked(x,y,3)?c.y:y;k.out=true;});sfx('siren');}

    k.fa=Math.atan2(pb.y-k.y,pb.x-k.x);if(dk>10){const dx=tx-k.x,dy=ty-k.y,l=Math.hypot(dx,dy)||1;moveCol(k,'x','y',dx/l*50*dt,dy/l*50*dt,3);k.walk+=dt*12;}

function recallCops(c,out,dt){for(const k of out){const dx=c.x-k.x,dy=c.y-k.y,l=Math.hypot(dx,dy);if(l<8){k.out=false;continue;}moveCol(k,'x','y',dx/l*55*dt,dy/l*55*dt,3);k.walk+=dt*12;k.fa=Math.atan2(dy,dx);}}

      else if(pAvail&&dist(pBody.x,pBody.y,b.x,b.y)<(team[active].inCar?11:7)){damagePlayer(b.dmg,b.o==='c'?'police':'xeno',b.from,'weapon');b.dead=true;}}
    b.life-=dt;if(b.life<=0)b.dead=true;}

  if(policeOp){policeOp.t-=dt;if(policeOp.t<=0){policeOp.t=12;const live=enemies.filter(e=>!e.dead);
    if(live.length){const e=live[Math.floor(R()*live.length)];e.dead=true;copKills++;freeCaptives(e);policeOp.left--;fx.push({k:'flash',x:e.x,y:e.y,t:0,dur:.5,r:50,c:'#3a7bff'});
      msg('LA POLIZIA HA CATTURATO UNO XENO ('+(10-policeOp.left)+'/10)','#3a7bff');}

  enemies=enemies.filter(e=>!e.dead);

  for(const q of pops){q.y-=18*dt;q.life-=dt;}pops=pops.filter(q=>q.life>0);

  respawnT-=dt;if(respawnT<=0){respawnT=60;if(E<NIGHT&&noSpawnT<=0&&enemies.length<20){spawnEnemy();msg('UN NUOVO XENO E ENTRATO IN CITTA',ACID);}}

  if(enemies.length<3)lowT+=dt;else lowT=0;
  if(ap&&ap.i===5&&!ap.nyx&&churchCD<=0&&state==='play'){const ch=shops.find(s=>s.type==='church');if(ch&&dist(pBody.x,pBody.y,ch.x,ch.y)<32){

  const dot=(x,y,c,s)=>{const[a,b]=P(x,y);ctx.fillStyle=c;ctx.fillRect(Math.round(a-s/2),Math.round(b-s/2),s,s);};

  if(amb)dot(amb.x,amb.y,'#ff2b4a',4);if(mission){const t=missionTarget();if(Math.floor(T*3)%2)dot(t.x,t.y,'#ffe03c',6);const[a,b2]=[x0+t.x/32*S,y0+t.y/32*S];txt('PACCO',a,b2-11,'#ffe03c',1,'center');}
  for(const c of police)dot(c.x,c.y,c.mode==='abandoned'?'#9fd4ff':'#2b6bff',3);
  for(const t of team){if(t.status==='captured'){const e=enemies.find(e=>e.id===t.captor);if(e)dot(e.x,e.y,'#ff3df2',4);}else if(t.status!=='dead'&&t.i!==active)dot(t.x,t.y,t.ui,3);}
  dot(garage.cx,garage.cy,'#ff3df2',6);{const[a,b]=P(garage.cx,garage.cy);txt('RIMESSA',a,b+5,'#ff3df2',1,'center');}
  if(state==='play'){const pb=body(team[active]);if(Math.floor(T*4)%2)dot(pb.x,pb.y,'#ffffff',5);}
  const lx=x0+W+16;let ly=20;const leg=[['FARMACIA',SHOP_T.pharm.c],['MECCANICO',SHOP_T.mech.c],['NEGOZIO',SHOP_T.shop.c],['EDIFICI SPECIALI','#ffffff'],['POLIZIA','#2b6bff'],['AUTO LIBERA','#9fd4ff'],['RAPITORE','#ff3df2'],['TU','#ffffff']];
  txt('LEGENDA',lx,ly,'#3cf2ff',1);ly+=14;for(const[n,c]of leg){ctx.fillStyle=c;ctx.fillRect(lx,ly+1,4,4);txt(n,lx+8,ly,c);ly+=11;}
  ly+=8;for(const t of SPECIALS){txt(SHOP_T[t].name,lx,ly,SHOP_T[t].c);ly+=11;}
  txt('G PER CHIUDERE',lx,VH-20,'#7a6f99');}
function drawGunMenu(){const p=team[active];ctx.fillStyle='rgba(5,3,12,.8)';ctx.fillRect(0,0,VW,VH);panel(150,90,340,170);txt('ARMERIA - 10000$',VW/2,100,'#d0d0dc',2,'center');
  txt('SCEGLI L\'ARMA DI UN COLLEGA PER '+p.name,VW/2,124,'#c9c2e6',1,'center');
  gunMenu.opts.forEach((i,k)=>{const w=ROSTER[i].wpn;txt((k+1)+' - '+w.label+' (DI '+ROSTER[i].name+') '+w.dmg+' DANNI/'+w.cd+'S',170,146+k*18,ROSTER[i].ui);});
  txt('ESC PER ANNULLARE',VW/2,240,'#7a6f99',1,'center');}

// ---------- title & screens ----------
let logo=null;
function makeLogo(){const sc=10,t='NYX',w=t.length*6*sc,h=8*sc;const c=mk(w+8,h+8),g=c.getContext('2d');
  glyphs(g,t,6,6,sc,'#2a0b3d');glyphs(g,t,3,3,sc,'#3cf2ff');
  const m=mk(w,h),mg=m.getContext('2d');glyphs(mg,t,0,0,sc,'#fff');mg.globalCompositeOperation='source-in';const gr=mg.createLinearGradient(0,0,0,7*sc);
  gr.addColorStop(0,'#ffe03c');gr.addColorStop(.5,'#ff3df2');gr.addColorStop(1,'#7a2bff');mg.fillStyle=gr;mg.fillRect(0,0,w,h);
  mg.globalCompositeOperation='destination-out';for(let y=Math.floor(3.6*sc),k=1;y<7*sc;y+=4+k,k++)mg.fillRect(0,y,w,k>3?2:1);g.drawImage(m,0,0);return c;}
let saved=readSave();
function titleInput(){
  if(pressed.has('ArrowRight')||pressed.has('KeyD'))sel=(sel+1)%6;if(pressed.has('ArrowLeft')||pressed.has('KeyA'))sel=(sel+5)%6;
  if(pressed.has('ArrowDown')||pressed.has('ArrowUp')||pressed.has('KeyW')||pressed.has('KeyS'))sel=(sel+3)%6;
  const live=saved&&!saved.meta.ended;
  if(pressed.has('Backspace')||pressed.has('Delete')){if(saved){if(delArm>0){delSave();saved=null;meta=null;delArm=0;titleMsg='SALVATAGGIO CANCELLATO';}else{delArm=2.5;titleMsg='PREMI DI NUOVO CANC PER CANCELLARE';}}}
  if(pressed.has('Enter')||pressed.has('KeyT')){if(live)loadGame(saved);else newGame(sel);}}
function drawTitle(dt){
  const cx=WPX/2+Math.cos(T*.03)*1800,cy=HPX/2+Math.sin(T*.04)*1800;drawWorld(cx,cy,dt);
  ctx.fillStyle='rgba(5,3,12,.62)';ctx.fillRect(0,0,VW,VH);
  if(!logo)logo=makeLogo();ctx.drawImage(logo,VW/2-logo.width/2|0,4);
  txt('NEW YORK XENO',VW/2,90,'#3cf2ff',2,'center','#2a0b3d');txt('POST-CYBERPUNK MOTO WARS - DALLE 18:00 ALLE 06:00',VW/2,108,'#ff9de6',1,'center');
  const cw=196,chh=58,x0=(VW-3*cw-8)/2|0;const live=saved&&!saved.meta.ended;
  for(let i=0;i<6;i++){const r=ROSTER[i],x=x0+(i%3)*(cw+4),y=120+Math.floor(i/3)*(chh+4);panel(x,y,cw,chh);
    if(i===sel&&!live){ctx.fillStyle=Math.floor(T*4)%2?'#ffffff':r.ui;ctx.fillRect(x,y,cw,2);ctx.fillRect(x,y+chh-2,cw,2);ctx.fillRect(x,y,2,chh);ctx.fillRect(x+cw-2,y,2,chh);}
    if(!r._por)r._por=portrait(r);ctx.drawImage(r._por,x+6,y+5);
    if(!r._spr)r._spr=bikeSprite(r.color,r.rim,true,false,'#1e1a28',r.color==='#16121f'?'#2a2440':r.color,r.visor);
    ctx.save();ctx.translate(x+18,y+43);ctx.scale(1.5,1.5);ctx.drawImage(r._spr,-10,-6);ctx.restore();
    txt(r.name,x+36,y+5,r.ui,2);txt(r.sex,x+cw-6,y+5,'#7a6f99',1,'right');const w=r.wpn;
    txt(w?'ARMA: '+w.label:'ARMA: NESSUNA',x+36,y+22,'#ffffff');
    txt(w?(w.k==='gun'?w.dmg+' DANNI/'+w.cd+'S GITTATA '+w.rng/BL:w.dmg+' DANNI/'+w.cd+'S RAGGIO '+w.rad):'SOLO A MANI NUDE',x+36,y+31,'#c9c2e6');
    txt('PUGNI '+r.punch.dmg+' / '+r.punch.cd+'S   MOTO X'+r.spd,x+36,y+40,'#ff9de6');}
  const y0=246;const bl=Math.floor(T*2)%2?'#ffe03c':'#ffffff';
  if(saved&&saved.meta.ended){const e=saved.meta.ended;txt('ULTIMA NOTTE: '+(e.win?'VITTORIA':'SCONFITTA')+' - '+e.reason+' - XENO ABBATTUTI '+e.kills,VW/2,y0,e.win?'#5cff7a':'#ff4d6d',1,'center');}
  if(live)txt('NOTTE IN CORSO (ORE '+hhmm(saved.meta.gameT)+') - INVIO: CONTINUA   CANC: CANCELLA',VW/2,y0+12,bl,1,'center');
  else txt('SCEGLI IL BIKER - INVIO: INIZIA LA NOTTE (ORE 18:00)',VW/2,y0+12,bl,1,'center');
  if(titleMsg)txt(titleMsg,VW/2,y0+24,'#ff9de6',1,'center');
  const L=['FRECCE GUIDA - SPAZIO ARMA/PUGNO - Z SCENDI/SALI - TAB CAMBIA - X NITRO - Q ARMA - G MAPPA - W RADAR',
    'E: NEGOZI, RAPINE, EDIFICI SPECIALI E FURTO AUTO DELLA POLIZIA - F FARMACO - C CONSEGNA FARMACI IN RIMESSA',
    'A 0 VITA TI ARRENDI: LO XENO TI CATTURA (30 MIN PER UCCIDERLO) O SCAPPI (20%, IN RIMESSA DOPO 3 MIN CON 1 DI VITA)',
    'VINCI: XENO SOTTO 3 PER 30 MIN O NESSUNO XENO ALL\'ALBA - PERDI SE ARRIVANO A 20 PER 1 MINUTO',
    'OGNI MINUTO GIOCATO E UN MINUTO DI NOTTE - SALVATAGGIO NEL BROWSER - P PAUSA - M MUSICA - N AUDIO'];
  L.forEach((l,i)=>txt(l,VW/2,y0+38+i*11,i<2?'#c9c2e6':'#7a6f99',1,'center'));}
function drawEnd(){ctx.fillStyle='rgba(5,3,12,.78)';ctx.fillRect(0,0,VW,VH);const e=meta.ended;
  txt(e.win?'VITTORIA':'GAME OVER',VW/2,90,e.win?'#5cff7a':'#ff4d6d',4,'center','#2a0b3d');txt(e.reason,VW/2,140,'#ffffff',e.reason.length>34?1:2,'center');
  txt('XENO ABBATTUTI: '+e.kills+(copKills?'  (+'+copKills+' POLIZIA)':'')+(dispersed?'  (+'+dispersed+' SPARITI)':''),VW/2,175,ACID,e.kills>99||copKills||dispersed?1:2,'center');txt('ORA: '+hhmm(e.at)+'   CASSA: '+money+'$',VW/2,197,'#3cf2ff',2,'center');
  txt('INVIO PER TORNARE AL TITOLO',VW/2,240,Math.floor(T*2)%2?'#ffe03c':'#ffffff',1,'center');}
function drawWait(){ctx.fillStyle='rgba(5,3,12,.6)';ctx.fillRect(0,0,VW,VH);drawTopBar();drawRoster();
  txt('NESSUN BIKER DISPONIBILE',VW/2,110,'#ff4d6d',2,'center');txt('LA NOTTE CONTINUA: ASPETTA CHE QUALCUNO TORNI IN RIMESSA',VW/2,136,'#c9c2e6',1,'center');
  let y=160;for(const b of team){if(b.status==='dead')continue;const[st,sc]=statusTxt(b);txt(b.name+' - '+st,VW/2,y,sc,1,'center');y+=12;}
  msgs.forEach((m,i)=>{ctx.globalAlpha=Math.min(1,m.life);txt(m.t,VW/2,60+i*12,m.c,1,'center');});ctx.globalAlpha=1;}
function drawPause(){ctx.fillStyle='rgba(5,3,12,.78)';ctx.fillRect(0,0,VW,VH);txt('PAUSA',VW/2,24,'#ff3df2',3,'center','#2a0b3d');
  const L=[['FRECCE GUIDA - SPAZIO ARMA O PUGNO - Z SCENDI/SALI - TAB CAMBIA BIKER - W RADAR NEGOZI','#c9c2e6'],['X NITRO - Q CAMBIA ARMA - F FARMACO - C CONSEGNA FARMACI - G MAPPA','#c9c2e6'],
   ['FARMACIA: FARMACO 100$ (MAX 3, +25 VITA/MIN)','#5cff7a'],['MECCANICO: ELETTRONITRO 50$ (MAX 5, X2 PER 20S)','#ffb03c'],['NEGOZIO: RAPINA A PIEDI 30-120$ - DANNI 10/20/30/40/60 - FA SALIRE LA RABBIA','#ffe03c'],
   ['CHIESA: NESSUN NUOVO XENO PER 10 MIN (OGNI 60 MIN)','#e6e0ff'],['COMMISSARIATO: PORTA UN\'AUTO DELLA POLIZIA - 30% CATTURANO 10 XENO, ALTRIMENTI ARRESTO 5 MIN','#3a7bff'],
   ['CENTRO NASA: SCUDO ANTI ARMI XENO 500$ - DURA 20 MIN DAL PRIMO COLPO','#9fd4ff'],['OSPEDALE: RICOVERO GRATIS +10 VITA/MIN - UN BIKER ALLA VOLTA','#ff4d6d'],
   ['NEGOZIO MOTO: 5000$ VELOCITA X1.6 PERMANENTE (CASPIAN X1.2)','#ff6ec7'],['ARMERIA: 10000$ SECONDA ARMA DI UN COLLEGA','#d0d0dc'],
   ['OSPEDALE: 3 FARMACI DONATI DA 2 BIKER DIVERSI = +25 VITA MAX AL TEAM (FINO A 250)','#5cff7a'],['CHIESA: ZEPHYR, POI VESPER = MATRIMONIO 10000$ (MOTO X1.2) - ARMERIA: INDIGO, POI ATLAS = +2 DANNI','#ff6ec7'],
   ['CASPIAN AL CENTRO NASA ENTRO LE 18:05 = NOTTE VELOCE (RIPARTE ALLE 05:00)','#9fd4ff'],
   ['BANCA: OBBLIGAZIONE 1000$ = 40$ AL MINUTO PER 30 MIN - COMMISSARIATO: CAUZIONE 1000$ A ARRESTATO','#ffd27a'],
   ['CENTRO ALIENI (ZEPHYR/VESPER): 25$ PER XENO ABBATTUTO - 10+ XENO = AUTO MEDICA','#c6ff3a'],['MISSIONI: OGNI 15 MIN UN PACCO DA CONSEGNARE - 100$ (+50 OLTRE 75% MAPPA, +50 OLTRE 100%)','#ffe03c'],
   ['UCCIDI I 2 AGENTI: RUBA L\'AUTO (E) E PORTALA IN RIMESSA = 200-400$','#9fd4ff'],['RIMESSA: +2 VITA/MIN, RICARICA X2, ZONA SICURA - M MUSICA - N AUDIO - P RIPRENDI','#7a6f99']];
  L.forEach((l,i)=>txt(l[0],VW/2,56+i*14,l[1],1,'center'));}

// ---------- main loop ----------
genCity(Math.floor(Math.random()*1e9));
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;T+=dt;delArm=Math.max(0,delArm-dt);
  if(pressed.has('KeyM'))musicOn=!musicOn;if(pressed.has('KeyN'))muted=!muted;
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  if(state==='title'){titleInput();if(state==='title')drawTitle(dt);}
  else if(state==='play'||state==='wait'){
    if(gunMenu){const p=team[active];for(let k=0;k<gunMenu.opts.length;k++)if(pressed.has('Digit'+(k+1))||pressed.has('Numpad'+(k+1))){if(money>=10000){money-=10000;p.weapons.push(gunMenu.opts[k]);p.wi=p.weapons.length-1;setW(p);sfx('cash');msg(p.name+' HA UNA NUOVA ARMA: '+p.wpn.label+' (Q PER CAMBIARE)',p.ui);}gunMenu=null;break;}
      if(gunMenu&&(pressed.has('Escape')||pressed.has('KeyE')))gunMenu=null;}
    else if(pressed.has('KeyG'))mapOpen=!mapOpen;
    else if(state==='play'&&(pressed.has('KeyP')||pressed.has('Escape')))paused=!paused;
    const frozen=paused||mapOpen||gunMenu;
    if(!frozen)update(dt);
    if(pendingFast){pendingFast=false;newGame(2);meta.gameT=11*3600;meta.fast=true;msgs=[];msg('NOTTE VELOCE! SI RIPARTE ALLE 05:00','#9fd4ff');msg('RESISTI FINO ALL\'ALBA','#ffe03c');saveGame();}
    if(state==='play'){drawWorld(cam.x,cam.y,frozen?0:dt);drawHUD();if(gunMenu)drawGunMenu();else if(mapOpen)drawBigMap();else if(paused)drawPause();}
    else if(state==='wait'){drawWorld(cam.x,cam.y,dt);drawWait();if(mapOpen)drawBigMap();}
    else{drawWorld(cam.x,cam.y,dt);drawEnd();}
  }else if(state==='end'){drawWorld(cam.x,cam.y,dt);drawEnd();if(pressed.has('Enter')){saved=readSave();state='title';titleMsg='';}}
  pressed.clear();requestAnimationFrame(frame);}
addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='wait'))saveGame();});
addEventListener('pagehide',()=>{if(state==='play'||state==='wait')saveGame();});
requestAnimationFrame(frame);
</script>
