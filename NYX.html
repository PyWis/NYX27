  eachCell(gNeons, X0, Y0, X1, Y1, n => {
    const q = neonPos(n);
    lglow(q.x + n.w / 2, q.y + n.h / 2, Math.max(n.w, n.h) * 0.9 + 18, n.c, neonA(n) * 1.6);
  });
  eachCell(gShops, X0, Y0, X1, Y1, s => lglow(s.x, s.y, SHOP_T[s.type].sp ? 64 : 42, SHOP_T[s.type].c, 0.55));
  lglow(garage.cx, garage.cy, 150, '#ff3df2', 0.4);
  lglow(garage.cx, garage.cy, 100, '#ffe9d0', 0.35);
  const vis = (x, y) => x > X0 && x < X1 && y > Y0 && y < Y1;
  for (const s of shops)
    if (s.type === 'church' && vis(s.x, s.y)) {
      const L = s.L;
      lglow((L.x + L.w / 2) * CELL, (L.y + L.h / 2) * CELL, 60, '#7a2bff', 0.4);
    }
  // fari dello stadio e maxischermi di Times Square
  const near = (x, y, m) => x > X0 - m && x < X1 + m && y > Y0 - m && y < Y1 + m;
  for (const l of stadium.lights) if (near(l.x, l.y, 160)) lglow(l.x, l.y, 170, '#fff3d0', stad ? 0.75 : 0.5);
  if (stad && near(stadium.cx, stadium.cy, 200)) lglow(stadium.cx, stadium.cy, 190, '#ff2b4a', blink(2) ? 0.35 : 0.15);
  for (const m of landmarks)
    if (m.name === 'TIMES SQUARE' && near(m.x, m.y, 260)) {
      const b = m.b;
      for (let k = 0; k < 4; k++) {
        const x = (b.x + 2 + ((b.w - 4) * (k + 0.5)) / 4) * CELL;
        const c = NEON[(Math.floor(T * 0.7) + k * 2) % NEON.length];
        lglow(x, (b.y + 5) * CELL, 70, c, 0.55);
        lglow(x, (b.y + b.h - 5) * CELL, 70, NEON[(Math.floor(T * 0.7) + k * 2 + 3) % NEON.length], 0.55);
      }
      lglow(m.x, m.y, 150, '#ffe9d0', 0.3);
    }
  const car = o => {
    if (!vis(o.x, o.y)) return;
    lcone(o, 0.75);
    lglow(o.x, o.y, 18, '#fff2d8', 0.25);
  };
  for (const b of team)
    if (b.status === 'returning' || b.status === 'robbing' || (b.status === 'active' && playing && !b.onFoot)) car(b);
  for (const e of enemies)
    if (!e.onFoot) {
      car(e);
      lglow(e.x, e.y, 16, ACID, 0.35);
    }
  for (const c of police) {
    if (!vis(c.x, c.y)) continue;
    if (c.mode === 'cops' || c.mode === 'driven') car(c);
    if (c.mode === 'cops' || c.mode === 'driven') {
      const on = blink(6),
        big = c.state === 'chase' || c.mode === 'driven';
      lglow(c.x, c.y, big ? 40 : 26, '#ff2b4a', on ? 0.7 : 0.2);
      lglow(c.x, c.y, big ? 40 : 26, '#2b6bff', on ? 0.2 : 0.7);
    }
  }
  if (darkReady() && vis(dark.x, dark.y)) {
    if (dark.driver >= 0) car(dark);
    lglow(dark.x, dark.y, 22, '#8a6bff', 0.45);
  }
  if (amb && vis(amb.x, amb.y)) {
    car(amb);
    lglow(amb.x, amb.y, 30, blink(8) ? '#ff2b4a' : '#ffffff', 0.7);
  }
  for (const b of bullets) lglow(b.x, b.y, 12, b.c, 0.9);
  for (const f of fx) {
    const k = f.t / f.dur,
      o = f.own ? body(f.own) : f;
    if (f.k === 'flash') lglow(f.x, f.y, f.r * 1.5, f.c, (1 - k) * 1.3);
    else lglow(o.x, o.y, f.r + 16, f.c, (f.k === 'laser' ? 1.2 : 0.5) * (1 - k));
  }
  for (const e of enemies) if (e.lchg > 0) lglow(e.x, e.y, 30 + e.lchg * 20, '#ff8a1f', 0.4 + e.lchg * 0.5);
  for (const q of parts) if (q.sz > 1 || q.c === '#ffe03c') lglow(q.x, q.y, 5, q.c, q.life);
  if (playing) {
    const p = team[active],
      pb = body(p);
    lglow(pb.x, pb.y, 46, '#c8c0ff', 0.35);
    if (p.nyx) {
      lglow(pb.x, pb.y, NYX_R, '#7a2bff', 0.22);
      lglow(pb.x, pb.y, 40, '#ff3df2', 0.6);
    }
    if (p.nitroT > 0) lglow(p.x, p.y, 30, '#3cf2ff', 0.6);
    if (p.shield && !p.inCar) lglow(pb.x, pb.y, 24, '#9fd4ff', 0.35);
    if (p.lchg > 0) lglow(p.x, p.y, 20 + p.lchg * 40, '#ff8a1f', 0.4 + p.lchg * 0.6);
  }
  lctx.globalCompositeOperation = 'source-over';
  lctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'multiply';
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(lightCv, 0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = false;
}

// ---------- etichette (disegnate sopra la luce, sempre leggibili) ----------
const LBL = [];
function lab(s, x, y, c) {
  LBL.push(s, x, y, c);
}

// ---------- disegno del mondo ----------
let lastCX = null,
  lastCY = null;
function drawWorld(cx, cy, dt) {
  const sh = SET.shake ? shake : 0;
  const sx = sh ? sh * (Math.sin(T * 53.1) * 0.6 + Math.sin(T * 37.7 + 1.7) * 0.4) : 0,
    sy = sh ? sh * (Math.sin(T * 47.3 + 0.6) * 0.6 + Math.sin(T * 29.9 + 2.9) * 0.4) : 0; // scossa smorzata
  const ox = Math.round(cx - VW / 2 + sx),
    oy = Math.round(cy - VH / 2 + sy);
  const dcx = lastCX === null || Math.abs(cx - lastCX) > 200 ? 0 : cx - lastCX,
    dcy = lastCY === null || Math.abs(cy - lastCY) > 200 ? 0 : cy - lastCY;
  lastCX = cx;
  lastCY = cy;
  const X0 = ox - 60,
    Y0 = oy - 60,
    X1 = ox + VW + 60,
    Y1 = oy + VH + 60;
  const vis = (x, y) => x > X0 && x < X1 && y > Y0 && y < Y1;
  const playing = state === 'play';
  LBL.length = 0;
  ctx.save();
  ctx.translate(-ox, -oy);
  for (let r = Math.floor(oy / CH); r <= Math.floor((oy + VH) / CH); r++)
    for (let c = Math.floor(ox / CH); c <= Math.floor((ox + VW) / CH); c++) {
      if (c < 0 || r < 0 || c >= CHN || r >= CHN) continue;
      ctx.drawImage(chunkCv(c, r), c * CH, r * CH);
    }
  ctx.fillStyle = '#07050c';
  if (ox < 0) ctx.fillRect(ox, oy, -ox, VH);
  if (oy < 0) ctx.fillRect(ox, oy, VW, -oy);
  if (ox + VW > WPX) ctx.fillRect(WPX, oy, ox + VW - WPX, VH);
  if (oy + VH > HPX) ctx.fillRect(ox, HPX, VW, oy + VH - HPX);
  drawDecals(X0, Y0, X1, Y1);
  // asfalto bagnato: riflessi allungati delle luci
  if (weather.wet > 0.05) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    const wa = weather.wet;
    const refl = (x, y, r, c, a) => {
      ctx.globalAlpha = a * wa;
      ctx.drawImage(glowSpr(c), x - r * 0.35, y + 2, r * 0.7, r * 1.7);
    };
    eachCell(gLamps, X0, Y0, X1, Y1, l => refl(l.x, l.y, 40, l.c, 0.22));
    eachCell(gNeons, X0, Y0, X1, Y1, n =>
      refl(n.x + n.w / 2, n.y + n.h / 2, Math.max(n.w, n.h) * 0.8 + 10, n.c, neonA(n) * 0.6),
    );
    eachCell(gShops, X0, Y0, X1, Y1, s => refl(s.x, s.y, 30, SHOP_T[s.type].c, 0.15));
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.imageSmoothingEnabled = false;
  }
  for (const b of team) {
    if (b.i === active && playing) continue;
    if (b.status === 'dead' || !vis(b.x, b.y)) continue;
    const empty =
      b.status === 'out' ||
      b.status === 'captured' ||
      b.status === 'hosp' ||
      b.status === 'amb' ||
      b.status === 'medbay' ||
      b.status === 'fetch' ||
      b.status === 'waitamb' ||
      b.status === 'car';
    drawVeh(empty ? b.sprE : b.spr, b.x, b.y, b.a);
    if (b.status === 'idle') {
      lab(b.name, b.x, b.y - 18, b.ui);
      if (inMission(b)) lab('STADIO', b.x, b.y + 9, '#9fd4ff');
      else if (blockT > 0) lab('BLOCK', b.x, b.y + 9, '#f2f2f2');
      else lab(b.waitT > 0 ? fmt(b.waitT) : 'IN CARICA', b.x, b.y + 9, '#ffe03c');
    } else if (b.status === 'returning') lab(b.name, b.x, b.y - 18, b.ui);
    else if (b.status === 'robbing') {
      lab(b.name, b.x, b.y - 18, b.ui);
      lab('RAPINALI TUTTI! ' + (b.rob ? b.rob.k + '/' + b.rob.seq.length : ''), b.x, b.y + 9, '#ffd21f');
    } else if (b.status === 'truce') {
      lab(b.name, b.x, b.y - 18, b.ui);
      lab('TREGUA ' + fmt(truceT), b.x, b.y + 9, '#c6ff3a');
    } else if (empty)
      lab(
        b.status === 'captured'
          ? 'RAPITO'
          : b.status === 'hosp'
            ? 'OSPEDALE'
            : b.status === 'amb'
              ? 'AUTO MEDICA'
              : b.status === 'waitamb'
                ? 'SOCCORSI'
                : b.status === 'medbay'
                  ? 'IN CURA'
                  : b.status === 'fetch'
                    ? 'ASPETTA'
                    : b.status === 'car'
                      ? 'AUTO NERA'
                      : b.outR,
        b.x,
        b.y + 9,
        '#ff4d6d',
      );
  }
  for (const b of team) {
    if ((b.status === 'fetch' || b.status === 'medbay') && vis(b.px, b.py)) {
      drawPerson(
        b.px,
        b.py,
        b.pfa || 0,
        shade(b.ui, -0.2),
        b.skin,
        b.hair,
        0,
        b.status === 'fetch' ? b.walk : 0,
        b.sex === 'DONNA',
      );
      lab(b.name, b.px, b.py - 12, b.ui);
    }
  }
  if (amb && vis(amb.x, amb.y)) {
    drawVeh(ambSpr, amb.x, amb.y, amb.a);
    lab('AUTO MEDICA', amb.x, amb.y - 16, '#ff4d6d');
  }
  if (mission) {
    const t = missionTarget();
    if (vis(t.x, t.y) && blink(3)) lab(mission.carrier < 0 ? 'PACCO!' : 'CONSEGNA QUI', t.x, t.y - 31, '#ffe03c');
  }
  for (const s of shops) if (shopOff(s) && vis(s.x, s.y)) lab('FUORI USO ' + fmtL(s.offT), s.x, s.y - 40, '#ffd21f');
  for (const e of enemies) {
    const s = e.kind ? XK[e.kind] : enemySpr(e.t);
    if (!vis(e.x, e.y) && !vis(e.fx, e.fy)) continue;
    if (e.onFoot) {
      drawVeh(s.e, e.x, e.y, e.a);
      drawPerson(e.fx, e.fy, e.fa, '#4a1a7a', ACID, '#2a0b3d', e.punchT, e.walk, false);
    } else drawVeh(s.r, e.x, e.y, e.a);
    if (e.lchg > 0) {
      const w = e.wpn;
      ring(e.x, e.y, w.rad, ((T * 10) | 0) % 2 ? '#ff8a1f' : '#ff3d3d', 40, T * 2, 1);
      ring(e.x, e.y, 4 + (e.lchg / w.chg) * (w.rad - 4), '#ffe0a0', 20, -T * 6, 1);
    }
    if (e.follow && nyxOn() && !e.kneel && Math.floor(T * 2 + e.id) % 4 === 0) {
      ctx.fillStyle = '#b48cff';
      ctx.fillRect(Math.round(e.x) - 1, Math.round(e.y) - 12, 3, 3);
    }
    if (e.kind) {
      const k = XK[e.kind];
      lab(k.name + ' ' + Math.ceil(e.hp), e.x, e.y - 16, k.c);
      if (e.kind === 'gold') ring(e.x, e.y, 14, blink(4) ? k.c : '#fff2a0', 16, T * 3, 1);
    }
    if (e.kneel && ceremony) lab(ceremony.said ? '...' : 'DEA DELLA NOTTE', e.fx, e.fy - 14, ACID);
    const caps = team.filter(t => t.status === 'captured' && t.captor === e.id);
    caps.forEach((t, i) => {
      const cx2 = Math.round(e.x - Math.cos(e.a) * (14 + i * 8)),
        cy2 = Math.round(e.y - Math.sin(e.a) * (14 + i * 8));
      ctx.fillStyle = t.color;
      ctx.fillRect(cx2 - 3, cy2 - 3, 6, 6);
      ctx.fillStyle = '#000';
      ctx.fillRect(cx2 - 2, cy2 - 3, 1, 6);
      ctx.fillRect(cx2 + 1, cy2 - 3, 1, 6);
      lab(t.name + ' ' + fmt(t.capT), e.x, e.y - 26 - i * 9, blink(3) ? '#ff3df2' : t.ui);
    });
    const b = body(e);
    if (e.hitT > 0) {
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.fillRect(b.x - 5, b.y - 5, 10, 10);
    }
  }
  for (const c of police) {
    if (vis(c.x, c.y)) {
      drawVeh(copSpr, c.x, c.y, c.a);
      if (c.mode === 'abandoned' && pAvail && dist(c.x, c.y, pBody.x, pBody.y) < 60)
        lab(
          team[active].onFoot && !team[active].inCar ? K('use') + ": RUBA L'AUTO" : 'AUTO INCUSTODITA',
          c.x,
          c.y - 16,
          '#9fd4ff',
        );
      if (c.mode === 'impound') lab('RESTA ' + fmt(c.impT), c.x, c.y - 14, '#9fd4ff');
    }
    if (c.mode === 'cops')
      for (const k of c.cops)
        if (k.out && k.hp > 0 && vis(k.x, k.y))
          drawPerson(k.x, k.y, k.fa, '#1d2a6b', '#c68a5e', '#0e0e14', 0, k.walk, false);
  }
  drawDark(vis);
  if (playing) {
    const p = team[active];
    if (p.inCar) {
      drawVeh(p.sprE, p.x, p.y, p.a);
    } else if (p.onFoot) {
      drawVeh(p.sprE, p.x, p.y, p.a);
      drawPerson(p.fx, p.fy, p.fa, shade(p.ui, -0.2), p.skin, p.hair, p.punchT, p.walk, p.sex === 'DONNA');
      if (dist(p.fx, p.fy, p.x, p.y) < 26 && blink(3)) lab(K('mount') + ': SALI', p.x, p.y - 18, '#ffffff');
    } else drawVeh(p.nyx ? nyxSpr : p.spr, p.x, p.y, p.a, p.lean);
    const pb = body(p);
    if (mission && mission.carrier === p.i) {
      ctx.fillStyle = '#8a5a2a';
      ctx.fillRect(Math.round(pb.x) + 4, Math.round(pb.y) + 3, 5, 4);
      ctx.fillStyle = '#ffe03c';
      ctx.fillRect(Math.round(pb.x) + 6, Math.round(pb.y) + 3, 1, 4);
    }
    if (p.lchg > 0) {
      const w = p.wpn,
        q = p.lchg / w.chg;
      ring(p.x, p.y, 6 + q * (w.rad - 6), '#ffb35c', 28, T * 8, 1);
      ring(p.x, p.y, w.rad, 'rgba(255,138,31,.45)', 36, -T * 2, 1);
    }
    if (p.walkPath) {
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      const q = p.walkPath[p.walkPath.length - 1];
      ctx.fillRect(Math.round(q.x) - 1, Math.round(q.y) - 14, 3, 3);
    }
  }
  // edifici sopra le strade, poi i neon sulle pareti
  drawBuildings(cx, cy, X0, Y0, X1, Y1);
  eachCell(gNeons, X0, Y0, X1, Y1, n => {
    const q = neonPos(n);
    if (!q.vis) return;
    ctx.fillStyle = n.c;
    ctx.globalAlpha = Math.min(1, 0.55 + neonA(n) * 1.4);
    ctx.fillRect(q.x, q.y, n.w, n.h);
  });
  ctx.globalAlpha = 1;
  for (const f of fx) {
    const k = f.t / f.dur;
    const o = f.own ? body(f.own) : f;
    if (f.k === 'swords') {
      ctx.fillStyle = f.c;
      for (let s = 0; s < 2; s++) {
        const a = f.a + k * 6.283 + s * Math.PI;
        for (let r2 = 6; r2 < f.r; r2 += 1.5)
          ctx.fillRect(Math.round(o.x + Math.cos(a) * r2), Math.round(o.y + Math.sin(a) * r2), 1, 1);
        ctx.globalAlpha = 0.5;
        for (let t = 1; t < 6; t++) {
          const a2 = a - t * 0.18;
          ctx.fillRect(Math.round(o.x + Math.cos(a2) * f.r), Math.round(o.y + Math.sin(a2) * f.r), 1, 1);
        }
        ctx.globalAlpha = 1;
      }
    } else if (f.k === 'whip') {
      ctx.fillStyle = f.c;
      const base = f.a + k * 6.283;
      for (let i = 0; i < 40; i++) {
        const t = i / 40;
        const a = base - t * 1.2;
        const rad = 6 + (f.r - 6) * Math.min(1, t * 1.6) * (0.6 + 0.4 * Math.sin(k * Math.PI));
        ctx.fillRect(Math.round(o.x + Math.cos(a) * rad), Math.round(o.y + Math.sin(a) * rad), t < 0.5 ? 2 : 1, 1);
      }
    } else if (f.k === 'laser') {
      const rad = f.r * (0.35 + 0.65 * Math.min(1, k * 1.8));
      ring(o.x, o.y, rad, k < 0.5 ? '#fff3c0' : f.c, 56, k * 3, 2);
      ctx.fillStyle = f.c;
      for (let s = 0; s < 3; s++) {
        const a = f.a + k * 9 + s * 2.094;
        for (let r2 = 4; r2 < rad; r2 += 1.5)
          ctx.fillRect(Math.round(o.x + Math.cos(a) * r2), Math.round(o.y + Math.sin(a) * r2), 1, 1);
      }
    }
  }
  for (const b of bullets) {
    ctx.fillStyle = b.c;
    ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 1, 2, 2);
    const l = Math.hypot(b.vx, b.vy);
    ctx.globalAlpha = 0.5;
    ctx.fillRect(Math.round(b.x - (b.vx / l) * 4), Math.round(b.y - (b.vy / l) * 4), 1, 1);
    ctx.globalAlpha = 1;
  }
  for (const q of parts) {
    ctx.globalAlpha = Math.min(1, q.life * 3);
    ctx.fillStyle = q.c;
    ctx.fillRect(Math.round(q.x), Math.round(q.y), q.sz, q.sz);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // luce: buio della notte + sorgenti
  drawLights(ox, oy, X0, Y0, X1, Y1, playing);
  // bagliore additivo (bloom leggero)
  ctx.save();
  ctx.translate(-ox, -oy);
  ctx.globalCompositeOperation = 'lighter';
  ctx.imageSmoothingEnabled = true;
  eachCell(gNeons, X0, Y0, X1, Y1, n => {
    const q = neonPos(n);
    glow(q.x + n.w / 2, q.y + n.h / 2, Math.max(n.w, n.h) * 0.8 + 12, n.c, neonA(n) * 0.6);
  });
  eachCell(gShops, X0, Y0, X1, Y1, s =>
    glow(s.x, s.y, SHOP_T[s.type].sp ? 40 : 26, SHOP_T[s.type].c, 0.12 + 0.04 * Math.sin(T * 3 + s.i)),
  );
  if (vis(garage.cx, garage.cy)) glow(garage.cx, garage.cy, 110, '#ff3df2', 0.1 + 0.04 * Math.sin(T * 2));
  for (const c of police) {
    if (!vis(c.x, c.y) || (c.mode !== 'cops' && c.mode !== 'driven')) continue;
    const on = blink(6);
    const rx = c.x + Math.cos(c.a + Math.PI / 2) * 3,
      ry = c.y + Math.sin(c.a + Math.PI / 2) * 3,
      bx = c.x - Math.cos(c.a + Math.PI / 2) * 3,
      by = c.y - Math.sin(c.a + Math.PI / 2) * 3;
    const big = c.state === 'chase' || c.mode === 'driven';
    glow(rx, ry, big ? 24 : 14, '#ff2b4a', on ? 0.6 : 0.12);
    glow(bx, by, big ? 24 : 14, '#2b6bff', on ? 0.12 : 0.6);
  }
  if (amb && vis(amb.x, amb.y)) glow(amb.x, amb.y, 20, blink(8) ? '#ff2b4a' : '#ffffff', 0.5);
  for (const b of bullets) glow(b.x, b.y, 8, b.c, 0.5);
  for (const f of fx) {
    if (f.k === 'flash') glow(f.x, f.y, f.r * (1 - (f.t / f.dur) * 0.5), f.c, (1 - f.t / f.dur) * 0.6);
  }
  for (const e of enemies) if (!e.onFoot) glow(e.x, e.y, 12, ACID, 0.12);
  if (playing) {
    const p = team[active],
      pb = body(p);
    if (p.nyx) glow(pb.x, pb.y, 26, '#ff3df2', 0.3 + 0.12 * Math.sin(T * 5));
    if (p.nitroT > 0) glow(p.x, p.y, 20, '#3cf2ff', 0.3);
    if (p.shield && !p.inCar) glow(pb.x, pb.y, 18, '#9fd4ff', p.shieldT === null ? 0.1 : 0.2 + 0.06 * Math.sin(T * 8));
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = false;
  // sopra la luce: barre vita, insegne, etichette, numeri
  for (const e of enemies) {
    const b = body(e);
    if (!vis(b.x, b.y)) continue;
    if (e.hp < 25) {
      ctx.fillStyle = '#000';
      ctx.fillRect(b.x - 8, b.y - 12, 16, 3);
      ctx.fillStyle = ACID;
      ctx.fillRect(b.x - 7, b.y - 11, Math.max(0, (14 * e.hp) / 25), 1);
    }
  }
  for (const c of police)
    if (c.arrest > 0 && pAvail) {
      const w = Math.round((20 * c.arrest) / 1.2);
      ctx.fillStyle = '#000';
      ctx.fillRect(pBody.x - 11, pBody.y + 10, 22, 4);
      ctx.fillStyle = '#3a7bff';
      ctx.fillRect(pBody.x - 10, pBody.y + 11, w, 2);
      lab('ARRESTO', pBody.x, pBody.y + 16, '#9fd4ff');
    }
  eachCell(gShops, X0, Y0, X1, Y1, s => {
    const d = pAvail ? dist(s.x, s.y, pBody.x, pBody.y) : 1e9;
    if (s.anger > 0) {
      for (let i = 0; i < s.anger; i++) {
        ctx.fillStyle = '#ff4d6d';
        ctx.fillRect(s.x - s.anger * 2 + i * 4, s.y + 6, 3, 2);
      }
    }
    if (d < 90 || (SHOP_T[s.type].sp && d < 220)) {
      lab(s.name, s.x, s.y - 22, SHOP_T[s.type].c);
      if (s.anger > 0 && d < 24) lab('RABBIA ' + s.anger, s.x, s.y + 10, '#ff4d6d');
    }
  });
  for (const m of landmarks) if (vis(m.x, m.y) || dist(m.x, m.y, cx, cy) < 360) lab(m.name, m.x, m.b.y * CELL + 4, m.c);
  if (playing) {
    const pb = body(team[active]);
    if (blink(4)) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(pb.x) - 1, Math.round(pb.y) - 11, 3, 1);
      ctx.fillRect(Math.round(pb.x), Math.round(pb.y) - 10, 1, 1);
    }
  }
  for (let i = 0; i < LBL.length; i += 4) txt(LBL[i], LBL[i + 1], LBL[i + 2], LBL[i + 3], 1, 'center');
  for (const q of pops) {
    ctx.globalAlpha = Math.min(1, q.life * 2);
    txt(q.t, q.x, q.y, q.c, 1, 'center');
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawRain(dt, ox, oy, dcx, dcy);
}

<script>
// ===== js/hud.js =====
'use strict';
// =====================================================================
//  HUD, MENU E SCHERMATE
// =====================================================================
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8,5,16,.8)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ff3df2';
  ctx.fillRect(x, y, w, 1);
  ctx.fillRect(x, y, 1, h);
  ctx.fillStyle = '#3cf2ff';
  ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x + w - 1, y, 1, h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y, 2, 1);
  ctx.fillRect(x + w - 2, y + h - 1, 2, 1);
}
const barPat = (() => {
  const c = mk(4, 8),
    g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.45)';
  g.fillRect(3, 0, 1, 8);
  return ctx.createPattern(c, 'repeat');
})();
function bar(x, y, w, h, f, col) {
  ctx.fillStyle = '#1a1426';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col;
  ctx.fillRect(x, y, Math.round(w * clamp(f, 0, 1)), h);
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = barPat;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}
// bussola: anello disegnato una volta sola
const compassCv = (() => {
  const c = mk(60, 60),
    g = c.getContext('2d');
  g.fillStyle = 'rgba(8,5,16,.8)';
  g.beginPath();
  g.arc(30, 30, 28, 0, 6.283);
  g.fill();
  for (let a = 0; a < 72; a++) {
    g.fillStyle = a % 18 === 0 ? '#ffffff' : a % 2 ? '#ff3df2' : '#3cf2ff';
    g.fillRect(
      Math.round(30 + Math.cos((a / 72) * 6.283) * 27),
      Math.round(30 + Math.sin((a / 72) * 6.283) * 27),
      1,
      1,
    );
  }
  return c;
})();
function pips(x, y, n, max, col) {
  for (let i = 0; i < max; i++) {
    ctx.fillStyle = i < n ? col : '#2a2238';
    ctx.fillRect(x + i * 4, y, 3, 5);
  }
}
// riquadro con il nome del tasto/pulsante
function keyCap(k, x, y, col) {
  const w = textW(k, 1) + 6;
  ctx.fillStyle = col || '#ffe03c';
  ctx.fillRect(x, y, w, 11);
  ctx.fillStyle = '#0b0814';
  ctx.fillRect(x + 1, y + 1, w - 2, 9);
  txt(k, x + 3, y + 2, col || '#ffe03c', 1, 'left', '');
  return w;
}
function strip(s, x, y, col, a) {
  const w = textW(s, 1) + 8;
  ctx.fillStyle = 'rgba(8,5,16,' + (a == null ? 0.7 : a) + ')';
  ctx.fillRect(Math.round(x - w / 2), y - 2, w, 11);
  txt(s, x, y, col, 1, 'center');
}
const hpCol = f => (f > 0.5 ? '#5cff7a' : f > 0.25 ? '#ffe03c' : '#ff4d6d');

function statusTxt(b) {
  switch (b.status) {
    case 'active':
      return [
        b.nyx ? 'NYX' : inDark(b) ? 'AUTO NERA' : b.inCar ? 'AUTO POLIZIA' : b.onFoot ? 'A PIEDI' : 'IN GUIDA',
        b.nyx ? '#ff3df2' : inDark(b) ? '#b48cff' : '#5cff7a',
      ];
    case 'car':
      return ["SULL'AUTO NERA", '#b48cff'];
    case 'garage':
      return ['IN RIMESSA', '#3cf2ff'];
    case 'idle':
      if (inMission(b)) return ['NELLO STADIO', '#9fd4ff'];
      if (blockT > 0) return ['FERMO (BLOCK)', '#f2f2f2'];
      return [b.waitT > 0 ? 'FERMO ' + fmt(b.waitT) : 'ATTENDE CARICA', '#ffe03c'];
    case 'returning':
      return ['RIENTRO', '#ff9de6'];
    case 'amb':
      return ['AUTO MEDICA', '#ffffff'];
    case 'waitamb':
      return ['SOCCORSI', '#ff9de6'];
    case 'medbay':
      return ['IN CURA ' + Math.floor((b.hp / maxHP) * 100) + '%', '#5cff7a'];
    case 'fetch':
      return ['VA ALLA MOTO', '#ffe03c'];
    case 'hosp':
      return ['OSPEDALE ' + Math.floor((b.hp / maxHP) * 100) + '%', '#ff4d6d'];
    case 'out':
      return [
        (b.outR === 'ARRESTATO' ? 'ARRESTO' : b.outR) + ' ' + shortT(b.outT),
        b.outR === 'ARRESTATO' ? '#3a7bff' : '#ff4d6d',
      ];
    case 'captured':
      return ['RAPITO ' + shortT(b.capT), '#ff3df2'];
    case 'robbing':
      return ['RAPINALI TUTTI! ' + (b.rob ? b.rob.k + '/' + b.rob.seq.length : ''), '#ffd21f'];
    case 'truce':
      return ['TREGUA ' + shortT(truceT), '#c6ff3a'];
    case 'dead':
      return ['MORTO', '#6a5f80'];
  }
  return ['', ''];
}
// versione corta (max 9 caratteri) per le schede del roster
function statusShort(b) {
  const pc = Math.floor((b.hp / maxHP) * 100) + '%';
  switch (b.status) {
    case 'active':
      return [
        b.nyx ? 'NYX' : inDark(b) ? 'AUTO NERA' : b.inCar ? 'AUTO POL' : b.onFoot ? 'A PIEDI' : 'IN GUIDA',
        b.nyx ? '#ff3df2' : inDark(b) ? '#b48cff' : '#5cff7a',
      ];
    case 'car':
      return ['AUTO NERA', '#b48cff'];
    case 'garage':
      return ['RIMESSA', '#3cf2ff'];
    case 'idle':
      if (inMission(b)) return ['STADIO', '#9fd4ff'];
      if (blockT > 0) return ['BLOCK', '#f2f2f2'];
      return [b.waitT > 0 ? 'STOP ' + fmt(b.waitT) : 'CARICA', '#ffe03c'];
    case 'returning':
      return ['RIENTRO', '#ff9de6'];
    case 'amb':
      return ['SOCCORSO', '#ffffff'];
    case 'waitamb':
      return ['SOCCORSI', '#ff9de6'];
    case 'medbay':
      return ['CURA ' + pc, '#5cff7a'];
    case 'fetch':
      return ['VA MOTO', '#ffe03c'];
    case 'hosp':
      return ['OSP ' + pc, '#ff4d6d'];
    case 'out':
      return [
        ({
          ARRESTATO: 'ARR ',
          FERITO: 'FER ',
          FUGGITO: 'FUGA ',
          ESAUSTA: 'KO ',
          OSTAGGIO: 'OST ',
          PRIGIONIERO: 'PRIG ',
        }[b.outR] || 'OUT ') + shortT(b.outT),
        b.outR === 'ARRESTATO' ? '#3a7bff' : '#ff4d6d',
      ];
    case 'captured':
      return ['RAP ' + shortT(b.capT), '#ff3df2'];
    case 'robbing':
      return ['RAP ' + (b.rob ? b.rob.k + '/' + b.rob.seq.length : ''), '#ffd21f'];
    case 'truce':
      return ['TREG ' + shortT(truceT), '#c6ff3a'];
    case 'dead':
      return ['MORTO', '#6a5f80'];
  }
  return ['', ''];
}

function drawTopBar() {
  const E = nightE();
  panel(206, 4, 334, 36);
  txt(hhmm(E), 212, 8, E >= NIGHT ? '#ffb03c' : '#ffffff', 2);
  bar(212, 26, 58, 3, E / NIGHT, E >= NIGHT ? '#ffb03c' : '#7a6fff'); // avanzamento della notte verso le 06:00
  if (meta.mode === 'fast') txt('X4', 538, 8, '#9fd4ff', 1, 'right'); // modalita' veloce: orologio x4
  if (weather.int > 0.3) {

    xs = enemies.length - xn,

  txt(
    E >= NIGHT ? 'ALBA: NIENTE RINFORZI' : noSpawnT > 0 ? 'CHIESA STOP ' + fmt(noSpawnT) : 'RINFORZO ' + fmt(respawnT),

  txt('' + kills, 394, 18, '#ffffff');

  txt('' + police.filter(c => !c.leave && !c.gone).length, 448, 8, '#9fd4ff');
  icon('med', 438, 18, '#5cff7a');
  txt('' + garageMeds, 448, 18, '#5cff7a');
  if (policeOp) txt('POLIZIA ' + (10 - policeOp.left) + '/10', 384, 30, '#3a7bff');
  if (bonds.length) {
    txt('OBBL. ' + bonds.length, 470, 8, '#ffd27a');

  }
  if (radarOn) txt('RADAR', 470, 30, '#ffe03c');
  else if (advOn) txt('RADAR+', 470, 30, '#ff8a1f');
}
// azione contestuale vicino al giocatore: [tasto, testo]
function hudPrompt(p) {
  const b = body(p);
  if (p.onFoot && !p.inCar) {
    if (nearDark(b)) {
      const h = darkHint(p);
      return h[0] === '!' ? [null, h.slice(1)] : [K('use'), h];
    }
    if (nearFreeCar(b)) return [K('use'), "RUBA L'AUTO"];
  }
  const s = nearShop(b);
  if (s && !p.inCar) {
    if (shopOff(s)) return [null, s.name + ' FUORI USO ' + fmtL(s.offT)];
    if (mission && mission.carrier < 0 && s.i === mission.from)
      return [K('use'), 'PRENDI IL PACCO (' + mission.pay + '$)'];
    if (mission && mission.carrier === p.i && s.i === mission.to) return [K('use'), 'CONSEGNA IL PACCO'];
    const a = SHOP_ACT[s.type],
      h = a ? a.hint(p, s) : '';
    if (h) return h[0] === '!' ? [null, h.slice(1)] : [K('use'), h];
  }
  if (p.onFoot && !p.inCar && !p.walkPath && dist(p.fx, p.fy, p.x, p.y) < 26) return [K('mount'), 'SALI IN MOTO'];
  return null;
}
function drawHUD() {
  const p = team[active],
    pb = body(p),
    R0 = ROSTER[p.i];
  panel(4, 4, 198, 78);
  ctx.drawImage(p.por, 9, 9);
  if (p.nyx) {
    ctx.fillStyle = 'rgba(180,60,255,.4)';
    ctx.fillRect(9, 9, 24, 24);
  }
  ctx.fillStyle = p.ui;
  ctx.fillRect(8, 8, 26, 1);
  ctx.fillRect(8, 33, 26, 1);
  ctx.fillRect(8, 8, 1, 26);
  ctx.fillRect(33, 8, 1, 26);
  txt(p.nyx ? 'NYX' : p.name, 38, 9, p.nyx ? '#ff3df2' : p.ui, 2);
  txt(
    p.tuned && !p.nyx ? 'MOTO X' + (p.i === 2 ? '1.2' : '1.6') : p.nyx ? 'DEA' : p.sex,
    196,
    9,
    p.tuned ? '#ff6ec7' : '#7a6f99',
    1,
    'right',
  );
  const hmax = crewed(p) ? 2 * maxHP : maxHP, // sull'auto nera la vita di Atlas e Sel si somma
    hf = Math.min(1, p.hp / hmax);
  icon('heart', 38, 26, '#ff6e8a');
  bar(48, 27, 118, 5, hf, hpCol(hf));
  txt(Math.ceil(p.hp) + '', 196, 26, '#ffffff', 1, 'right');
  const dk = inDark(p),
    bat = dk ? dark.bat : p.bat,
    lowB = bat < 20;
  icon('bolt', 38, 36, dk ? '#b48cff' : '#3cf2ff');
  bar(48, 37, 118, 5, bat / (dk ? DARK_BAT : BAT_MAX), lowB && blink(4) ? '#ff4d6d' : dk ? '#b48cff' : '#3cf2ff');
  txt(fmt(bat), 196, 36, lowB ? '#ff4d6d' : '#ffffff', 1, 'right');
  const still = p.onFoot || Math.abs(p.v) < 4,
    gar = inGarage(p.x, p.y),
    per = gar ? (superBat ? 10 : 15) : 30;
  icon('sun', 9, 37, '#ffe03c');
  bar(18, 40, 16, 3, still && p.bat < BAT_MAX ? p.chg / per : 0, '#ffe03c');
  if (gar) txt(superBat ? 'X3' : 'X2', 10, 47, '#ff3df2');
  if (p.medOn && blink(2)) txt('+', 26, 47, '#5cff7a');
  let line,
    lc = '#c9c2e6';
  if (dk)
    line = dark.crew
      ? 'AUTO NERA: 2 COLPI ' + CAR_WPN.dmg + ' DANNI - ' + K('mount') + ' SCENDI'
      : 'AUTO NERA: RIPORTALA A TIMES SQUARE';
  else if (p.inCar)
    line =
      isCrew(p.i) && !dark
        ? 'AUTO POLIZIA: RIMESSA, COMMISSARIATO O MECCANICO'
        : 'AUTO POLIZIA: RIMESSA O COMMISSARIATO';
  else if (p.onFoot)
    line = p.walkPath ? 'TORNA ALLA MOTO...' : 'A PIEDI - PUGNI ' + (p.punch.dmg + dmgBonus(p)) + ' DANNI';
  else if (p.bat <= 0) {
    line = 'BATTERIA SCARICA';
    lc = '#ff4d6d';
  } else if (p.wpn && p.wpn.k === 'laser')
    line = 'SPADA LASER: MORTALE' + (p.weapons.length > 1 ? ' [' + K('weapon') + ']' : '');
  else
    line = p.wpn
      ? p.wpn.label +
        ' ' +
        (p.wpn.dmg + dmgBonus(p)) +
        ' DANNI' +
        (p.weapons.length > 1 ? ' [' + K('weapon') + ']' : '')
      : 'NESSUNA ARMA - ' + K('mount') + ' PER I PUGNI';
  txt(line, 38, 47, lc);
  icon('med', 38, 57, '#5cff7a');
  pips(47, 58, p.meds, 3, '#5cff7a');
  icon('bolt', 64, 57, p.nitroT > 0 ? '#3cf2ff' : '#ffb03c');
  pips(73, 58, p.nitro, 5, '#ffb03c');
  if (p.nitroT > 0) txt(Math.ceil(p.nitroT) + 'S', 96, 57, '#3cf2ff');
  icon('shield', 116, 57, p.shield ? '#9fd4ff' : '#3a3350');
  txt(p.shield ? (p.shieldT === null ? 'PRONTO' : fmt(p.shieldT)) : '-', 126, 57, p.shield ? '#9fd4ff' : '#4e4566');
  if (trained.includes(p.i)) txt('+2', 196, 57, '#3fd46b', 1, 'right');
  // riga speciale del personaggio
  let sp = null,
    sc = '#7a6f99';
  if (p.nyx) {
    sp = 'NYX: -10 VITA/MIN - FEDELI ' + enemies.filter(e => e.follow).length;
    sc = '#ff3df2';
  } else if (dk && dark.crew) {
    sp = ROSTER[mateOf(p.i)].name + ' SPARA CON LE DOPPIE PISTOLE';
    sc = '#d8b8ff';
  } else if (p.wpn && p.wpn.k === 'laser' && !p.onFoot && !p.inCar) {
    if (p.lchg > 0) {
      txt('CARICA', 38, 68, '#ff8a1f');
      bar(78, 69, 88, 4, p.lchg / p.wpn.chg, '#ff8a1f');
    } else {
      sp = 'TIENI ' + K('attack') + ': SI FERMA E CARICA 1S';
      sc = '#ff8a1f';
    }
  } else if (R0.laserShield && !p.onFoot && !p.inCar) {
    sp = 'SCUDO LASER: OGNI COLPO -1';
    sc = '#ffd21f';
  } else if (isLeader(p.i) && inGarage(pb.x, pb.y)) {
    sp = K('recall') + ': RICHIAMA TUTTI IN RIMESSA';
    sc = p.ui;
  } else if (p.i === 2 && inGarage(pb.x, pb.y)) {
    sp = K('recall') + (blockT > 0 ? ': ANNULLA IL BLOCK ' + fmt(blockT) : ': BLOCK 30 MIN (NESSUNO RIENTRA)');
    sc = '#f2f2f2';
  }
  if (sp) txt(sp, 38, 68, sc);
  drawTopBar();
  // bussola
  const cx = VW - 34,
    cy = 36;
  ctx.drawImage(compassCv, cx - 30, cy - 30);
  txt('N', cx, cy - 24, '#ffffff', 1, 'center', '');
  txt('S', cx, cy + 18, '#7a6f99', 1, 'center', '');
  txt('E', cx + 21, cy - 3, '#7a6f99', 1, 'center', '');
  txt('O', cx - 21, cy - 3, '#7a6f99', 1, 'center', '');
  let ne = null,
    nd = 1e9;
  for (const e of enemies) {
    if (e.follow && p.nyx) continue;
    const b = body(e);
    const d = dist(b.x, b.y, pb.x, pb.y);
    if (d < nd) {
      nd = d;
      ne = b;
    }
  }
  const needle = (a, col, len) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(len, 0);
    ctx.lineTo(-3, -5);
    ctx.lineTo(0, 0);
    ctx.lineTo(-3, 5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  };
  let capE = null,
    cd2 = 1e9,
    capB = null;
  for (const t of team) {
    if (t.status !== 'captured') continue;
    const e = enemies.find(e => e.id === t.captor);
    if (!e) continue;
    const d = dist(e.x, e.y, pb.x, pb.y);
    if (d < cd2) {
      cd2 = d;
      capE = e;
      capB = t;
    }
  }
  if (capE) needle(Math.atan2(capE.y - pb.y, capE.x - pb.x), '#ff3df2', 14);
  if (stad && stad.phase === 'ransom') needle(Math.atan2(stadium.cy - pb.y, stadium.cx - pb.x), '#ff6ec7', 18);
  const gold = enemies.find(e => e.kind === 'gold');
  if (gold) needle(Math.atan2(gold.y - pb.y, gold.x - pb.x), XK.gold.c, 16);
  if (ne) {
    needle(Math.atan2(ne.y - pb.y, ne.x - pb.x), ACID, 19);
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 1, cy - 1, 2, 2);
    txt('XENO ' + Math.round(nd / 8) + 'M', cx, cy + 32, nd < 260 && blink(4) ? '#ff4d6d' : ACID, 1, 'center');
  } else txt('NESSUN XENO', cx, cy + 32, '#7a6f99', 1, 'center');
  let my2 = cy + 42;
  if (capE) {
    txt('RAPITO ' + capB.name + ' ' + Math.round(cd2 / 8) + 'M', VW - 4, my2, '#ff3df2', 1, 'right');
    txt(fmtL(capB.capT), VW - 4, my2 + 9, '#ff3df2', 1, 'right');
    my2 += 20;
  }
  if (mission) {
    const t = missionTarget();
    if (mission.carrier < 0 || mission.carrier === active) {
      needle(Math.atan2(t.y - pb.y, t.x - pb.x), '#ffe03c', 11);
      txt(
        (mission.carrier < 0 ? 'PACCO DA ' : 'CONSEGNA A ') +
          t.name +
          ' ' +
          Math.round(dist(t.x, t.y, pb.x, pb.y) / 8) +
          'M',
        VW - 4,
        my2,
        '#ffe03c',
        1,
        'right',
      );
    } else txt('PACCO CON ' + team[mission.carrier].name, VW - 4, my2, '#ffe03c', 1, 'right');
    txt('MISSIONE ' + mission.pay + '$ - ' + fmt(missionT), VW - 4, my2 + 9, '#ffe03c', 1, 'right');
    my2 += 20;
  }
  if (radarOn) {
    for (const ty of ['pharm', 'mech', 'shop']) {
      let best = null,
        bd = 1e9;
      for (const s of shops) {
        if (s.type !== ty) continue;
        const d = dist(s.x, s.y, pb.x, pb.y);
        if (d < bd) {
          bd = d;
          best = s;
        }
      }
      if (!best) continue;
      const c = SHOP_T[ty].c;
      needle(Math.atan2(best.y - pb.y, best.x - pb.x), c, 9);
      txt(SHOP_T[ty].name + ' ' + Math.round(bd / 8) + 'M', VW - 4, my2, c, 1, 'right');
      my2 += 9;
    }
  }
  if (advOn) {
    const r = radarPos(pb);

let logo = null;
function makeLogo() {
  const sc = 10,
    t = 'NYX',
    w = t.length * 6 * sc,
    h = 8 * sc;
  const c = mk(w + 8, h + 8),
    g = c.getContext('2d');
  glyphs(g, t, 6, 6, sc, '#2a0b3d');
  glyphs(g, t, 3, 3, sc, '#3cf2ff');
  const m = mk(w, h),
    mg = m.getContext('2d');
  glyphs(mg, t, 0, 0, sc, '#fff');
  mg.globalCompositeOperation = 'source-in';
  const gr = mg.createLinearGradient(0, 0, 0, 7 * sc);
  gr.addColorStop(0, '#ffe03c');
  gr.addColorStop(0.5, '#ff3df2');
  gr.addColorStop(1, '#7a2bff');
  mg.fillStyle = gr;
  mg.fillRect(0, 0, w, h);
  mg.globalCompositeOperation = 'destination-out';
  for (let y = Math.floor(3.6 * sc), k = 1; y < 7 * sc; y += 4 + k, k++) mg.fillRect(0, y, w, k > 3 ? 2 : 1);
  g.drawImage(m, 0, 0);
  return c;
}

// ---------- opzioni ----------
let optMenu = null; // {sel, sub:{sel,slot,listen}}
const OPT_ITEMS = [
  {
    n: 'VOLUME MUSICA',
    v: () => bar10(SET.music),
    adj: d => {
      SET.music = clamp(SET.music + d, 0, 10);
      applyVolumes();
    },
  },
  {
    n: 'VOLUME EFFETTI',
    v: () => bar10(SET.sfx),
    adj: d => {
      SET.sfx = clamp(SET.sfx + d, 0, 10);

    },
  },
  {
    n: 'RIDUCI LAMPEGGI',
    v: () => (SET.lowFlash ? 'SI' : 'NO'),
    adj: () => {
      SET.lowFlash = !SET.lowFlash;
    },
  },
  {
    n: 'EFFETTO CRT',
    v: () => (SET.crt ? 'SI' : 'NO'),
    adj: () => {
      SET.crt = !SET.crt;
      applyCRT();
    },
  },
  {
    n: 'SCOSSE DELLA CAMERA',
    v: () => (SET.shake ? 'SI' : 'NO'),
    adj: () => {
      SET.shake = !SET.shake;
    },
  },
  {
    n: 'VIBRAZIONE GAMEPAD',
    v: () => (SET.vibration ? 'SI' : 'NO'),
    adj: () => {
      SET.vibration = !SET.vibration;
      if (SET.vibration) rumble(200, 0.6);

  { n: 'SCHERMO INTERO', v: () => (document.fullscreenElement ? 'SI' : 'NO'), ok: () => toggleFS() },

    v: () => '>',
    ok: () => {
      optMenu.sub = { sel: 0, slot: 0, listen: false };
    },
  },
  {
    n: 'RIPRISTINA TASTI PREDEFINITI',
    v: () => '',
    ok: () => {
      resetBinds();
      toast('TASTI RIPRISTINATI');
    },
  },
  {
    n: 'INDIETRO',
    v: () => '',
    ok: () => {
      optMenu = null;
    },
  },
];
const bar10 = v => '[' + '|'.repeat(v) + ' '.repeat(10 - v) + '] ' + v;
const BIND_LIST = Object.keys(DEFAULT_BINDS);
function optionsInput() {
  const m = optMenu;
  if (!m) return;
  if (m.sub) {
    const sb = m.sub;
    if (sb.listen) return; // in attesa del tasto: lo cattura input.js
    if (mhit('up')) sb.sel = (sb.sel + BIND_LIST.length - 1) % BIND_LIST.length;
    if (mhit('down')) sb.sel = (sb.sel + 1) % BIND_LIST.length;
    if (mhit('left') || mhit('right')) sb.slot = 1 - sb.slot;
    if (mhit('del')) {
      const a = BIND_LIST[sb.sel];
      SET.binds[a][sb.slot] = '';
      saveSettings();
    }
    if (mhit('back')) {
      m.sub = null;
      saveSettings();
      return;
    }
    if (mhit('ok')) {
      sb.listen = true;
      const a = BIND_LIST[sb.sel],
        slot = sb.slot;
      rebindCb = code => {
        sb.listen = false;
        if (code !== 'Escape') bindKey(a, slot, code);
        clearPressed();
      };
    }
    return;
  }
  if (mhit('up')) m.sel = (m.sel + OPT_ITEMS.length - 1) % OPT_ITEMS.length;
  if (mhit('down')) m.sel = (m.sel + 1) % OPT_ITEMS.length;
  const it = OPT_ITEMS[m.sel];
  if (it.adj) {
    if (mhit('left')) {
      it.adj(-1);
      saveSettings();
    }
    if (mhit('right')) {
      it.adj(1);
      saveSettings();
    }
    if (mhit('ok')) {
      it.adj(1);
      saveSettings();
    }
  } else if (mhit('ok')) it.ok();
  if (mhit('back') || mhit('opts')) {
    optMenu = null;
    saveSettings();
  }
}
function drawOptions() {
  const m = optMenu;
  ctx.fillStyle = 'rgba(5,3,12,.9)';
  ctx.fillRect(0, 0, VW, VH);
  if (m.sub) {
    const sb = m.sub;
    txt('RIMAPPA I TASTI', VW / 2, 8, '#ff3df2', 2, 'center', '#2a0b3d');
    txt('AZIONE', 110, 30, '#7a6f99');
    txt('TASTO 1', 330, 30, '#7a6f99');
    txt('TASTO 2', 420, 30, '#7a6f99');
    txt('GAMEPAD', 510, 30, '#7a6f99');
    BIND_LIST.forEach((a, i) => {
      const y = 42 + i * 13,
        on = i === sb.sel;
      if (on) {
        ctx.fillStyle = 'rgba(255,61,242,.16)';
        ctx.fillRect(100, y - 3, 500, 13);
      }
      txt(ACTION_NAMES[a], 110, y, on ? '#ffffff' : '#c9c2e6');
      for (let s = 0; s < 2; s++) {
        const sel = on && sb.slot === s;
        const lbl = sel && sb.listen ? (blink(4) ? '...' : '') : keyLabel(SET.binds[a][s]);
        if (sel) {
          ctx.fillStyle = '#ffe03c';
          ctx.fillRect(326 + s * 90, y - 2, 70, 11);
          ctx.fillStyle = '#0b0814';
          ctx.fillRect(327 + s * 90, y - 1, 68, 9);
        }
        txt(lbl, 330 + s * 90, y, sel ? '#ffe03c' : '#ffffff');
      }
      txt((PAD.ps && PADN_PS[a]) || PADN_X[a] || '-', 510, y, '#7a6f99');
    });
    txt(
      sb.listen
        ? 'PREMI IL NUOVO TASTO - ESC ANNULLA'
        : '↑↓ AZIONE  ←→ TASTO 1/2  ' + KM('ok') + ' CAMBIA  ' + KM('del') + ' TOGLI  ' + KM('back') + ' INDIETRO',
      VW / 2,
      VH - 24,
      '#ffe03c',
      1,
      'center',
    );
    txt('I PULSANTI DEL GAMEPAD SONO FISSI (MAPPATURA STANDARD)', VW / 2, VH - 12, '#7a6f99', 1, 'center');
    return;
  }
  txt('OPZIONI', VW / 2, 40, '#ff3df2', 3, 'center', '#2a0b3d');
  OPT_ITEMS.forEach((it, i) => {
    const y = 86 + i * 20,
      on = i === m.sel;
    if (on) {
      ctx.fillStyle = 'rgba(255,61,242,.16)';
      ctx.fillRect(150, y - 5, 340, 17);
      txt('>', 156, y, '#ffffff');
    }
    txt(it.n, 170, y, on ? '#ffffff' : '#c9c2e6');
    txt(it.v(), 470, y, on ? '#ffe03c' : '#7a6f99', 1, 'right');
  });
  txt(
    '↑↓ SCEGLI  ←→ CAMBIA  ' + KM('ok') + ' CONFERMA  ' + KM('back') + ' INDIETRO',
    VW / 2,
    VH - 24,
    '#ffe03c',
    1,
    'center',
  );
}

</script>
<script>
// ===== js/main.js =====
'use strict';
// =====================================================================
//  MAIN LOOP: logica a timestep fisso (120 Hz), disegno a ogni frame
//  - la fisica non dipende piu' dal framerate
//  - hit-stop: il mondo si ferma per qualche centesimo sui colpi forti
// =====================================================================
const STEP = 1 / 120,
  MAX_STEPS = 8;
genCity(Math.floor(Math.random() * 1e9));
let last = performance.now(),
  acc = 0;
// scelta della modalita' dopo il biker: classica, veloce (orologio x4), tutorial
const MODES = [
  { id: 'classic', name: 'CLASSICA', d: '1 MINUTO DI GIOCO = 1 MINUTO DI NOTTE (12 ORE)' },
  { id: 'fast', name: 'VELOCE X4', d: "L'OROLOGIO CORRE X4 (3 ORE) - RINFORZI SEMPRE OGNI MINUTO" },
  { id: 'tutorial', name: 'TUTORIAL', d: 'IMPARA I COMANDI PASSO PASSO - NESSUN SALVATAGGIO' },
];
let modeMenu = null; // {sel}
function modeInput() {
  const m = modeMenu;
  if (mhit('up') || mhit('left')) m.sel = (m.sel + MODES.length - 1) % MODES.length;
  if (mhit('down') || mhit('right')) m.sel = (m.sel + 1) % MODES.length;
  for (let k = 0; k < MODES.length; k++) if (pressed.has('Digit' + (k + 1))) m.sel = k;
  if (mhit('ok')) {
    modeMenu = null;
    newGame(sel, MODES[m.sel].id);
    resetWeather();
  } else if (mhit('back')) modeMenu = null;
}
function titleInput() {
  if (modeMenu) return modeInput();
  if (mhit('right')) sel = (sel + 1) % NB;
  if (mhit('left')) sel = (sel + NB - 1) % NB;
  if (mhit('down') || mhit('up')) sel = (sel + NB / 2) % NB;
  const live = saved && !saved.meta.ended;
  if (mhit('del')) {
    if (saved) {
      if (delArm > 0) {
        delSave();
        saved = null;
        meta = null;
        delArm = 0;
        titleMsg = 'SALVATAGGIO CANCELLATO';
      } else {
        delArm = 2.5;
        titleMsg = 'PREMI DI NUOVO ' + KM('del') + ' PER CANCELLARE';
      }
    }
  }
  if (take('options') || mhit('opts')) {
    optMenu = { sel: 0, sub: null };
    return;
  }
  if (mhit('ok')) {
    if (live) loadGame(saved);
    else modeMenu = { sel: 0 };
  }
}
function gunInput() {
  const g = gunMenu,
    p = team[active];
  let pick = -1;
  for (let k = 0; k < g.opts.length; k++)
    if (pressed.has('Digit' + (k + 1)) || pressed.has('Numpad' + (k + 1))) pick = k;
  if (mhit('up')) g.sel = (g.sel + g.opts.length - 1) % g.opts.length;
  if (mhit('down')) g.sel = (g.sel + 1) % g.opts.length;
  if (mhit('ok')) pick = g.sel;
  if (pick >= 0) {
    if (money >= 10000) {
      money -= 10000;
      p.weapons.push(g.opts[pick]);
      p.wi = p.weapons.length - 1;
      setW(p);
      sfx('cash');
      msg(p.name + ' HA UNA NUOVA ARMA: ' + p.wpn.label + ' (' + K('weapon') + ' PER CAMBIARE)', p.ui);
    }
    gunMenu = null;
  } else if (mhit('back') || take('use')) gunMenu = null;
}
function frame(t) {
  const rdt = Math.min(0.25, Math.max(0, (t - last) / 1000));
  last = t;
  T += rdt;
  delArm = Math.max(0, delArm - rdt);
  toastT = Math.max(0, toastT - rdt);
  pollPad(rdt);
  if (take('music')) musicOn = !musicOn;
  if (take('mute')) {
    muted = !muted;
    setRainVol(weather.int);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  let stepped = false,
    frozen = false;
  if (optMenu) {
    frozen = true;
    optionsInput();
    if (state === 'title') drawTitle(0);
    else drawWorld(cam.x, cam.y, 0);
    if (optMenu) drawOptions();
  } else if (state === 'title') {
    titleInput();
    if (state === 'title') drawTitle(rdt);
  } else if (state === 'play' || state === 'wait') {
    if (gunMenu) gunInput();
    else if (listMenu) listInput();
    else if (paused) {
      if (take('pause') || mhit('back')) paused = false;
      else if (take('options') || mhit('opts')) optMenu = { sel: 0, sub: null };
    } else if (mapOpen) {
      if (take('map') || mhit('back')) mapOpen = false;
    } else if (take('map')) {
      mapOpen = true;
      tutNote('map');
    } else if (take('options')) optMenu = { sel: 0, sub: null };
    else if (state === 'play' && take('pause')) paused = true;
    frozen = paused || mapOpen || !!gunMenu || !!listMenu || !!optMenu;
    if (!frozen) {
      if (hitStop > 0) hitStop = Math.max(0, hitStop - rdt);
      else {
        acc += rdt;
        let n = 0;
        while (acc >= STEP && n < MAX_STEPS) {
          update(STEP);
          n++;
          acc -= STEP;
          if (n === 1) {
            clearPressed();
            stepped = true;
          }
          if (state !== 'play' && state !== 'wait') break;
        }
        if (n >= MAX_STEPS) acc = 0;
      }
    } // troppo lento: si rallenta invece di "saltare"
    if (pendingFast) {
      pendingFast = false;
      newGame(2, meta.mode || 'classic');
      meta.gameT = 11 * 3600;
      meta.fast = true;
      msgs = [];
      msg('NOTTE VELOCE! SI RIPARTE ALLE 05:00', '#9fd4ff');
      msg("RESISTI FINO ALL'ALBA", '#ffe03c');
      saveGame();
    }
    if (state === 'play') {
      drawWorld(cam.x, cam.y, frozen ? 0 : rdt);
      drawHUD();
      if (optMenu) drawOptions();
      else if (gunMenu) drawGunMenu();
      else if (listMenu) drawListMenu();
      else if (mapOpen) drawBigMap();
      else if (paused) drawPause();
    } else if (state === 'wait') {
      drawWorld(cam.x, cam.y, rdt);
      drawWait();
      if (mapOpen) drawBigMap();
    } else {
      drawWorld(cam.x, cam.y, rdt);
      drawEnd();
    }
  } else if (state === 'end') {
    drawWorld(cam.x, cam.y, rdt);
    drawEnd();
    if (mhit('ok')) {
      saved = readSave();
      state = 'title';
      titleMsg = '';
    }
  }
  if (toastT > 0) strip(toastMsg, VW / 2, 4, '#3cf2ff', 0.85);
  // i tasti premuti restano validi finche' un passo di logica non li ha letti
  if (stepped || frozen || !(state === 'play' || state === 'wait')) clearPressed();
  requestAnimationFrame(frame);
}
addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'play' || state === 'wait')) {
    saveGame();
    if (state === 'play') paused = true;
  }
});
addEventListener('pagehide', () => {
  if (state === 'play' || state === 'wait') saveGame();
});
requestAnimationFrame(frame);

</script>
