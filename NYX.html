//  NEW YORK XENO (NYX) — post-cyberpunk top-down bike brawler, 199X style

const cv = document.getElementById('c'),
  ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const VW = 640,
  VH = 360,
  CELL = 16,

  BL = 16;
const WPX = MW * CELL,
  HPX = MH * CELL;
let BAT_MAX = 180; // 300 (5 minuti) dopo il colpo delle batterie di Melanie
let viewScale = 1;
function fit() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  const k = s >= 1 ? Math.floor(s) : s;
  viewScale = k;
  const w = VW * k,
    h = VH * k;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  const wr = document.getElementById('wrap');
  wr.style.width = w + 'px';
  wr.style.height = h + 'px';
  // passo delle scanline legato alla scala: niente moire
  const crt = document.getElementById('crt');
  if (crt) {
    const p = Math.max(2, Math.round(k * 1.5));
    crt.style.background =
      'repeating-linear-gradient(to bottom,rgba(0,0,0,.20) 0,rgba(0,0,0,.20) ' +
      Math.max(1, Math.round(k / 2)) +
      'px,transparent ' +
      Math.max(1, Math.round(k / 2)) +
      'px,transparent ' +
      p +
      'px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.6) 100%)';

}

// ---------- utils ----------
function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry(1);
const rr = () => rng(),
  ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
const pickR = (r, a) => a[Math.floor(r() * a.length)];
const R = Math.random;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b, c, d) => Math.hypot(c - a, d - b);
function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}
function hx(h) {
  h = h.replace('#', '');
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
function shade(h, f) {
  const c = hx(h).map(v => (f >= 0 ? v + (255 - v) * f : v * (1 + f)));
  return (
    '#' +
    c
      .map(v =>
        Math.round(clamp(v, 0, 255))
          .toString(16)
          .padStart(2, '0'),
      )
      .join('')
  );
}
function hash(n) {
  n = Math.imul(n ^ 61 ^ (n >>> 16), 9);
  n = n + (n << 3);
  n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d);
  n = n ^ (n >>> 15);
  return (n >>> 0) / 4294967296;
}
function pc(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy));
    g.fillRect(cx - w, cy + dy, 2 * w + 1, 1);
  }
}
const fmt = s => {
  s = Math.max(0, Math.ceil(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
// compatta un array sul posto (niente nuove allocazioni ogni frame)
function compact(a, keep) {
  let j = 0;
  for (let i = 0; i < a.length; i++) {
    const v = a[i];
    if (keep(v)) a[j++] = v;
  }
  a.length = j;
  return a;
}
// lampeggio: con "riduci lampeggi" attivo resta sempre acceso
let T = 0;
const blink = n => (typeof SET !== 'undefined' && SET.lowFlash ? 1 : Math.floor(T * n) % 2);

// ---------- bitmap font 5x7 ----------
const FONT_SRC = {

  B: '11110 10001 10001 11110 10001 10001 11110',
  C: '01110 10001 10000 10000 10000 10001 01110',

  G: '01110 10001 10000 10111 10001 10001 01111',
  H: '10001 10001 10001 11111 10001 10001 10001',

  J: '00111 00010 00010 00010 00010 10010 01100',
  K: '10001 10010 10100 11000 10100 10010 10001',

const GL = {};
for (const k in FONT_SRC) GL[k] = FONT_SRC[k].split(' ').map(r => parseInt(r, 2));
const norm = s => String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function glyphs(g, s, x, y, sc, col) {
  g.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const gl = GL[s[i]] || GL[' '];
    for (let r = 0; r < 7; r++) {
      const row = gl[r];
      if (!row) continue;
      for (let j = 0; j < 5; j++) if (row & (1 << (4 - j))) g.fillRect(x + (i * 6 + j) * sc, y + r * sc, sc, sc);
    }
  }
}
// atlante di glifi: un canvas per colore/scala/ombra con tutti i caratteri.
// Il testo dinamico (timer, soldi, distanze) non crea piu' canvas nuovi.
const GCHARS = Object.keys(FONT_SRC),
  GIDX = {};
GCHARS.forEach((c, i) => (GIDX[c] = i));
const atlases = new Map();
function atlas(col, sc, shadow) {
  const key = col + '|' + sc + '|' + shadow;
  let a = atlases.get(key);
  if (a) return a;
  a = mk(GCHARS.length * 6 * sc, 8 * sc);
  const g = a.getContext('2d');
  GCHARS.forEach((ch, i) => {
    if (shadow) glyphs(g, ch, i * 6 * sc + sc, sc, sc, shadow);
    glyphs(g, ch, i * 6 * sc, 0, sc, col);
  });
  atlases.set(key, a);
  return a;
}
function textW(s, sc) {
  return norm(s).length * 6 * sc - sc;
}
// testo ibrido: le stringhe fisse sono copiate da una cache (una sola drawImage),
// quelle con numeri (timer, soldi, distanze) sono composte dall'atlante senza allocare canvas
const tcache = new Map(),
  HAS_DIGIT = /\d/;
function txt(s, x, y, col = '#fff', sc = 1, align = 'left', shadow = '#000') {
  s = norm(s);
  const cw = 6 * sc,
    w = s.length * cw;
  let dx = x;
  if (align === 'center') dx = x - (w >> 1);
  else if (align === 'right') dx = x - w;
  dx = Math.round(dx);
  y = Math.round(y);
  if (HAS_DIGIT.test(s)) {
    const a = atlas(col, sc, shadow);
    for (let i = 0; i < s.length; i++) {
      const k = GIDX[s[i]];
      if (k === undefined || s[i] === ' ') continue;
      ctx.drawImage(a, k * cw, 0, cw, 8 * sc, dx + i * cw, y, cw, 8 * sc);
    }
    return;
  }
  const key = s + '|' + col + '|' + sc + '|' + shadow;
  let c = tcache.get(key);
  if (!c) {
    const a = atlas(col, sc, shadow);
    c = mk(Math.max(1, w), 8 * sc);
    const g = c.getContext('2d');
    for (let i = 0; i < s.length; i++) {
      const k = GIDX[s[i]];
      if (k !== undefined && s[i] !== ' ') g.drawImage(a, k * cw, 0, cw, 8 * sc, i * cw, 0, cw, 8 * sc);
    }
    tcache.set(key, c);
    if (tcache.size > 900) tcache.delete(tcache.keys().next().value);
  }
  ctx.drawImage(c, dx, y);
}

}

<script>
// ===== js/city.js =====
'use strict';
// ---------- city generation ----------
let ys, bands, solid, kind, blocks, nodes, edges, garage, neons, lamps, miniCv, stadium, landmarks;
// kind: 0 building,1 road,2 sidewalk,3 park,4 garage,5 campo stadio,6 tribune,7 piazza,8 lago
// isolati fissi: rimessa con Times Square e Central Park sul lato ovest, stadio di baseball
const GAR_W = 12,
  GAR_H = 16, // la fascia della rimessa e' alta 16 celle (ci stanno anche piazza e parco)
  TSQ_W = 18,
  CPK_W = 32,
  STD_W = 24,
  STD_H = 18,
  STD_GATE = 3; // larghezza delle 3 entrate (celle)
// posizioni (strade) tra a e b, con isolati da lo..hi celle; fn opzionale per spostare n
function fillLine(a, b, lo, hi, fn) {
  const out = [];
  let x = a;
  for (;;) {
    let n = x + RW + ri(lo, hi);
    if (fn) n = fn(n);
    if (n + RW + lo > b) break;
    out.push(n);
    x = n;
  }
  return out;
}
function genCity(seed) {
  rng = mulberry(seed);
  // fascia della rimessa al centro, fascia dello stadio a nord o a sud
  const c0 = Math.round(MH / 2 - (RW + GAR_H) / 2),
    c1 = c0 + RW + GAR_H;
  const north = rr() < 0.5;
  const s0 = north ? ri(40, 120) : ri(c1 + 50, MH - RW - (RW + STD_H) - 40),
    s1 = s0 + RW + STD_H;
  const fixed = north
    ? [
        [s0, s1],
        [c0, c1],
      ]
    : [
        [c0, c1],
        [s0, s1],
      ];
  ys = [0];
  for (const [a, b] of fixed) {

// ---------- rotazioni pre-calcolate (32 angoli, campionamento nearest centrato) ----------
// evita i pixel che "ballano" ruotando sprite minuscole a runtime
const ROT_N = 32,
  rotCache = new WeakMap();
function rotSet(src) {
  let rs = rotCache.get(src);
  if (rs) return rs;
  const w = src.width,
    h = src.height,
    S = Math.ceil(Math.hypot(w, h)) + 2 + ((Math.ceil(Math.hypot(w, h)) + 2) % 2);
  const sd = src.getContext('2d').getImageData(0, 0, w, h).data;
  rs = { S, f: [], sh: [] };
  for (let k = 0; k < ROT_N; k++) {
    const a = (k / ROT_N) * Math.PI * 2,
      ca = Math.cos(a),
      sa = Math.sin(a);
    const c = mk(S, S),
      g = c.getContext('2d'),
      id = g.createImageData(S, S),
      d = id.data;
    const s2 = mk(S, S),
      g2 = s2.getContext('2d'),
      id2 = g2.createImageData(S, S),
      d2 = id2.data;
    for (let y = 0; y < S; y++)
      for (let x = 0; x < S; x++) {
        const dx = x + 0.5 - S / 2,
          dy = y + 0.5 - S / 2;
        const sx = Math.floor(dx * ca + dy * sa + w / 2),
          sy = Math.floor(-dx * sa + dy * ca + h / 2);
        if (sx < 0 || sy < 0 || sx >= w || sy >= h) continue;
        const si = (sy * w + sx) * 4,
          o = (y * S + x) * 4;
        if (sd[si + 3] < 10) continue;
        d[o] = sd[si];
        d[o + 1] = sd[si + 1];
        d[o + 2] = sd[si + 2];
        d[o + 3] = sd[si + 3];
        d2[o + 3] = 255;
      }
    g.putImageData(id, 0, 0);
    g2.putImageData(id2, 0, 0);
    rs.f.push(c);
    rs.sh.push(s2);
  }
  rotCache.set(src, rs);
  return rs;
}

// ===== js/audio.js =====
'use strict';
// ---------- audio ----------
// catena: effetti -> sfxBus \
//                             > master -> compressore -> uscita
//         musica  -> musicGain/
let AC = null,
  master = null,
  musicGain = null,
  sfxBus = null,
  comp = null,
  noiseBuf = null,
  musicOn = true,
  muted = false,
  nextT = 0,
  step = 0;

  rainGain = null;

  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    return;
  }
  comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.knee.value = 10;
  comp.ratio.value = 6;
  comp.attack.value = 0.003;
  comp.release.value = 0.18;
  comp.connect(AC.destination);
  master = AC.createGain();
  master.gain.value = 0.5;
  master.connect(comp);
  musicGain = AC.createGain();
  musicGain.connect(master);
  sfxBus = AC.createGain();
  sfxBus.connect(master);
  applyVolumes();
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // pioggia: rumore filtrato in loop, il volume segue l'intensita'
  const rb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate),
    rd = rb.getChannelData(0);
  for (let i = 0; i < rd.length; i++) rd[i] = Math.random() * 2 - 1;
  rainSrc = AC.createBufferSource();
  rainSrc.buffer = rb;
  rainSrc.loop = true;
  const f = AC.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = 2600;
  f.Q.value = 0.5;
  rainGain = AC.createGain();
  rainGain.gain.value = 0;
  rainSrc.connect(f);
  f.connect(rainGain);
  rainGain.connect(sfxBus);
  rainSrc.start();
  setInterval(schedule, 40);
}
function applyVolumes() {
  if (!AC) return;
  musicGain.gain.value = (0.2 * SET.music) / 10;
  sfxBus.gain.value = SET.sfx / 7;
}
function setRainVol(v) {
  if (rainGain) rainGain.gain.setTargetAtTime(muted ? 0 : v * 0.06, AC.currentTime, 0.4);
}

function tone(f, type, t, dur, vol, f2, dest) {
  const o = AC.createOscillator(),

  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  o.stop(t + dur + 0.02);

  f.frequency.value = freq || 2000;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

const SFX_GAP = {
  hit: 0.045,
  punch: 0.04,
  shoot: 0.035,
  rapid: 0.03,
  bump: 0.08,
  boom: 0.06,
  alert: 0.25,
  hurt: 0.06,
  slash: 0.04,
  whip: 0.05,

const sfxLast = {};

  sfxLast[n] = t;

    case 'shoot':
      tone(900, 'square', t, 0.09, 0.07, 200);
      break;
    case 'rapid':
      tone(1400, 'square', t, 0.05, 0.05, 500);
      break;
    case 'slash':
      noise(t, 0.1, 0.12, 3000, 'bandpass');
      break;
    case 'whip':
      noise(t, 0.14, 0.12, 4500, 'highpass');
      tone(1800, 'sine', t, 0.06, 0.03, 600);
      break;
    case 'punch':
      noise(t, 0.08, 0.2, 900);
      tone(140, 'sine', t, 0.08, 0.15, 60);
      break;
    case 'hit':
      tone(220, 'square', t, 0.05, 0.05, 120);
      break;
    case 'hurt':
      tone(160, 'sawtooth', t, 0.15, 0.08, 70);
      break;
    case 'boom':
      noise(t, 0.5, 0.3, 1200);
      tone(90, 'sine', t, 0.4, 0.2, 30);
      break;
    case 'switch':
      [0, 4, 7, 12].forEach((k, i) => tone(mf(72 + k), 'triangle', t + i * 0.05, 0.08, 0.07));
      break;
    case 'charge':
      tone(660, 'sine', t, 0.1, 0.06);
      tone(990, 'sine', t + 0.08, 0.12, 0.06);
      break;
    case 'alert':
      tone(1200, 'square', t, 0.05, 0.04);
      tone(1200, 'square', t + 0.09, 0.05, 0.04);
      break;
    case 'bump':
      noise(t, 0.08, 0.12, 500);
      break;
    case 'buy':
      [0, 7, 12].forEach((k, i) => tone(mf(76 + k), 'square', t + i * 0.06, 0.07, 0.05));
      break;
    case 'cash':
      [0, 4, 7, 12, 16].forEach((k, i) => tone(mf(79 + k), 'square', t + i * 0.05, 0.06, 0.05));
      break;
    case 'siren':
      for (let i = 0; i < 4; i++) tone(i % 2 ? 620 : 880, 'square', t + i * 0.18, 0.17, 0.035);
      break;
    case 'nitro':
      noise(t, 0.4, 0.15, 800, 'bandpass');
      tone(200, 'sawtooth', t, 0.4, 0.06, 900);
      break;
    case 'mount':
      tone(300, 'triangle', t, 0.06, 0.06, 500);
      break;
    case 'empty':
      tone(200, 'square', t, 0.2, 0.05, 100);
      break;
    case 'laserup':
      tone(180, 'sawtooth', t, 1, 0.05, 900);
      tone(360, 'sine', t, 1, 0.03, 1800);
      break;
    case 'laser':
      noise(t, 0.25, 0.25, 5000, 'bandpass');
      tone(1200, 'sawtooth', t, 0.3, 0.09, 120);
      tone(70, 'sine', t, 0.35, 0.2, 30);
      break;
    case 'lshield':
      tone(1600, 'triangle', t, 0.06, 0.05, 2400);
      break;
    case 'sneak':
      [0, 3, 7].forEach((k, i) => tone(mf(70 + k), 'triangle', t + i * 0.07, 0.06, 0.04));
      break;
    case 'menu':
      tone(880, 'square', t, 0.03, 0.03);
      break;
  }
}
const PROG = [
  [57, 60, 64],
  [53, 57, 60],
  [48, 52, 55],
  [55, 59, 62],

function schedule() {
  if (!AC || !musicOn || muted) {
    if (AC) nextT = AC.currentTime;
    return;
  }
  while (nextT < AC.currentTime + 0.15) {
    if (nextT < AC.currentTime) nextT = AC.currentTime;
    const bar = Math.floor(step / 16) % 4,
      s = step % 16,
      ch = PROG[bar];
    if (s % 2 === 0) tone(mf(ch[0] - 24 + (s % 4 === 2 ? 12 : 0)), 'sawtooth', nextT, 0.16, 0.5, 0, musicGain);
    tone(mf(ch[s % 3] + 12 + (s >= 8 ? 12 : 0)), 'square', nextT, 0.07, 0.12, 0, musicGain);
    if (s % 4 === 0) tone(120, 'sine', nextT, 0.12, 0.9, 40, musicGain);
    if (s % 8 === 4) noise(nextT, 0.12, 0.5, 3000, 'highpass', musicGain);
    nextT += 60 / 112 / 4;
    step++;
  }
}

function shopHint(s, p) {
  if (shopOff(s)) return s.name + ' FUORI USO ' + fmtL(s.offT);
  const a = SHOP_ACT[s.type];
  const h = a ? a.hint(p, s) : '';
  if (!h) return '';
  return h[0] === '!' ? h.slice(1) : K('use') + ': ' + h;
}
function useShop(p, s, b) {
  if (shopOff(s)) return msg(s.name + ' FUORI USO PER ' + fmtL(s.offT) + ' (XENO GOLD)', '#ffd21f');
  const a = SHOP_ACT[s.type];
  if (a) a.use(p, s, b);
}
function interact(p) {
  const b = body(p);
  if (hit('use')) {
    const car = p.onFoot && !p.inCar ? nearFreeCar(b) : null;
    const s = nearShop(b);
    if (p.onFoot && !p.inCar && nearDark(b)) useDark(p);
    else if (car) enterCar(p, car);
    else if (s && !p.inCar && mission && mission.carrier < 0 && s.i === mission.from) {
      mission.carrier = p.i;
      sfx('buy');
      msg('PACCO PRESO: CONSEGNALO A ' + shops[mission.to].name, '#ffe03c');
    } else if (s && !p.inCar && mission && mission.carrier === p.i && s.i === mission.to) {
      money += mission.pay;
      sfx('cash');
      pop(b.x, b.y - 20, '+' + mission.pay + '$', '#ffe03c');
      msg('PACCO CONSEGNATO: +' + mission.pay + '$', '#ffe03c');
      mission = null;
    } else if (s && !p.inCar) useShop(p, s, b);
  }
  if (p.inCar) return;
  if (hit('radar')) toggleRadar();
  if (hit('med')) {
    if (!p.meds) msg('NESSUN FARMACO CON TE', '#ffe03c');
    else if (p.medOn) msg('CURA GIA IN CORSO', '#ffe03c');
    else if (p.hp >= maxHP) msg('VITA GIA PIENA', '#5cff7a');
    else {
      p.meds--;
      p.medOn = true;
      msg('FARMACO: +25 VITA AL MINUTO', '#5cff7a');
      sfx('charge');
    }
  }
  if (hit('deliver')) {
    if (!inGarage(b.x, b.y)) msg('PORTA I FARMACI IN RIMESSA', '#ffe03c');
    else if (!p.meds) msg('NESSUN FARMACO DA CONSEGNARE', '#ffe03c');
    else {
      garageMeds += p.meds;
      msg(p.meds + ' FARMACI CONSEGNATI ALLA RIMESSA', '#5cff7a');
      p.meds = 0;
      sfx('buy');
      garageAutoMed();
    }
  }
  if (hit('nitro')) {
    if (p.onFoot) msg('IL NITRO SI USA IN MOTO', '#ffe03c');
    else if (p.nitroT > 0) msg('NITRO GIA ATTIVO', '#ffe03c');
    else if (!p.nitro) msg('NESSUN ELETTRONITRO - COMPRALO DAL MECCANICO', '#ffe03c');
    else {
      p.nitro--;
      p.nitroT = 20;
      sfx('nitro');
      msg('ELETTRONITRO! VELOCITA X2 PER 20S', '#3cf2ff');
    }
  }
  if (hit('recall')) {
    if (p.i === 2) caspianBlock(p);
    else if (!isLeader(p.i)) msg('SOLO ZEPHYR E VESPER RICHIAMANO (CASPIAN: BLOCK)', '#7a6f99');
    else if (!inGarage(b.x, b.y)) msg(p.name + ' PUO RICHIAMARE SOLO DALLA RIMESSA', '#ffe03c');
    else {
      let n = 0;
      for (const t of team)
        if (t.status === 'idle' && !inMission(t)) {
          const pl = planReturn(t);
          if (pl) {
            t.path = pl.pts;
            t.pi = 0;
            t.status = 'returning';
            t.waitT = 0;
            n++;
          }
        }
      const nc = recallCrew(); // Atlas e Sel scendono dall'auto nera e vanno a piedi alle moto
      n += nc;
      msg(n ? p.name + ' RICHIAMA TUTTI IN RIMESSA (' + n + ')' : 'NESSUN BIKER DA RICHIAMARE', p.ui);
      if (n) sfx('switch');
    }
  }
  if (hit('weapon')) {
    if (p.weapons.length > 1) {
      p.wi = (p.wi + 1) % p.weapons.length;
      setW(p);
      msg('ARMA: ' + p.wpn.label, '#ffffff');
      sfx('mount');
    } else msg("UNA SOLA ARMA - L'ARMERIA NE VENDE UNA SECONDA", '#7a6f99');
  }
}
// ---------- police car theft ----------
function enterCar(p, c) {
  c.mode = 'driven';
  p.inCar = c;
  p.walkPath = null;
  c.v = 0;
  sfx('mount');
  msg('AUTO RUBATA! PORTALA IN RIMESSA O AL COMMISSARIATO', '#3a7bff');
}
function exitCar(p, walk) {
  const c = p.inCar;
  if (!c) return;
  if (c === dark) return emptyDark(walk);
  p.inCar = null;
  if (c.mode === 'driven') {
    c.mode = 'abandoned';
    c.abT = 0;
  }
  c.v = 0;
  let fx = c.x,
    fy = c.y;
  for (const a of [c.a + Math.PI / 2, c.a - Math.PI / 2, c.a + Math.PI]) {
    const x = c.x + Math.cos(a) * 14,
      y = c.y + Math.sin(a) * 14;
    if (!blocked(x, y, 3)) {
      fx = x;
      fy = y;
      break;
    }
  }
  p.onFoot = true;
  p.fx = fx;
  p.fy = fy;
  p.fa = c.a;
  if (walk) startWalk(p);
}
function startWalk(p) {
  const pts = [];
  if (!los(p.fx, p.fy, p.x, p.y)) {
    const s = nearestNodeLOS(p.fx, p.fy),
      t = nearestNodeLOS(p.x, p.y);
    const path = dijkstra(s, t) || [];
    for (const i of path) pts.push({ x: nodes[i].x, y: nodes[i].y });
  }
  pts.push({ x: p.x, y: p.y });
  p.walkPath = pts;
  p.wpi = 0;
  msg(p.name + ' TORNA A PIEDI ALLA MOTO', '#c9c2e6');
}
function deliverCar(p, c) {
  const amt = 200 + Math.floor(R() * 201);
  money += amt;
  c.mode = 'impound';
  c.impT = 900;
  c.x = garage.cx;
  c.y = garage.cy - 4;
  c.a = 0;
  c.v = 0;
  p.inCar = null;
  p.onFoot = true;
  p.fx = garage.cx;
  p.fy = garage.cy + 18;
  sfx('cash');
  pop(garage.cx, garage.cy - 20, '+' + amt + '$', '#ffe03c');
  msg('AUTO DELLA POLIZIA IN RIMESSA: +' + amt + '$ (RESTA 15 MIN)', '#ffe03c');
  startWalk(p);
}
function copHQ(p, c) {
  const hq = shops.find(s => s.type === 'cop');
  c.gone = true;
  p.inCar = null;
  p.onFoot = true;
  p.fx = hq.x;
  p.fy = hq.y;
  if (R() < 0.3) {
    policeOp = { left: 10, t: 6 };
    msg('IL COMMISSARIO TI CREDE: LA POLIZIA CATTURERA 10 XENO!', '#3a7bff');
    sfx('siren');
    startWalk(p);
  } else {
    msg('IL COMMISSARIO NON TI CREDE: ' + p.name + ' ARRESTATO 5 MIN', '#ff4d6d');
    p.status = 'out';
    p.outR = 'ARRESTATO';
    p.outT = 300;
    toBay(p);
    leaveActive();
  }
}
function driveCar(p, c, dt, thr, brk, st) {
  const maxV = BASE * 1.15,
    acc = maxV * 1.1;
  if (thr > 0) {
    const tg = maxV * thr;
    c.v = c.v < tg ? Math.min(tg, c.v + acc * dt) : Math.max(tg, c.v - maxV * 0.6 * dt);
  } else if (brk > 0 && c.v > 0) c.v = Math.max(0, c.v - maxV * 2 * brk * dt);
  else if (brk > 0) c.v = Math.max(-maxV * 0.3, c.v - acc * 0.5 * brk * dt);
  else {
    const f = maxV * 0.6 * dt;
    c.v = Math.abs(c.v) <= f ? 0 : c.v - Math.sign(c.v) * f;
  }
  const steer = st;
  c.a += steer * 2.5 * Math.min(1, 0.3 + Math.abs(c.v) / 60) * dt * (c.v < -1 ? -1 : 1);
  if (moveCol(c, 'x', 'y', Math.cos(c.a) * c.v * dt, Math.sin(c.a) * c.v * dt, 6)) {
    if (Math.abs(c.v) > 40) {
      spark(c.x + Math.cos(c.a) * 12, c.y + Math.sin(c.a) * 12, '#ffd27a', 6, 80);
      sfx('bump');
    }
    c.v *= 0.5;
  }
  p.fx = c.x;
  p.fy = c.y;
  p.fa = c.a;
  if (policeToMech(p, c)) return; // Atlas o Sel: l'auto diventa l'auto nera
  if (inGarage(c.x, c.y)) return deliverCar(p, c);
  const hq = shops.find(s => s.type === 'cop');
  if (hq && !shopOff(hq) && dist(c.x, c.y, hq.x, hq.y) < 36) return copHQ(p, c);
  if (hit('mount')) exitCar(p, true);
}
function updatePlayer(p, dt) {
  // tastiera = 0/1, gamepad = valori analogici
  const st = axisSteer(),
    thr = axisThr(),
    brk = axisBrk(),
    atk = isDown('attack');
  p.cd -= dt;
  p.punchT -= dt;
  if (p.nitroT > 0) {
    p.nitroT -= dt;
    if (p.nitroT <= 0) msg('NITRO ESAURITO', '#7a6f99');
  }
  if (p.inCar) {
    if (p.inCar === dark) driveDark(p, dt, thr, brk, st, atk);
    else driveCar(p, p.inCar, dt, thr, brk, st);
    charge(p, dt, true);
    return;
  }
  if (!p.onFoot) {
    const boost = p.nitroT > 0 ? 2 : 1,
      maxV = speedOf(p) * boost,
      acc = maxV * 1.3,
      can = p.bat > 0;
    // spada laser: tenendo premuto l'attacco la moto frena fino a fermarsi, poi carica
    const laser = p.wpn && p.wpn.k === 'laser',
      holding = laser && atk && p.cd <= 0;
    if (holding) {
      const f = maxV * 2.4 * dt;
      p.v = Math.abs(p.v) <= f ? 0 : p.v - Math.sign(p.v) * f;
    } else if (thr > 0 && can) {
      const tg = maxV * thr;
      p.v = p.v < tg ? Math.min(tg, p.v + acc * dt) : Math.max(tg, p.v - maxV * 0.7 * dt);
    } else if (brk > 0 && p.v > 0) p.v = Math.max(0, p.v - maxV * 2.4 * brk * dt);
    else if (brk > 0 && can) p.v = Math.max(-speedOf(p) * 0.3, p.v - acc * 0.5 * brk * dt);
    else {
      const f = maxV * 0.7 * dt;
      p.v = Math.abs(p.v) <= f ? 0 : p.v - Math.sign(p.v) * f;
    }
    if (p.v > maxV) p.v = Math.max(maxV, p.v - maxV * dt);

    const lt = st * Math.min(1, Math.abs(p.v) / BASE);
    p.lean += (lt - p.lean) * Math.min(1, dt * 8);
    const hitW = moveCol(p, 'x', 'y', Math.cos(p.a) * p.v * dt, Math.sin(p.a) * p.v * dt, 5);

      if (Math.abs(p.v) > 45) {

        sfx('bump');
        shake = Math.max(shake, 2);
        rumble(90, 0.5);
      }
      p.v *= 0.5;
    }
    // segni di frenata / derapata e scia del nitro sull'asfalto

    if (p.skT <= 0) {
      p.skT = 0.03;

        addSkid(p.x, p.y, p.a, '#0b0910');
      else if (p.nitroT > 0 && p.v > 40) addSkid(p.x, p.y, p.a, '#1d5a78');
    }
    if (Math.abs(p.v) > 4 && !p.nyx) {
      p.bat = Math.max(0, p.bat - dt);
      p.chg = 0;
      if (p.bat <= 0 && !p.batWarn) {
        msg('BATTERIA SCARICA! FERMO AL SOLE O ' + K('mount') + ' PER SCENDERE', '#ff4d6d');
        p.batWarn = true;
      }
    }
    if (p.bat > 0) p.batWarn = false;
    if (p.nitroT > 0 && Math.abs(p.v) > 20)
      addPart(
        p.x - Math.cos(p.a) * 10,
        p.y - Math.sin(p.a) * 10,
        -Math.cos(p.a) * 30 + (R() - 0.5) * 20,
        -Math.sin(p.a) * 30 + (R() - 0.5) * 20,
        0.3,
        R() < 0.5 ? '#3cf2ff' : '#ffffff',
        2,
      );
    if (laser) {
      if (holding && Math.abs(p.v) < 4) {
        if (!p.lchg) sfx('laserup');
        p.lchg += dt;
        if (p.lchg >= p.wpn.chg) {
          p.lchg = 0;
          playerAttack(p);
        }
      } else p.lchg = 0;
    } else if (atk && p.wpn && p.cd <= 0) playerAttack(p);
    if (hit('mount')) {
      p.lchg = 0;
      dismount(p);
    }
    charge(p, dt, Math.abs(p.v) < 4);
  } else {
    p.lchg = 0;
    let dx = (isKey('right') ? 1 : 0) - (isKey('left') ? 1 : 0),
      dy = (isKey('down') ? 1 : 0) - (isKey('up') ? 1 : 0);
    if (!dx && !dy) {
      dx = PAD.sx;
      dy = PAD.sy;
    }
    if (dx || dy) {
      p.walkPath = null;
      const l = Math.hypot(dx, dy),
        m = Math.min(1, l);
      dx /= l;
      dy /= l;
      p.fa = Math.atan2(dy, dx);
      p.walk += dt * 12 * m;
      moveCol(p, 'fx', 'fy', dx * 48 * m * dt, dy * 48 * m * dt, 3);
    } else if (p.walkPath) {
      const q = p.walkPath[p.wpi];
      const ddx = q.x - p.fx,
        ddy = q.y - p.fy,
        d = Math.hypot(ddx, ddy),
        sp = 48 * dt;
      p.fa = Math.atan2(ddy, ddx);
      p.walk += dt * 12;
      if (d <= sp) {
        p.fx = q.x;
        p.fy = q.y;
        p.wpi++;
        if (p.wpi >= p.walkPath.length) {
          p.walkPath = null;
          p.onFoot = false;
          sfx('mount');
          msg(p.name + ' DI NUOVO IN SELLA', p.ui);
        }
      } else {
        p.fx += (ddx / d) * sp;
        p.fy += (ddy / d) * sp;
      }
    }
    if (atk && p.cd <= 0) playerPunch(p);
    if (hit('mount')) {
      if (dist(p.fx, p.fy, p.x, p.y) < 26) {
        p.onFoot = false;
        p.walkPath = null;
        sfx('mount');
      } else msg('TROPPO LONTANO DALLA MOTO', '#ffe03c');
    }
    charge(p, dt, true);
  }
}

function updateAmb(dt) {
  if (!amb) return;
  const leg = amb.legs[amb.li];
  if (!leg) {
    amb = null;
    return;
  }
  if (!amb.path) {
    const s0 = nearestNodeLOS(amb.x, amb.y),
      t0 = nearestNodeLOS(leg.x, leg.y);
    amb.path = (dijkstra(s0, t0) || []).map(i => ({ x: nodes[i].x, y: nodes[i].y }));
    amb.path.push({ x: leg.x, y: leg.y });
    amb.pi = 0;
  }
  const q = amb.path[amb.pi];
  const dx = q.x - amb.x,
    dy = q.y - amb.y,
    d = Math.hypot(dx, dy),
    sp = 170 * dt;
  if (d > 0.5) amb.a += clamp(angDiff(Math.atan2(dy, dx), amb.a), -8 * dt, 8 * dt);
  if (d <= sp) {
    amb.x = q.x;
    amb.y = q.y;
    amb.pi++;
    if (amb.pi >= amb.path.length) {
      ambAction(leg);
      amb.li++;
      amb.path = null;
      if (amb.li >= amb.legs.length) {
        amb = null;
        return;
      }
    }
  } else {
    amb.x += (dx / d) * sp;
    amb.y += (dy / d) * sp;
  }
  for (const b of amb.riders) {
    b.px = amb.x;
    b.py = amb.y;
  }
}

function newMission() {

    mission = null;

  }
  const from = pool[Math.floor(R() * pool.length)];
  const others = shops.filter(x => x.type === 'shop' && x !== from);
  const to = others[Math.floor(R() * others.length)];
  const d = dist(from.x, from.y, to.x, to.y);
  let pay = 100;
  if (d > WPX * 0.75) pay += 50;
  if (d > WPX) pay += 50;
  mission = { from: from.i, to: to.i, carrier: -1, pay };
  msg('MISSIONE: ' + from.name + ' CERCA UN CORRIERE (' + pay + '$)', '#ffe03c');
  sfx('alert');
}
function missionTarget() {
  if (!mission) return null;
  return shops[mission.carrier < 0 ? mission.from : mission.to];

function planReturn(b) {
  // dallo stadio si esce dall'entrata piu' vicina
  const g = inStadium(b.x, b.y) ? nearGate(b.x, b.y) : null;
  const s = g ? nearestNodeLOS(g.ox, g.oy) : nearestNodeLOS(b.x, b.y);
  const path = dijkstra(s, garage.node);
  if (!path) return null;
  const pts = path.map(i => ({ x: nodes[i].x, y: nodes[i].y }));
  if (g) pts.unshift({ x: g.ix, y: g.iy }, { x: g.gx, y: g.gy }, { x: g.ox, y: g.oy });
  pts.push({ x: garage.bays[b.i].x, y: garage.bays[b.i].y });
  let len = 0,
    px = b.x,
    py = b.y;
  for (const q of pts) {
    len += dist(px, py, q.x, q.y);
    px = q.x;
    py = q.y;
  }
  return { pts, len };
}
function updateMate(b, dt) {
  if (b.shield && b.shieldT !== null) {
    b.shieldT -= dt;
    if (b.shieldT <= 0) {
      b.shield = false;
      b.shieldT = null;
      msg('SCUDO NASA DI ' + b.name + ' ESAURITO', '#7a6f99');
    }
  }
  switch (b.status) {
    case 'garage':
      charge(b, dt, true);
      break;
    case 'idle':
      charge(b, dt, true);
      // BLOCK di Caspian e missione stadio: nessuno rientra da solo
      if (!zephyrWaits(b) && !holdIdle(b)) b.waitT -= dt;
      if (b.waitT <= 0 && !holdIdle(b)) {
        b.chkT -= dt;
        if (b.chkT <= 0) {
          b.chkT = 2;
          const pl = planReturn(b);
          if (pl && b.bat >= pl.len / speedOf(b) + 3) {
            b.path = pl.pts;
            b.pi = 0;
            b.status = 'returning';
            b.waitCharge = false;
          } else b.waitCharge = true;
        }
      }
      break;
    case 'returning': {
      if (!b.path) {
        b.status = 'idle';
        b.waitT = 0;
        break;
      }
      const q = b.path[b.pi];
      const dx = q.x - b.x,
        dy = q.y - b.y,
        d = Math.hypot(dx, dy);
      const sp = speedOf(b) * dt;
      b.a += clamp(angDiff(Math.atan2(dy, dx), b.a), -8 * dt, 8 * dt);
      if (d <= sp) {
        b.x = q.x;
        b.y = q.y;
        b.pi++;
        if (b.pi >= b.path.length) toBay(b, 'garage');
      } else {
        b.x += (dx / d) * sp;
        b.y += (dy / d) * sp;
        b.v = speedOf(b);
      }
      b.bat = Math.max(0, b.bat - dt);
      b.chg = 0;
      if (b.bat <= 0 && b.status === 'returning') {
        b.status = 'idle';
        b.waitT = 0;
        b.path = null;
      }
      if (b.status !== 'returning') b.v = 0;
      break;
    }
    case 'hosp':
      b.hp = Math.min(maxHP, b.hp + (10 / 60) * dt);
      charge(b, dt, true);
      if (b.hp >= maxHP) {
        const h = shops.find(x => x.type === 'hosp');
        if (dist(b.x, b.y, h.x, h.y) > 60) {
          msg(b.name + " DIMESSO DALL'OSPEDALE", '#ff4d6d');
          startFetch(b, h.x, h.y);
          break;
        }
        b.status = 'idle';
        b.waitT = 0;
        b.chkT = 0;
        msg(b.name + " DIMESSO DALL'OSPEDALE", '#ff4d6d');
      }
      break;
    case 'medbay':
      charge(b, dt, true);
      if (b.hp >= maxHP) startFetch(b, b.px, b.py);
      break;
    case 'fetch': {
      charge(b, dt, true);
      const q = b.fpath && b.fpath[b.fpi];
      if (!q) {
        b.status = 'idle';
        b.waitT = 0;
        break;
      }
      const dx = q.x - b.px,
        dy = q.y - b.py,
        d = Math.hypot(dx, dy),
        sp = 48 * dt;
      b.pfa = Math.atan2(dy, dx);
      b.walk += dt * 12;
      if (d <= sp) {
        b.px = q.x;
        b.py = q.y;
        b.fpi++;
        if (b.fpi >= b.fpath.length) {
          b.fpath = null;
          msg(b.name + ' HA RECUPERATO LA MOTO', b.ui);

            b.waitT = 0;
            b.chkT = 0;
          }
        }
      } else {
        b.px += (dx / d) * sp;
        b.py += (dy / d) * sp;
      }
      break;
    }
    case 'robbing':
      updateRob(b, dt);
      break;
    case 'truce':
      charge(b, dt, true);
      break;
    case 'out':
      b.outT -= dt;
      if (b.outT <= 0) release(b);
      break;
    case 'captured':
      b.capT -= dt;
      if (b.capT <= 0) {
        b.status = 'dead';
        msg(b.name + ' E STATO UCCISO DAGLI XENO', '#ff4d6d');
        checkEnd();
      }
      break;
  }

    }

        vy: -15 - R() * 15,

        c: R() < 0.5 ? '#ff3df2' : '#b48cff',

      const fol = enemies.filter(e => e.follow);

          e.fa = a;

  if (ceremony) {
    ceremony.t += dt;
    if (!ceremony.said && ceremony.t > 2.5) {
      ceremony.said = true;
      msg('NYX: SPARITE!', '#ff3df2');
      sfx('boom');
    }
    if (ceremony.t > 4) {
      const p = team[active];
      for (const e of ceremony.list) {
        if (e.dead) continue;
        e.dead = true;
        dispersed++;
        freeCaptives(e);
        spark(e.fx, e.fy, '#b48cff', 14, 80);
        fx.push({ k: 'flash', x: e.fx, y: e.fy, t: 0, dur: 0.5, r: 30, c: '#b48cff' });
      }
      compact(enemies, e => !e.dead);

      msg(nn + ' XENO SPARITI: +' + 5 * nn + ' VITA AGLI ALTRI BIKER', '#b48cff');

    const n = shops.find(s => s.type === 'nasa');
    if (n && dist(pBody.x, pBody.y, n.x, n.y) < 32) pendingFast = true;
  }
  if (meta.tut) updateTutorial(ap, dt);
  if (ap && ap.hp <= 0) defeat();
  updateStadium(dt);
  if (state === 'wait') {
    const n = nextAvail(active);
    if (n >= 0) {
      activate(n);
      state = 'play';
      msg(team[n].name + ' E PRONTO', team[n].ui);
    }
  }
  checkEnd();
  const q = team[active],
    tb = state === 'play' ? body(q) : { x: garage.cx, y: garage.cy };
  const v = q.inCar ? q.inCar.v : q.v,
    a = q.inCar ? q.inCar.a : q.a;
  const lead = state === 'play' && (!q.onFoot || q.inCar) ? 0.35 : 0;
  const tx = tb.x + Math.cos(a) * v * lead,
    ty = tb.y + Math.sin(a) * v * lead;
  const k = 1 - Math.exp(-6 * dt);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  shake = Math.max(0, shake - dt * 12);
  hurt = Math.max(0, hurt - dt);
  saveT -= dt;
  if (saveT <= 0) {
    saveT = 5;
    saveGame();
  }
}

// ===== js/ai.js =====
'use strict';

function steerTo(e, tx, ty, spd, dt, r) {
  if (e.rev > 0) {
    e.rev -= dt;
    e.v = -35;
    e.a += 1.6 * dt;
  } else {
    const da = angDiff(Math.atan2(ty - e.y, tx - e.x), e.a);
    e.a += clamp(da, -4 * dt, 4 * dt);
    const want = spd * (Math.abs(da) > 1.2 ? 0.35 : 1);
    e.v += clamp(want - e.v, -BASE * 2 * dt, BASE * 1.5 * dt);
  }
  const hit = moveCol(e, 'x', 'y', Math.cos(e.a) * e.v * dt, Math.sin(e.a) * e.v * dt, r || 5);
  if (hit) {
    e.stuck += dt;
    if (e.stuck > 0.6) {
      e.rev = 0.45;
      e.stuck = 0;
    }
  } else e.stuck = Math.max(0, e.stuck - dt);
}
function wander(e, dt, spd, r) {
  if (e.tn < 0) e.tn = nearestNodeLOS(e.x, e.y);
  const n = nodes[e.tn];
  if (dist(e.x, e.y, n.x, n.y) < 14) {
    let o = n.nb.filter(k => k.to !== e.pn);
    if (!o.length) o = n.nb;
    e.pn = e.tn;

  }

}
function followMove(e, dt) {
  if (e.kneel) {
    e.v = 0;
    return;
  }
  if (e.onFoot) e.onFoot = false;
  const pb = pBody,
    d = dist(e.x, e.y, pb.x, pb.y);
  const spd = BASE * 0.85 * (e.spd > 1 ? 1.75 : 1) * 1.2;
  if (d < 46) {
    e.v *= Math.pow(0.85, dt * 60);
    return;
  }
  let tx = pb.x,
    ty = pb.y;
  if (flowAt((e.x / CELL) | 0, (e.y / CELL) | 0) >= 0) {
    if (!los(e.x, e.y, pb.x, pb.y)) {
      const f = flowDir(e.x, e.y);

      e.fpath = path.map(i => nodes[i]);

    const q = e.fpath[e.fi];

      if (dist(e.x, e.y, q.x, q.y) < 16) e.fi++;

}
function updateEnemy(e, dt) {

          ty = f.y;

      }
      const dx = tx - e.fx,
        dy = ty - e.fy,
        l = Math.hypot(dx, dy) || 1;

      if (d > 10) {
        moveCol(e, 'fx', 'fy', (dx / l) * 44 * dt, (dy / l) * 44 * dt, 3);

      if (d < 14 && e.cd <= 0) {

    if (d < w.rad + 2 && e.cd <= 0 && sees) {

      e.v = 0;

      return;

  }
  let tx = pb.x,
    ty = pb.y;

      ty = f.y;

  }
  let spd = xenoSpd(e);
  if (w && w.k === 'gun' && sees && d < w.rng * 0.55) spd *= 0.2;
  steerTo(e, tx, ty, spd, dt);
  if (w && w.k === 'gun') {
    if (sees && d < w.rng * 0.95 && e.lock > 0.5 && e.cd <= 0) {
      const a = Math.atan2(pb.y - e.y, pb.x - e.x) + (R() - 0.5) * 0.24;
      bullets.push({
        x: e.x + Math.cos(a) * 9,
        y: e.y + Math.sin(a) * 9,

        vy: Math.sin(a) * w.spd,

        dmg: w.dmg,
        o: 'e',
        c: ACID,
        from: e,
      });
      e.cd = w.cd * 1.5;

    e.fx = e.x;

}
// ---------- police ----------
function policeTarget() {
  let sum = 0,
    n3 = 0,
    any4 = false;
  for (const s of shops) {
    sum += s.anger;
    if (s.anger >= 3) n3++;
    if (s.anger >= 4) any4 = true;
  }
  if (any4) return 6;
  if (n3 > 0) return Math.min(5, n3);
  return sum > 2 ? 1 : 0;
}
function newCar(x, y) {

  return {
    x,
    y,
    a: 0,
    v: 0,
    tn: nodes[ni].nb[0].to,
    pn: ni,
    state: 'patrol',
    mode: 'cops',
    stuck: 0,
    rev: 0,
    leave: false,
    arrest: 0,
    impT: 0,
    abT: 0,
    gone: false,
    cops: [
      { hp: 30, out: false, x, y, fa: 0, cd: 1, walk: 0 },

}
function spawnPolice() {
  let n = null;
  for (let k = 0; k < 80; k++) {
    const c = nodes[Math.floor(R() * nodes.length)];
    if (dist(c.x, c.y, pBody.x, pBody.y) > 700 && dist(c.x, c.y, garage.cx, garage.cy) > 500) {

function managePolice(dt) {

}
function updatePolice(c, dt) {
  if (c.mode === 'abandoned') {
    c.v = 0;
    c.abT += dt;
    return;
  }
  if (c.mode === 'driven') return;
  if (c.mode === 'impound') {
    c.impT -= dt;
    if (c.impT <= 0) {
      c.gone = true;
      msg("LA POLIZIA HA RIPRESO L'AUTO DALLA RIMESSA", '#3a7bff');
    }

  }

    if (!k.out) {

    c.mode = 'abandoned';

    c.v = 0;
    c.arrest = 0;
    if (dist(c.x, c.y, pBody.x, pBody.y) < 400)
      msg('AGENTI A TERRA! ' + K('use') + " A PIEDI VICINO ALL'AUTO PER RUBARLA", '#3a7bff');
    return;
  }
  const pb = pBody,

    return;

  const sees = los(c.x, c.y, pb.x, pb.y);

    if (d < 120 || (d < 260 && sees)) {
      c.state = 'chase';
      msg('POLIZIA! TI HANNO VISTO', '#3a7bff');
      sfx('siren');
    } else {
      wander(c, dt, BASE * 0.75, 6);
      return;
    }
  }
  if (d > 320 && out.length) {
    recallCops(c, out, dt);
    return;
  }
  if (!out.length) {
    let tx = pb.x,
      ty = pb.y;
    if (!sees) {
      const f = flowDir(c.x, c.y);
      if (f) {
        tx = f.x;
        ty = f.y;
      }
    }
    steerTo(c, tx, ty, BASE * 0.95, dt, 6);
    if (d < 75 && sees) {
      c.v = 0;
      alive.forEach((k, i) => {
        const a = c.a + ((i ? 1 : -1) * Math.PI) / 2;
        const x = c.x + Math.cos(a) * 12,
          y = c.y + Math.sin(a) * 12;
        k.x = blocked(x, y, 3) ? c.x : x;
        k.y = blocked(x, y, 3) ? c.y : y;
        k.out = true;
      });
      sfx('siren');
    }
    return;
  }
  c.v *= Math.pow(0.85, dt * 60);
  let touching = false;
  const p = team[active];
  for (const k of out) {
    const dk = dist(k.x, k.y, pb.x, pb.y);
    const ks = los(k.x, k.y, pb.x, pb.y);
    let tx = pb.x,
      ty = pb.y;
    if (!ks) {
      const f = flowDir(k.x, k.y);
      if (f) {
        tx = f.x;
        ty = f.y;
      }
    }
    k.fa = Math.atan2(pb.y - k.y, pb.x - k.x);
    if (dk > 10) {
      const dx = tx - k.x,
        dy = ty - k.y,
        l = Math.hypot(dx, dy) || 1;
      moveCol(k, 'x', 'y', (dx / l) * 50 * dt, (dy / l) * 50 * dt, 3);
      k.walk += dt * 12;
    }
    if (ks && dk < 200 && dk > 18 && k.cd <= 0) {
      const a = k.fa + (R() - 0.5) * 0.3;
      bullets.push({
        x: k.x + Math.cos(a) * 6,
        y: k.y + Math.sin(a) * 6,
        vx: Math.cos(a) * 300,
        vy: Math.sin(a) * 300,
        life: 0.7,
        dmg: 5,
        o: 'c',
        c: '#9fd4ff',
      });
      k.cd = 0.9;
      sfx('shoot');
    }
    if (dk < 15 && (p.onFoot || p.inCar || Math.abs(p.v) < 25)) touching = true;
  }
  c.arrest = touching ? c.arrest + dt : Math.max(0, c.arrest - dt * 0.5);
  if (c.arrest >= 1.2) {
    c.arrest = 0;
    p.lastSrc = 'police';
    p.hp = 0;
  }
}
function recallCops(c, out, dt) {
  for (const k of out) {
    const dx = c.x - k.x,
      dy = c.y - k.y,
      l = Math.hypot(dx, dy);
    if (l < 8) {
      k.out = false;
      continue;
    }
    moveCol(k, 'x', 'y', (dx / l) * 55 * dt, (dy / l) * 55 * dt, 3);
    k.walk += dt * 12;
    k.fa = Math.atan2(dy, dx);
  }
}

//  - menu a lista generico (radar avanzato, commissariato)

const NOVA = 5;
const PXM = 8; // pixel per metro
const RED_LEASH = 200 * PXM; // lo Xeno Rosso non si allontana piu' di 200 m dalla rimessa
const TRUCE_DUR = 15 * 60,
  TRUCE_CD = 3600,
  TRUCE_COST = 5000,
  TRUCE_CAP = 15;
const ADV_RADAR_COST = 10000;
const ROB_PAY = 2000;
const SIEGE_T = 30 * 60, // assedio dello Xeno Gold prima che l'edificio cada
  OFF_T = 3600; // edificio unico fuori uso per 1 ora
const XK = {
  red: {
    name: 'XENO ROSSO',
    c: '#ff2b2b',
    hp: 40,
    mul: 1,
    r: bikeSprite('#ff2b2b', '#ff9a9a', true, true, '#3a0808', '#b01f1f', '#ffe03c'),
    e: bikeSprite('#ff2b2b', '#ff9a9a', false, true),
  },
  silver: {
    name: 'XENO SILVER',
    c: '#d8dee8',
    hp: 90,

    r: bikeSprite('#c8d0dc', '#ffffff', true, true, '#2a2e38', '#8a93a6', '#3cf2ff'),

    e: bikeSprite('#ffd21f', '#fff2a0', false, true),
  },
};
const BLOCK_T = 30 * 60, // BLOCK di Caspian: per 30 minuti nessuno rientra da solo
  HEIST_T = 30 * 60, // Melanie: 30 minuti per rubare le batterie a tutti i meccanici
  HEIST_HP = 50,
  SUPER_BAT = 300; // batterie da 5 minuti per tutto il team
let blockT = 0,
  heist = null, // {t, done:[indici dei meccanici]}
  superBat = false;
let truceT = 0,
  truceCD = 0,
  advRadar = false,

  radarTgt = null,

// ---------- Xeno speciali ----------
function makeSpecial(e, kind) {
  const k = XK[kind];
  e.kind = kind;
  e.hp = k.hp;
  e.mul = k.mul;
  e.follow = false;
  e.spT = 0;
  e.arrived = false;
  e.meet = false;
  e.tgt = -1;
  e.siegeT = 0;
  e.taken = [];
  e.gpath = null;
  return e;
}
function spawnXeno() {
  const e = spawnEnemy();
  const E = meta.gameT;
  if (E >= 90 * 60 && R() < 1 / 30) {
    makeSpecial(e, 'silver');
    msg('UNO XENO SILVER E ENTRATO IN CITTA!', XK.silver.c);
    sfx('alert');
  } else if (E >= 30 * 60 && R() < 0.1) {
    makeSpecial(e, 'red');
    msg('UNO XENO ROSSO PUNTA VERSO LA RIMESSA!', XK.red.c);
    sfx('alert');
  } else msg('UN NUOVO XENO E ENTRATO IN CITTA', ACID);
  return e;
}
// segue la rete stradale fino a (x,y); true quando il percorso e' finito
function navTo(e, x, y, spd, dt) {
  e.onFoot = false;
  e.lchg = 0;
  e.gT = (e.gT || 0) - dt;
  if (!e.gpath || e.gT <= 0 || e.gx !== x || e.gy !== y) {
    e.gT = 10;
    e.gx = x;
    e.gy = y;
    e.gpath = (dijkstra(nearestNodeLOS(e.x, e.y), nearestNodeLOS(x, y)) || []).map(i => nodes[i]);
    e.gi = 0;
  }
  let q = e.gpath[e.gi];
  while (q && dist(e.x, e.y, q.x, q.y) < 16) q = e.gpath[++e.gi];
  if (!q) {
    if (dist(e.x, e.y, x, y) > 10 && los(e.x, e.y, x, y)) steerTo(e, x, y, spd * 0.5, dt);
    else e.v *= Math.pow(0.85, dt * 60);
    return true;
  }
  steerTo(e, q.x, q.y, spd, dt);
  return false;
}
const xenoSpd = e => BASE * 0.85 * (e.spd > 1 ? 1.75 : 1) * (e.mul || 1);
// movimento speciale: true se ha gia' gestito lo Xeno in questo passo
function specialMove(e, dt) {
  if (e.kind === 'silver') {
    e.spT += dt;
    if (e.spT >= 15 * 60) becomeGold(e);
    return false;
  }
  if (e.kind === 'red') {
    const g = nodes[garage.node];
    if (!e.arrived) {
      if (dist(e.x, e.y, g.x, g.y) < 300) e.arrived = true;
      else return redNav(e, g, dt);
    }
    if (e.meet) return redNav(e, g, dt);
    if (dist(e.x, e.y, garage.cx, garage.cy) > RED_LEASH) {
      e.state = 'wander';
      return redNav(e, g, dt);
    }
    return false;
  }
  if (e.kind === 'gold') {
    e.cd -= dt;
    e.hitT -= dt;
    if (e.tgt < 0 || !shops[e.tgt]) e.tgt = goldNext(e);
    if (e.tgt >= 0) {
      const s = shops[e.tgt];
      const done = navTo(e, s.x, s.y, xenoSpd(e), dt);
      if (done || dist(e.x, e.y, s.x, s.y) < 48) {
        if (!e.siegeT) msg('LO XENO GOLD ASSEDIA ' + s.name + '! 30 MIN PER FERMARLO', XK.gold.c);
        e.siegeT += dt;
        if (R() < dt * 3) spark(s.x + (R() - 0.5) * 30, s.y + (R() - 0.5) * 20, XK.gold.c, 3, 50);
        if (e.siegeT >= SIEGE_T) conquer(e, s);
      }
    }
    // non insegue nessuno ma colpisce chi gli sta addosso (anche durante la tregua)
    if (pAvail && e.cd <= 0 && !inGarage(pBody.x, pBody.y) && dist(e.x, e.y, pBody.x, pBody.y) < 34) {
      e.cd = 1.2;
      damagePlayer(15, 'xeno', e, 'weapon');
      fx.push({
        k: 'swords',
        x: e.x,
        y: e.y,
        a: Math.atan2(pBody.y - e.y, pBody.x - e.x),
        t: 0,
        dur: 0.22,
        r: 30,
        c: XK.gold.c,
        own: e,
      });
      sfx('slash');
    }
    return true;
  }
  return false;
}
function redNav(e, g, dt) {
  e.cd -= dt;
  e.hitT -= dt;
  navTo(e, g.x, g.y, xenoSpd(e), dt);
  return true;
}
function becomeGold(e) {
  e.kind = 'gold';
  e.mul = XK.gold.mul;
  e.hp = Math.max(e.hp, XK.gold.hp);
  e.tgt = -1;
  e.siegeT = 0;
  e.taken = [];
  e.gpath = null;
  e.state = 'wander';
  const b = body(e);
  fx.push({ k: 'flash', x: b.x, y: b.y, t: 0, dur: 0.8, r: 90, c: XK.gold.c });
  sfx('boom');
  msg('LO XENO SILVER E DIVENTATO XENO GOLD! ATTACCA GLI EDIFICI UNICI', XK.gold.c);
}
// edificio unico piu' vicino non ancora conquistato: la chiesa sempre per ultima
function goldNext(e) {
  let best = -1,
    bd = 1e9,
    church = -1;
  for (const s of shops) {
    if (!SHOP_T[s.type].sp || e.taken.includes(s.i)) continue;
    if (s.type === 'church') {
      church = s.i;
      continue;
    }
    const d = dist(e.x, e.y, s.x, s.y);
    if (d < bd) {
      bd = d;
      best = s.i;
    }
  }
  return best >= 0 ? best : church;
}
function conquer(e, s) {
  s.offT = OFF_T;
  e.taken.push(s.i);
  e.tgt = -1;
  e.siegeT = 0;
  e.gpath = null;
  fx.push({ k: 'flash', x: s.x, y: s.y, t: 0, dur: 1, r: 80, c: XK.gold.c });
  sfx('boom');
  shake = Math.max(shake, 4);
  msg(s.name + ' E CADUTO: FUORI USO PER 1 ORA', XK.gold.c);
  if (s.type === 'church') endGame(false, 'LO XENO GOLD HA ABBATTUTO TUTTI GLI EDIFICI UNICI');
}
// 3 Xeno Rossi davanti alla rimessa si fondono in uno Xeno Silver che rapisce 2 biker
function fuseReds(list) {
  let x = 0,
    y = 0;
  for (const e of list) {
    x += e.x / list.length;
    y += e.y / list.length;
    e.dead = true;
    spark(e.x, e.y, XK.red.c, 12, 90);
  }
  const s = makeSpecial(addEnemy(Math.floor(R() * NB), x, y, XK.silver.hp, nextEid++), 'silver');
  fx.push({ k: 'flash', x, y, t: 0, dur: 0.8, r: 100, c: XK.silver.c });
  sfx('boom');
  shake = Math.max(shake, 5);
  msg('3 XENO ROSSI SI FONDONO: XENO SILVER!', XK.silver.c);
  const cand = team.filter(b => b.status === 'garage');
  for (let i = cand.length - 1; i > 0; i--) {
    const j = Math.floor(R() * (i + 1));
    [cand[i], cand[j]] = [cand[j], cand[i]];
  }
  const taken = cand.slice(0, 2);
  for (const b of taken) {
    b.status = 'captured';
    b.captor = s.id;
    b.capT = 600;
    b.medOn = false;
  }
  if (taken.length)
    msg('RAPITI ' + taken.map(b => b.name).join(' E ') + ' DALLA RIMESSA! 10 MIN PER ABBATTERE LO SILVER', '#ff3df2');
}
// ---------- tregua di Nova ----------
function startTruce(p, s) {
  if (p.nyx) return msg('NYX E GIA ATTIVA', '#ff3df2');
  if (truceOn()) return msg('TREGUA GIA IN CORSO', '#c6ff3a');
  if (truceCD > 0) return msg('NUOVA TREGUA TRA ' + fmtL(truceCD), '#ffe03c');
  if (money < TRUCE_COST) return msg('IL PROCLAMA COSTA ' + TRUCE_COST + '$', '#ff4d6d');
  money -= TRUCE_COST;
  truceT = TRUCE_DUR;
  truceCD = TRUCE_CD;
  if (p.inCar) exitCar(p, false);
  p.onFoot = false;
  p.walkPath = null;
  p.v = 0;
  p.nitroT = 0;
  p.medOn = false;
  p.hp = 1;
  p.status = 'truce';
  for (const e of enemies)
    if (e.kind !== 'gold' && e.state === 'chase') {
      e.state = 'wander';
      e.onFoot = false;
      e.lchg = 0;
    }
  fx.push({ k: 'flash', x: s.x, y: s.y, t: 0, dur: 1.2, r: 140, c: '#b48cff' });
  sfx('switch');
  sfx('nitro');
  msg('NOVA DIVENTA NYX E PROCLAMA LA TREGUA: 15 MIN SENZA ATTACCHI', '#ff3df2');
  msg('NOVA RESTA AL CENTRO ALIENI CON 1 DI VITA', '#b48cff');
  truceHostages();
  leaveActive();
}
function endTruce() {
  truceT = 0;
  const n = team[NOVA];
  if (n && n.status === 'truce') {
    n.status = 'idle';
    n.waitT = 0;
    n.chkT = 0;
  }
  msg('LA TREGUA E FINITA: GLI XENO TORNANO A CACCIA', '#ff4d6d');
  sfx('alert');
}
// ---------- Melanie: RAPINALI TUTTI! ----------
const angerCnt = add => shops.filter(s => s.type === 'shop' && Math.min(5, s.anger + add) > 3).length;
const arrestRisk = () => Math.min(1, 0.2 * angerCnt(1));
function startRobAll(p) {
  if (p.status !== 'active' || p.i !== MELANIE) return;
  if (p.inCar) exitCar(p, false);
  p.onFoot = false;
  p.walkPath = null;
  p.v = 0;
  p.nitroT = 0;
  // giro dei negozi: ogni volta il piu' vicino
  const left = shops.filter(s => s.type === 'shop');
  const seq = [];
  let x = p.x,
    y = p.y;
  while (left.length) {
    let k = 0,
      bd = 1e9;
    left.forEach((s, j) => {
      const d = dist(x, y, s.x, s.y);
      if (d < bd) {
        bd = d;
        k = j;
      }
    });
    const s = left.splice(k, 1)[0];
    seq.push(s.i);
    x = s.x;
    y = s.y;
  }
  p.rob = { seq, k: 0 };
  p.path = null;
  p.status = 'robbing';
  sfx('sneak');
  msg('MELANIE PARTE: RAPINALI TUTTI! (' + seq.length + ' NEGOZI)', '#ffd21f');
  leaveActive();
}
function updateRob(b, dt) {
  const r = b.rob;
  if (!r) {
    b.status = 'idle';
    b.waitT = 0;
    return;
  }
  const tgt = r.k < r.seq.length ? shops[r.seq[r.k]] : null;
  if (!b.path) {
    const s0 = nearestNodeLOS(b.x, b.y),
      t0 = tgt ? nearestNodeLOS(tgt.x, tgt.y) : garage.node;
    b.path = (dijkstra(s0, t0) || []).map(i => ({ x: nodes[i].x, y: nodes[i].y }));
    if (!tgt) b.path.push({ x: garage.bays[b.i].x, y: garage.bays[b.i].y });
    b.pi = 0;
  }
  const q = b.path[b.pi];
  if (q) {
    const dx = q.x - b.x,
      dy = q.y - b.y,
      d = Math.hypot(dx, dy),
      sp = speedOf(b) * dt;
    b.a += clamp(angDiff(Math.atan2(dy, dx), b.a), -8 * dt, 8 * dt);
    if (d <= sp) {
      b.x = q.x;
      b.y = q.y;
      b.pi++;
    } else {
      b.x += (dx / d) * sp;
      b.y += (dy / d) * sp;
      b.v = speedOf(b);
    }
    if (b.pi < b.path.length) return;
  }
  b.path = null;
  b.v = 0;
  if (tgt) {
    r.k++;
    pop(tgt.x, tgt.y - 24, 'RAPINA!', '#ffd21f');
    if (dist(tgt.x, tgt.y, cam.x, cam.y) < 400) sfx('cash');
  } else finishRob(b);
}
function finishRob(b) {
  b.rob = null;
  toBay(b, 'garage');
  money += ROB_PAY;
  for (const s of shops)
    if (s.type === 'shop') {
      s.anger = Math.min(5, s.anger + 1);
      s.calm = 0;
    }
  b.hp = 1;
  b.medOn = false;
  sfx('cash');
  pop(garage.cx, garage.cy - 20, '+' + ROB_PAY + '$', '#ffd21f');
  msg('MELANIE E TORNATA: +' + ROB_PAY + '$ - RABBIA +1 IN TUTTI I NEGOZI', '#ffd21f');
  const n = angerCnt(0),
    ch = Math.min(1, 0.2 * n);
  if (ch > 0 && R() < ch) {
    b.status = 'out';
    b.outR = 'ARRESTATO';
    b.outT = 3600;
    msg('MELANIE ARRESTATA (RISCHIO ' + Math.round(ch * 100) + '%): FUORI 1 ORA', '#3a7bff');
    sfx('siren');
  } else if (ch > 0) msg('MELANIE LA FA FRANCA (RISCHIO ' + Math.round(ch * 100) + '%)', '#ffd21f');
}
function payBail() {
  const ar = arrested().sort((a, b) => b.outT - a.outT);
  if (!ar.length) return msg('NESSUN BIKER ARRESTATO', '#3a7bff');
  if (money < 1000) return msg('LA CAUZIONE COSTA 1000$', '#ff4d6d');
  money -= 1000;
  sfx('cash');
  release(ar[0]);
  msg(
    'CAUZIONE PAGATA: ' + ar[0].name + ' E LIBERO' + (ar.length > 1 ? ' (' + (ar.length - 1) + ' ANCORA DENTRO)' : ''),
    '#3a7bff',
  );
}
function openCopMenu(p) {
  const items = [];
  if (arrested().length) items.push({ t: 'PAGA CAUZIONE 1000$', c: '#3a7bff', act: payBail });
  items.push({
    t: 'AVVIA: RAPINALI TUTTI! (+' + ROB_PAY + '$)',
    c: '#ffd21f',
    act: () => startRobAll(team[active]),
  });
  items.push({ t: 'CHIUDI', c: '#7a6f99' });
  listMenu = {
    title: 'COMMISSARIATO',
    sub: 'LISTA DELLA RABBIA NEI NEGOZI',
    items,
    sel: 0,
    draw: drawAngerList,
    h: 132,
  };
  sfx('menu');
}
function drawAngerList(x, y) {
  const list = shops.filter(s => s.type === 'shop');
  const half = Math.ceil(list.length / 2);
  list.forEach((s, j) => {
    const cx = x + (j < half ? 0 : 210),
      cy = y + (j % half) * 10;
    const col = s.anger >= 4 ? '#ff4d6d' : s.anger >= 3 ? '#ffb03c' : s.anger ? '#ffe03c' : '#7a6f99';
    txt(s.name, cx, cy, col);
    for (let k = 0; k < 5; k++) {
      ctx.fillStyle = k < s.anger ? col : '#2a2440';
      ctx.fillRect(cx + 92 + k * 6, cy + 1, 4, 5);
    }
    txt(s.anger + '', cx + 126, cy, col);
  });
  const rk = arrestRisk();
  txt(
    'MELANIE VISITA DA SOLA TUTTI I NEGOZI (NON GIOCABILE): +' + ROB_PAY + '$',
    VW / 2,
    y + half * 10 + 6,
    '#ffd21f',
    1,
    'center',
  );
  txt(
    'RABBIA +1, VITA 1, ARRESTO ' + Math.round(rk * 100) + '% (20% PER NEGOZIO OLTRE 3)',
    VW / 2,
    y + half * 10 + 17,
    rk >= 1 ? '#ff4d6d' : '#c9c2e6',
    1,
    'center',
  );
}
// ---------- radar avanzato (Akira, centro NASA) ----------
function toggleRadar() {
  sfx('alert');
  if (!advRadar) {
    radarOn = !radarOn;
    return msg(radarOn ? 'RADAR NEGOZI ACCESO' : 'RADAR NEGOZI SPENTO', '#ffe03c');
  }
  // tre possibilita': negozi -> avanzato -> spento
  if (!radarOn && !advOn) {
    radarOn = true;
    msg('RADAR NEGOZI ACCESO', '#ffe03c');
  } else if (radarOn) {
    radarOn = false;
    openRadarMenu();
  } else {
    advOn = false;
    radarTgt = null;
    msg('RADAR SPENTO', '#7a6f99');
  }
}
function openRadarMenu() {
  const pb = body(team[active]),
    items = [];
  const m = d => ' (' + Math.round(d / PXM) + 'M)';
  const pick = (t, c, tg) => items.push({ t, c, act: () => setRadar(tg) });
  const xs = enemies
    .filter(e => !e.dead)
    .map(e => ({ e, d: dist(body(e).x, body(e).y, pb.x, pb.y) }))
    .sort((a, b) => a.d - b.d);
  // al massimo 4 Xeno speciali: la lista resta dentro lo schermo
  for (const o of xs.filter(o => o.e.kind).slice(0, 4)) pick(XK[o.e.kind].name + m(o.d), XK[o.e.kind].c, { k: 'xeno', id: o.e.id });
  xs.filter(o => !o.e.kind)
    .slice(0, 3)
    .forEach((o, j) => pick('XENO ' + (j + 1) + m(o.d), ACID, { k: 'xeno', id: o.e.id }));
  if (mission) pick('MISSIONE PACCO', '#ffe03c', { k: 'mission' });
  for (const ty of ['pharm', 'mech', 'shop'])
    pick(SHOP_T[ty].name + ' PIU VICINO', SHOP_T[ty].c, { k: 'near', type: ty });
  for (const s of shops)
    if (SHOP_T[s.type].sp) pick(s.name + m(dist(s.x, s.y, pb.x, pb.y)), SHOP_T[s.type].c, { k: 'shop', i: s.i });
  pick('RIMESSA', '#ff3df2', { k: 'garage' });
  listMenu = {
    title: 'RADAR AVANZATO',
    sub: 'SCEGLI IL SOLO OBIETTIVO DA SEGUIRE',
    items,
    sel: 0,
    key: 'radar',
    cancel: () => msg('RADAR SPENTO', '#7a6f99'),
  };
}
function setRadar(tg) {
  advOn = true;
  radarTgt = tg;
  const r = radarPos(body(team[active]));
  msg('RADAR AVANZATO: ' + (r ? r.n : 'OBIETTIVO'), '#ff8a1f');
}
// posizione e nome dell'obiettivo del radar avanzato (null = perso)
function radarPos(pb) {
  const t = radarTgt;
  if (!t) return null;
  if (t.k === 'xeno') {
    const e = enemies.find(e => e.id === t.id && !e.dead);
    if (!e) return null;
    const b = body(e);
    return { x: b.x, y: b.y, n: e.kind ? XK[e.kind].name : 'XENO' };
  }
  if (t.k === 'mission') {
    const s = missionTarget();
    return s ? { x: s.x, y: s.y, n: mission.carrier < 0 ? 'PACCO ' + s.name : 'CONSEGNA ' + s.name } : null;
  }
  if (t.k === 'near') {
    let best = null,
      bd = 1e9;
    for (const s of shops)
      if (s.type === t.type) {
        const d = dist(s.x, s.y, pb.x, pb.y);
        if (d < bd) {
          bd = d;
          best = s;
        }
      }
    return best ? { x: best.x, y: best.y, n: best.name } : null;
  }
  if (t.k === 'shop') {
    const s = shops[t.i];
    return s ? { x: s.x, y: s.y, n: s.name } : null;
  }
  return { x: garage.cx, y: garage.cy, n: 'RIMESSA' };
}
// ---------- SHIFT + cambia biker: chi resta indietro torna in rimessa ----------
const shiftHeld = () => pressed.has('ShiftSwitch') || !!(keys.ShiftLeft || keys.ShiftRight);
function sendHome(b) {
  if (b.status !== 'idle') return;

<script>
// ===== js/stadium.js =====
'use strict';
// =====================================================================
//  STADIO DI BASEBALL: la missione dell'assedio
//  - 3 biker dentro lo stadio (dalle 20:00, dalle 00:00, dalle 05:00; max 3 volte)
//  - gli Xeno gia' in citta' si radunano allo stadio (se non sono 12, rinforzi ogni 5 s)
//  - entrano dalle 3 entrate; si combatte solo quando sono dentro tutti e 12
//  - si gioca solo con i 3 biker dentro; a 0 di vita si e' rapiti al 100%
//  - esiti: tutti abbattuti / almeno 9 / almeno 6 / meno di 6
//  - la tregua di Nova libera gli ostaggi, che restano prigionieri nello stadio 1 ora
// =====================================================================
const STAD_OPEN = [2 * 3600, 6 * 3600, 11 * 3600], // 20:00, 00:00, 05:00
  STAD_N = 12,
  STAD_RESPAWN = 5, // rinforzi veloci se in citta' non ci sono 12 Xeno
  STAD_STUCK = 120, // uno Xeno bloccato per strada viene considerato arrivato
  STAD_ESCORT = 180; // meno di 6 abbattuti: 3 minuti per liberare gli ostaggi
let stad = null, // {phase:'siege'|'enter'|'fight'|'ransom', t, three, killed, n, need, spawnT, hostages, hold, bonus}
  stadRuns = 0,
  stadWarnT = 0;
function resetStadium() {
  stad = null;
  stadRuns = 0;
  stadWarnT = 0;
}
// durante assedio e combattimento si gioca solo con i 3 biker dello stadio
const missionLock = () => !!stad && stad.phase !== 'ransom';
// prima che i 12 Xeno siano tutti dentro non si combatte
const stadWaiting = () => !!stad && (stad.phase === 'siege' || stad.phase === 'enter');
const inMission = b => missionLock() && stad.three.includes(b.i);
// biker fermi che non rientrano da soli: BLOCK di Caspian o biker della missione
const holdIdle = b => blockT > 0 || inMission(b);
const cityXeno = () => enemies.reduce((n, e) => n + (e.stad ? 0 : 1), 0);
const stadXeno = () => enemies.reduce((n, e) => n + (e.stad && !e.dead ? 1 : 0), 0);
const stadNext = () => (stadRuns < STAD_OPEN.length ? STAD_OPEN[stadRuns] : null);

// ---------- avvio ----------
function checkStadiumStart(p) {
  if (stad || !p || p.status !== 'active' || p.inCar) return;
  const pb = body(p);
  if (!inStadium(pb.x, pb.y)) return;
  const nt = stadNext();
  if (nt === null || meta.gameT < nt) return;
  const mates = team
    .filter(t => t !== p && t.status === 'idle' && inStadium(t.x, t.y))
    .sort((a, b) => dist(a.x, a.y, pb.x, pb.y) - dist(b.x, b.y, pb.x, pb.y));
  if (mates.length < 2) return;
  startStadium(p, mates.slice(0, 2));
}
function startStadium(p, mates) {
  endNyx(p, '');
  stadRuns++;
  stad = { phase: 'siege', t: 0, three: [p.i, ...mates.map(m => m.i)], killed: 0, n: 0, need: STAD_N, spawnT: STAD_RESPAWN };
  for (const m of mates) m.waitT = 0;
  // non nascono Xeno nuovi: si radunano quelli gia' in citta' (i piu' vicini allo stadio)
  recruitXeno();
  fx.push({ k: 'flash', x: stadium.cx, y: stadium.cy, t: 0, dur: 1, r: 160, c: '#ff2b4a' });
  sfx('alert');
  sfx('siren');
  msg('MISSIONE STADIO ' + stadRuns + '/3: GLI XENO DELLA CITTA SI RADUNANO ALLO STADIO!', '#ff4d6d');
  if (stad.need > 0) msg('IN CITTA NE MANCANO ' + stad.need + ': RINFORZI OGNI ' + STAD_RESPAWN + 'S', '#ff9de6');
  msg('SI COMBATTE SOLO CON ' + stad.three.map(i => team[i].name).join(', ') + ' QUANDO SONO DENTRO TUTTI E 12', '#9fd4ff');
}
// arruola uno Xeno per l'assedio: va alla sua entrata
function enlist(e) {
  const k = stad.n++;
  e.stad = 1;
  e.sg = k % 3;
  e.slot = Math.floor(k / 3);
  e.sm = 'siege';
  e.wi = 0;
  e.sT = 0;
  e.ready = false;
  e.state = 'wander';
  e.onFoot = false;
  e.lchg = 0;
  e.gpath = null;
  e.follow = false;
  stad.need--;
}
// Xeno normali gia' in citta' (non gli speciali, non i fedeli di Nyx)
function recruitXeno() {
  const free = enemies
    .filter(e => !e.dead && !e.stad && !e.kind && !e.follow)
    .sort((a, b) => dist(a.x, a.y, stadium.cx, stadium.cy) - dist(b.x, b.y, stadium.cx, stadium.cy));
  for (const e of free) {
    if (stad.need <= 0) break;
    enlist(e);
  }
}

// ---------- movimento degli Xeno dello stadio (true = gestito qui) ----------
function siegeSpot(e) {
  const g = stadium.gates[e.sg],
    off = (e.slot - 1.5) * 13;
  // ovest/est: in fila lungo la strada verticale; nord: lungo la strada orizzontale
  if (e.sg === 1) return [g.ox + off, g.oy - (e.slot % 2) * 10];
  return [g.ox + (e.sg === 0 ? -1 : 1) * (e.slot % 2) * 10, g.oy + off];
}
function stadiumMove(e, dt) {
  const g = stadium.gates[e.sg] || stadium.gates[0],
    spd = xenoSpd(e);
  const tick = () => {
    e.cd -= dt;
    e.hitT -= dt;
    e.punchT -= dt;
    e.onFoot = false;
    e.lchg = 0;
  };
  if (e.sm === 'siege') {
    tick();
    const [tx, ty] = siegeSpot(e);
    e.sT = (e.sT || 0) + dt;
    if ((navTo(e, tx, ty, spd, dt) && dist(e.x, e.y, tx, ty) < 26) || e.sT > STAD_STUCK) e.ready = true;
    return true;
  }
  if (e.sm === 'enter' || e.sm === 'exit') {
    tick();
    // bloccato troppo a lungo: si ritrova all'entrata
    e.sT = (e.sT || 0) + dt;
    if (e.sm === 'enter' && e.sT > 60) {
      e.x = g.ix;
      e.y = g.iy;
      e.sm = 'in';
      e.state = 'chase';
      return true;
    }
    const wp =
      e.sm === 'enter'
        ? [
            [g.ox, g.oy],
            [g.gx, g.gy],
            [g.ix, g.iy],
          ]
        : [
            [g.ix, g.iy],
            [g.gx, g.gy],
            [g.ox, g.oy],
          ];
    const q = wp[e.wi || 0];
    if (e.sm === 'enter' && e.wi === 0 && !los(e.x, e.y, q[0], q[1])) {
      navTo(e, q[0], q[1], spd, dt);
      return true;
    }
    steerTo(e, q[0], q[1], spd, dt);
    if (dist(e.x, e.y, q[0], q[1]) < 14) {
      e.wi = (e.wi || 0) + 1;
      if (e.wi >= wp.length) {
        if (e.sm === 'enter') {
          e.sm = 'in';
          e.state = 'chase';
          e.lock = 0;
        } else {
          // fuori dallo stadio con l'ostaggio: torna uno Xeno normale
          e.stad = 0;
          e.sm = null;
          e.state = 'wander';
          e.tn = -1;
        }
      }
    }
    return true;
  }
  // dentro: resta nello stadio e attacca solo chi c'e' dentro, quando sono entrati tutti
  if (!pAvail || truceOn() || stadWaiting() || !inStadium(pBody.x, pBody.y)) {
    tick();
    e.v *= Math.pow(0.85, dt * 60);
    if (!inStadium(e.x, e.y)) steerTo(e, stadium.cx, stadium.cy, spd * 0.5, dt);
    return true;
  }
  e.state = 'chase';
  return false;
}

// ---------- aggiornamento ----------
function updateStadium(dt) {
  stadWarnT -= dt;
  if (!stad) return;
  if (stad.phase === 'siege') {
    stad.t += dt;
    if (stad.need > 0) {
      recruitXeno(); // anche i nuovi Xeno arrivati in citta' vanno allo stadio
      stad.spawnT -= dt;
      if (stad.need > 0 && stad.spawnT <= 0) {
        stad.spawnT = STAD_RESPAWN;
        enlist(spawnEnemy());
        msg('RINFORZO XENO VERSO LO STADIO (' + stad.n + '/12)', '#ff9de6');
      }
    }
    const sx = enemies.filter(e => e.stad && !e.dead);
    if (stad.need <= 0 && sx.every(e => e.ready)) {
      stad.phase = 'enter';
      for (const e of sx) {
        e.sm = 'enter';
        e.wi = 0;
        e.sT = 0;
      }
      msg('I 12 XENO ENTRANO DA TUTTE LE ENTRATE!', '#ff4d6d');
      sfx('alert');
      shake = Math.max(shake, 3);
    }
  } else if (stad.phase === 'enter') {
    if (enemies.every(e => !e.stad || e.dead || e.sm === 'in')) {
      stad.phase = 'fight';
      msg('TUTTI E 12 GLI XENO SONO NELLO STADIO: COMBATTETE!', '#ff4d6d');
      sfx('siren');
    }
  }
  if (stad.phase !== 'ransom') {
    if (stad.phase === 'fight' && !stadXeno()) return stadiumWin();
    if (!stad.three.some(i => team[i].status === 'active' || team[i].status === 'idle')) return stadiumLost();
    return;
  }
  if (stad.phase === 'ransom') {
    stad.t -= dt;
    const left = stad.hostages.filter(i => team[i].status === 'captured');
    if (!left.length) {
      const dead = stad.hostages.some(i => team[i].status === 'dead');
      stad = null;
      clearStadiumXeno(dead ? 'GLI OSTAGGI SONO MORTI: GLI XENO LASCIANO LO STADIO' : 'GLI XENO LASCIANO LO STADIO');
      return;
    }
    for (const i of left) team[i].capT = Math.max(0.01, stad.t);
    if (stad.t <= 0) {
      for (const i of left) {
        team[i].status = 'dead';
        msg(team[i].name + ' E STATO UCCISO NELLO STADIO', '#ff4d6d');
      }
      stad = null;
      clearStadiumXeno('NOVA NON E ARRIVATA: GLI XENO LASCIANO LO STADIO');
      checkEnd();
      return;
    }
    const p = pAvail ? team[active] : null;
    if (p && p.i === NOVA && p.status === 'active' && !p.inCar && nearStadium(pBody.x, pBody.y, 56)) novaDeal(p);
  }
}
// tutti i 12 Xeno abbattuti
function stadiumWin() {
  const list = stad.three.map(i => team[i]).filter(b => b.status === 'active' || b.status === 'idle');
  stad = null;
  msg('STADIO LIBERATO: 12 XENO ABBATTUTI!', ACID);
  alienReport(2000);

}
// nessuno dei 3 biker e' piu' disponibile
function stadiumLost() {
  const hostages = stad.three.filter(i => team[i].status === 'captured'),

  const live = enemies.filter(e => e.stad && !e.dead);
  if (!hostages.length) {
    stad = null;
    clearStadiumXeno('MISSIONE STADIO FALLITA: GLI XENO LASCIANO LO STADIO');
    return;
  }
  if (k >= 6) {
    const nine = k >= 9;
    stad = {
      phase: 'ransom',
      t: nine ? 600 : 300,
      hold: nine ? 3600 : 7200,
      bonus: nine ? 1000 : 0,
      hostages,
      three: stad.three,
      killed: k,
    };
    for (const i of hostages) team[i].capT = stad.t;
    if (hostages.includes(NOVA)) {
      msg('NOVA E TRA GLI OSTAGGI: SI OFFRE AL POSTO DEGLI ALTRI', '#ff6ec7');
      novaDeal(team[NOVA]);
      return;
    }
    sfx('alert');
    msg(k + ' XENO ABBATTUTI: GLI XENO VOGLIONO NOVA COME OSTAGGIO', '#ff6ec7');
    msg('NOVA DEVE ARRIVARE ALLO STADIO ENTRO ' + fmt(stad.t) + ' O GLI OSTAGGI MUOIONO', '#ff4d6d');
    return;
  }
  // meno di 6: 3 Xeno escono con gli ostaggi, gli altri si fondono in 2 Xeno Rossi

  for (const i of hostages) {

  for (const e of esc) {
    e.sg = stadium.gates.indexOf(nearGate(e.x, e.y));
    e.sm = 'exit';
    e.wi = 0;
    e.onFoot = false;
  }
  for (const e of live)
    if (!esc.includes(e)) {

  for (const gi of [0, 2]) {
    const g = stadium.gates[gi];
    makeSpecial(addEnemy(Math.floor(R() * NB), g.ox, g.oy, XK.red.hp, nextEid++), 'red');
  }
  fx.push({ k: 'flash', x: stadium.cx, y: stadium.cy, t: 0, dur: 0.8, r: 120, c: XK.red.c });
  sfx('boom');
  stad = null;
  msg('3 XENO ESCONO DALLO STADIO CON GLI OSTAGGI: 3 MIN PER LIBERARLI!', '#ff3df2');
  msg('GLI ALTRI XENO SI FONDONO IN 2 XENO ROSSI', XK.red.c);
}
// Nova si consegna: gli ostaggi tornano in rimessa con l'auto medica, lei resta nello stadio
function novaDeal(n) {
  const S = stad;
  const wasActive = n === team[active] && n.status === 'active';
  if (n.inCar) exitCar(n, false);
  endNyx(n, '');
  const freed = S.hostages.filter(i => i !== NOVA && team[i].status === 'captured').map(i => team[i]);
  for (const b of freed) b.captor = 0;

  n.outR = 'OSTAGGIO';
  n.outT = S.hold;
  n.captor = 0;
  n.medOn = false;
  n.onFoot = false;
  n.walkPath = null;
  n.path = null;
  n.v = 0;

  n.x = stadium.cx;

  clearStadiumXeno('');
  fx.push({ k: 'flash', x: stadium.cx, y: stadium.cy, t: 0, dur: 1, r: 120, c: '#ff6ec7' });
  sfx('switch');
  msg('NOVA RESTA IN OSTAGGIO NELLO STADIO PER ' + (S.hold >= 7200 ? '2 ORE' : '1 ORA'), '#ff6ec7');
  alienReport(S.bonus);

// gli Xeno rimasti nello stadio se ne vanno (non quelli che escono con gli ostaggi)

  for (const e of enemies)
    if (e.stad && e.sm !== 'exit' && !e.dead) {
      e.dead = true;
      freeCaptives(e);
      spark(e.x, e.y, ACID, 8, 60);

// premio "come il rapporto al centro alieni" + bonus

  alienMark = kills;
  const g = n * 25 + bonus;
  money += g;
  sfx('cash');
  msg('CENTRO ALIENI: ' + n + ' XENO = ' + n * 25 + '$' + (bonus ? ' + ' + bonus + '$' : ''), '#c6ff3a');
  if (n >= 10) {
    garageMeds += 3;

    msg('3 FARMACI ALLA RIMESSA', '#5cff7a');
  }

// l'auto medica del centro alieni passa dallo stadio e riporta i biker (con le moto) in rimessa
function stadiumAmbulance(list) {
  if (!list.length) return;
  const al = shops.find(s => s.type === 'alien');
  let ga = stadium.gates[0],
    bd = 1e9;
  for (const g of stadium.gates) {
    const d = al ? dist(g.ox, g.oy, al.x, al.y) : 0;
    if (d < bd) {

  const wasActive = list.includes(team[active]) && team[active].status === 'active';
  for (const b of list) {
    if (b.inCar) exitCar(b, false);
    b.status = 'waitamb';
    b.path = null;
    b.walkPath = null;
    b.onFoot = false;
    b.v = 0;
    b.nitroT = 0;
  }

    { x: ga.ox, y: ga.oy, act: 'stadium', list: list.map(b => b.i) },
    { x: garage.cx, y: garage.cy, act: 'garage', w: -1 },

function confineToStadium(p, b0) {

// ---------- officina: dall'auto della polizia all'auto nera ----------

function policeToMech(p, c) {

}
function darkDone() {

  dark.y = m ? m.y : garage.cy;
  dark.a = 0;
  dark.v = 0;
  dark.bat = DARK_BAT;
  sfx('nitro');
  msg("L'AUTO NERA E PRONTA: E PARCHEGGIATA A TIMES SQUARE", '#b48cff');
  msg('ATLAS E SEL DEVONO ARRIVARCI A PIEDI', '#c9c2e6');

// ---------- salire e scendere ----------
const nearDark = b => darkReady() && !dark.crew && dark.driver < 0 && dist(dark.x, dark.y, b.x, b.y) < 22;
// il compagno deve aspettare vicino all'auto (TAB) oppure in rimessa se l'auto e' a Times Square
function mateReady(p) {
  const m = team[mateOf(p.i)];
  if (!m || m.hp <= 0) return null;
  if (m.status === 'idle' && dist(m.x, m.y, dark.x, dark.y) < 130) return m;

}
function darkHint(p) {

    return inSquare(dark.x, dark.y) ? "!L'AUTO NERA E GIA A TIMES SQUARE" : 'RIPORTA L AUTO NERA A TIMES SQUARE';
  if (!isCrew(p.i)) return "!L'AUTO NERA E SOLO DI ATLAS E SEL";

}
function useDark(p) {

  if (h[0] === '!') return msg(h.slice(1), '#b48cff');
  p.inCar = dark;
  p.walkPath = null;

// posizione libera accanto all'auto
function darkSide(k) {
  for (const a of [dark.a + Math.PI / 2, dark.a - Math.PI / 2, dark.a + Math.PI]) {
    const x = dark.x + Math.cos(a) * (14 + k * 6),
      y = dark.y + Math.sin(a) * (14 + k * 6);

}
// scendono tutti: a ciascuno meta' della vita complessiva; chi non guida va a piedi alla sua moto
function emptyDark(walk) {

  const drv = dark.driver >= 0 ? team[dark.driver] : null;
  crew.forEach((i, k) => {
    const b = team[i];
    b.hp = Math.min(maxHP, Math.max(1, pool / 2));
    if (b === drv) return;
    const q = darkSide(k);
    b.v = 0;
    startFetch(b, q.x, q.y, true);
    msg(b.name + ' TORNA A PIEDI ALLA MOTO', b.ui);
  });

    const q = darkSide(0);
    drv.inCar = null;
    drv.onFoot = true;
    drv.fx = q.x;
    drv.fy = q.y;
    drv.fa = dark.a;
    if (walk) startWalk(drv);
  }
  dark.crew = null;
  dark.driver = -1;
  dark.hp = 0;
  dark.v = 0;
  if (crew.length) msg('ATLAS E SEL SCENDONO: VITA ' + Math.ceil(Math.max(1, pool / 2)) + ' A TESTA', '#b48cff');

const crewHp = () => (dark.driver >= 0 && dark.crew ? team[dark.driver].hp : dark.hp);

function crewStay(p) {

  dark.driver = -1;

  q.onFoot = false;

  q.hp = dark.hp;
}

function recallCrew() {

// ---------- guida e armi ----------
function shootPair(x, y, a, w, dmg, col, off) {
  for (const s of [-1, 1]) {
    const bx = x + Math.cos(a + Math.PI / 2) * off * s,
      by = y + Math.sin(a + Math.PI / 2) * off * s;
    bullets.push({
      x: bx,
      y: by,
      vx: Math.cos(a) * w.spd,
      vy: Math.sin(a) * w.spd,

      dmg,

    maxV = BASE * 1.5,
    acc = maxV * 1.2,
    can = c.bat > 0;
  if (thr > 0 && can) {
    const tg = maxV * thr;
    c.v = c.v < tg ? Math.min(tg, c.v + acc * dt) : Math.max(tg, c.v - maxV * 0.6 * dt);
  } else if (brk > 0 && c.v > 0) c.v = Math.max(0, c.v - maxV * 2.2 * brk * dt);

  dark.gcd -= dt;

  const g = team[dark.crew.find(i => i !== dark.driver)];
  if (!g) return;
  let best = null,
    bd = DUAL_WPN.rng * 0.9;
  for (const e of enemies) {
    if (e.dead) continue;
    const q = body(e),
      d = dist(q.x, q.y, dark.x, dark.y);
    if (d < bd && los(dark.x, dark.y, q.x, q.y)) {
      bd = d;
      best = q;
    }
  }
  if (!best) return;
  dark.gcd = DUAL_WPN.cd;
  const a = Math.atan2(best.y - dark.y, best.x - dark.x) + (R() - 0.5) * 0.12;
  shootPair(dark.x, dark.y, a, DUAL_WPN, DUAL_WPN.dmg + dmgBonus(g), '#d8b8ff', 3);

}

// ---------- aggiornamento (chiamato da update) ----------
function updateDark(dt) {
  darkWarnT -= dt;

  if (dark.phase === 'build') {
    dark.t -= dt;
    if (dark.t <= 0) darkDone();

  }
  const driving = dark.driver >= 0 && dark.driver === active && state === 'play';
  if (driving && dark.crew) gunnerFire(dt);
  // ferma si ricarica: 8 minuti a Times Square, 1 ora altrove
  if (Math.abs(dark.v) < 4 && dark.bat < DARK_BAT) {
    const full = inSquare(dark.x, dark.y) ? DARK_FAST : DARK_SLOW;
    const was = dark.bat;
    dark.bat = Math.min(DARK_BAT, dark.bat + (DARK_BAT / full) * dt);
    if (was < DARK_BAT && dark.bat >= DARK_BAT && !driving) msg('AUTO NERA RICARICATA', '#b48cff');
  }
}

// ---------- disegno ----------
function drawDark(vis) {
  if (!dark) return;
  if (dark.phase === 'build') {
    const m = shops[dark.mech];
    if (m && vis(m.x, m.y)) lab('AUTO NERA ' + fmtL(dark.t), m.x, m.y - 40, '#b48cff');
    return;
  }
  if (!vis(dark.x, dark.y)) return;
  drawVeh(darkSpr, dark.x, dark.y, dark.a);
  if (dark.driver >= 0) return;
  if (dark.crew) lab('ATLAS E SEL A BORDO', dark.x, dark.y - 16, '#b48cff');
  else if (pAvail && dist(dark.x, dark.y, pBody.x, pBody.y) < 90) {
    const p = team[active];
    lab(p.onFoot && !p.inCar ? 'AUTO NERA' : 'AUTO NERA: VIENI A PIEDI', dark.x, dark.y - 16, '#b48cff');
  }
  if (dark.bat < DARK_BAT)
    lab('CARICA ' + Math.floor((dark.bat / DARK_BAT) * 100) + '%', dark.x, dark.y + 10, '#ffe03c');
}

// ---------- salvataggio ----------
function darkSave() {
  return dark ? { ...dark } : null;
}
function loadDark(d) {
  dark = d ? { ...d } : null;
  if (!dark) return;
  dark.cd = 0;
  dark.gcd = 0;
  dark.crew = dark.crew || null;
  if (dark.driver == null) dark.driver = -1;
  if (dark.driver >= 0) {
    const b = team[dark.driver];
    if (b && b.status === 'active') {
      b.inCar = dark;
      b.onFoot = false;
    } else if (dark.crew) {
      dark.hp = b ? b.hp : dark.hp;
      if (b) b.status = 'car';
      dark.driver = -1;
    } else dark.driver = -1;
  }
}

<script>
// ===== js/render.js =====

const CH = 512,
  CHN = Math.ceil(WPX / CH);

  gShops = [],

  for (const s of shops) gShops[gIdx(gc(s.x), gc(s.y))].push(s);

    box(gBlocks, b, b.x * CELL, b.y * CELL, (b.x + b.w) * CELL, (b.y + b.h) * CELL);
    for (const L of b.lots) {
      if (L.flat) continue;
      const it = {
        L,
        b,
        wx: L.x * CELL + 1,
        wy: L.y * CELL + 1,
        ww: L.w * CELL - 2,
        wh: L.h * CELL - 2,
        ox: 0,
        oy: 0,
        cv: null,
        ch: null,

      it.cy = it.wy + it.wh / 2;

      B = nodes[e.b];

function eachCell(grid, x0, y0, x1, y1, fn) {

    c1 = gc(x1),
    r0 = gc(y0),
    r1 = gc(y1);
  for (let r = r0; r <= r1; r++)

}
function chunkCv(c, r) {
  const k = gIdx(c, r);

    chunkCache.delete(k);
    chunkCache.set(k, cv2);
    return cv2;
  }

  g.imageSmoothingEnabled = false;
  const X0 = c * CH,
    Y0 = r * CH;

      B = nodes[e.b];
    if (e.h) {
      const xa = Math.min(A.x, B.x),
        xb = Math.max(A.x, B.x);
      g.fillStyle = '#6e6230';
      for (let x = Math.ceil((xa + 40) / 16) * 16; x < xb - 40; x += 16) g.fillRect(x, A.y - 1, 8, 2);
      if (xb - xa > 90) {
        g.fillStyle = '#4e4862';
        for (let y = A.y - 22; y < A.y + 22; y += 6) {
          g.fillRect(xa + 27, y, 8, 3);

    } else {
      const ya = Math.min(A.y, B.y),
        yb = Math.max(A.y, B.y);
      g.fillStyle = '#6e6230';
      for (let y = Math.ceil((ya + 40) / 16) * 16; y < yb - 40; y += 16) g.fillRect(A.x - 1, y, 2, 8);
      if (yb - ya > 90) {

        for (let x = A.x - 22; x < A.x + 22; x += 6) {
          g.fillRect(x, ya + 27, 3, 8);

  for (const b of gBlocks[k]) g.drawImage(blockCanvas(b), b.x * CELL, b.y * CELL);

    g.fillStyle = '#14111c';
    g.fillRect(l.x - 1, l.y - 1, 3, 3);

  if (chunkCache.size > 28) chunkCache.delete(chunkCache.keys().next().value);

}

const weather = { on: false, t: 0, int: 0, wet: 0 };

const drops = [];
