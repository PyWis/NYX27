// ===== js/core.js =====
'use strict';
// =====================================================================
//  NEW YORK XENO (NYX) — post-cyberpunk top-down bike brawler, 199X style
// =====================================================================
const cv = document.getElementById('c'),
  ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const VW = 640,
  VH = 360,
  CELL = 16,
  MW = 480,
  MH = 480,
  RW = 3,
  BASE = 90,
  BL = 16;
const WPX = MW * CELL,
  HPX = MH * CELL;
const BAT_MAX = 180;
let viewScale = 1;
function fit() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  const k = s >= 1 ? Math.floor(s) : s;
  viewScale = k;
  const w = VW * k,
    h = VH * k;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  const wr = document.getElementById('wrap');
  wr.style.width = w + 'px';
  wr.style.height = h + 'px';
  // passo delle scanline legato alla scala: niente moire
  const crt = document.getElementById('crt');
  if (crt) {
    const p = Math.max(2, Math.round(k * 1.5));
    crt.style.background =
      'repeating-linear-gradient(to bottom,rgba(0,0,0,.20) 0,rgba(0,0,0,.20) ' +
      Math.max(1, Math.round(k / 2)) +
      'px,transparent ' +
      Math.max(1, Math.round(k / 2)) +
      'px,transparent ' +
      p +
      'px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.6) 100%)';
  }
}
addEventListener('resize', fit);
fit();

// ---------- utils ----------
function mulberry(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry(1);
const rr = () => rng(),
  ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
const pickR = (r, a) => a[Math.floor(r() * a.length)];
const R = Math.random;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b, c, d) => Math.hypot(c - a, d - b);
function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return c;
}
function hx(h) {
  h = h.replace('#', '');
  return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
}
function shade(h, f) {
  const c = hx(h).map(v => (f >= 0 ? v + (255 - v) * f : v * (1 + f)));
  return (
    '#' +
    c
      .map(v =>
        Math.round(clamp(v, 0, 255))
          .toString(16)
          .padStart(2, '0'),
      )
      .join('')
  );
}
function hash(n) {
  n = Math.imul(n ^ 61 ^ (n >>> 16), 9);
  n = n + (n << 3);
  n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d);
  n = n ^ (n >>> 15);
  return (n >>> 0) / 4294967296;
}
function pc(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy));
    g.fillRect(cx - w, cy + dy, 2 * w + 1, 1);
  }
}
const fmt = s => {
  s = Math.max(0, Math.ceil(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
// compatta un array sul posto (niente nuove allocazioni ogni frame)
function compact(a, keep) {
  let j = 0;
  for (let i = 0; i < a.length; i++) {
    const v = a[i];
    if (keep(v)) a[j++] = v;
  }
  a.length = j;
  return a;
}
// lampeggio: con "riduci lampeggi" attivo resta sempre acceso
let T = 0;
const blink = n => (typeof SET !== 'undefined' && SET.lowFlash ? 1 : Math.floor(T * n) % 2);

// ---------- bitmap font 5x7 ----------
const FONT_SRC = {
  A: '01110 10001 10001 11111 10001 10001 10001',
  B: '11110 10001 10001 11110 10001 10001 11110',
  C: '01110 10001 10000 10000 10000 10001 01110',
  D: '11110 10001 10001 10001 10001 10001 11110',
  E: '11111 10000 10000 11110 10000 10000 11111',
  F: '11111 10000 10000 11110 10000 10000 10000',
  G: '01110 10001 10000 10111 10001 10001 01111',
  H: '10001 10001 10001 11111 10001 10001 10001',
  I: '01110 00100 00100 00100 00100 00100 01110',
  J: '00111 00010 00010 00010 00010 10010 01100',
  K: '10001 10010 10100 11000 10100 10010 10001',
  L: '10000 10000 10000 10000 10000 10000 11111',
  M: '10001 11011 10101 10101 10001 10001 10001',
  N: '10001 10001 11001 10101 10011 10001 10001',
  O: '01110 10001 10001 10001 10001 10001 01110',
  P: '11110 10001 10001 11110 10000 10000 10000',
  Q: '01110 10001 10001 10001 10101 10010 01101',
  R: '11110 10001 10001 11110 10100 10010 10001',
  S: '01111 10000 10000 01110 00001 00001 11110',

  U: '10001 10001 10001 10001 10001 10001 01110',
  V: '10001 10001 10001 10001 10001 01010 00100',
  W: '10001 10001 10001 10101 10101 10101 01010',

  Y: '10001 10001 10001 01010 00100 00100 00100',
  Z: '11111 00001 00010 00100 01000 10000 11111',
  0: '01110 10001 10011 10101 11001 10001 01110',

  _: '00000 00000 00000 00000 00000 00000 11111',

  $: '00100 01111 10100 01110 00101 11110 00100',

  '↑': '00100 01110 10101 00100 00100 00100 00100',

const GL = {};
for (const k in FONT_SRC) GL[k] = FONT_SRC[k].split(' ').map(r => parseInt(r, 2));
const norm = s => String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function glyphs(g, s, x, y, sc, col) {
  g.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const gl = GL[s[i]] || GL[' '];
    for (let r = 0; r < 7; r++) {
      const row = gl[r];
      if (!row) continue;
      for (let j = 0; j < 5; j++) if (row & (1 << (4 - j))) g.fillRect(x + (i * 6 + j) * sc, y + r * sc, sc, sc);
    }
  }
}
// atlante di glifi: un canvas per colore/scala/ombra con tutti i caratteri.
// Il testo dinamico (timer, soldi, distanze) non crea piu' canvas nuovi.
const GCHARS = Object.keys(FONT_SRC),
  GIDX = {};
GCHARS.forEach((c, i) => (GIDX[c] = i));
const atlases = new Map();
function atlas(col, sc, shadow) {
  const key = col + '|' + sc + '|' + shadow;
  let a = atlases.get(key);
  if (a) return a;
  a = mk(GCHARS.length * 6 * sc, 8 * sc);
  const g = a.getContext('2d');
  GCHARS.forEach((ch, i) => {
    if (shadow) glyphs(g, ch, i * 6 * sc + sc, sc, sc, shadow);
    glyphs(g, ch, i * 6 * sc, 0, sc, col);
  });
  atlases.set(key, a);
  return a;
}
function textW(s, sc) {
  return norm(s).length * 6 * sc - sc;
}
// testo ibrido: le stringhe fisse sono copiate da una cache (una sola drawImage),
// quelle con numeri (timer, soldi, distanze) sono composte dall'atlante senza allocare canvas
const tcache = new Map(),
  HAS_DIGIT = /\d/;
function txt(s, x, y, col = '#fff', sc = 1, align = 'left', shadow = '#000') {
  s = norm(s);
  const cw = 6 * sc,
    w = s.length * cw;
  let dx = x;
  if (align === 'center') dx = x - (w >> 1);
  else if (align === 'right') dx = x - w;
  dx = Math.round(dx);
  y = Math.round(y);
  if (HAS_DIGIT.test(s)) {
    const a = atlas(col, sc, shadow);
    for (let i = 0; i < s.length; i++) {
      const k = GIDX[s[i]];
      if (k === undefined || s[i] === ' ') continue;
      ctx.drawImage(a, k * cw, 0, cw, 8 * sc, dx + i * cw, y, cw, 8 * sc);
    }
    return;
  }
  const key = s + '|' + col + '|' + sc + '|' + shadow;
  let c = tcache.get(key);
  if (!c) {
    const a = atlas(col, sc, shadow);
    c = mk(Math.max(1, w), 8 * sc);
    const g = c.getContext('2d');
    for (let i = 0; i < s.length; i++) {
      const k = GIDX[s[i]];
      if (k !== undefined && s[i] !== ' ') g.drawImage(a, k * cw, 0, cw, 8 * sc, i * cw, 0, cw, 8 * sc);
    }
    tcache.set(key, c);
    if (tcache.size > 900) tcache.delete(tcache.keys().next().value);
  }
  ctx.drawImage(c, dx, y);
}

}

// ===== js/city.js =====
'use strict';
// ---------- city generation ----------
let ys, bands, solid, kind, blocks, nodes, edges, garage, neons, lamps, miniCv;
// kind: 0 building,1 road,2 sidewalk,3 park,4 garage
function genCity(seed) {
  rng = mulberry(seed);
  ys = [0];
  for (;;) {
    const n = ys[ys.length - 1] + RW + ri(9, 15);
    if (n + RW + 9 > MH - RW) {
      ys.push(MH - RW);
      break;
    }
    ys.push(n);
  }
  bands = [];
  let prev = [];
  for (let i = 0; i < ys.length - 1; i++) {
    const xs = [0];
    let x = 0;
    for (;;) {
      let n = x + RW + ri(8, 14);
      // evita l'allineamento con le strade verticali della fascia sopra -> incroci a T, quasi mai a +
      for (let k = 0; k < 3; k++) {
        if (prev.some(p => p > 0 && p < MW - RW && Math.abs(p - n) < 6) && rr() > 0.05) n += 7;
        else break;
      }
      if (n + RW + 8 > MW - RW) {
        xs.push(MW - RW);
        break;
      }
      xs.push(n);
      x = n;
    }
    bands.push(xs);
    prev = xs;
  }
  solid = new Uint8Array(MW * MH).fill(1);
  kind = new Uint8Array(MW * MH);
  const carve = (x, y, w, h, k) => {
    for (let j = y; j < y + h; j++)
      for (let i = x; i < x + w; i++) {
        const id = j * MW + i;
        solid[id] = 0;
        kind[id] = k;
      }
  };
  for (const y of ys) carve(0, y, MW, RW, 1);
  bands.forEach((xs, i) => {
    for (const x of xs) carve(x, ys[i], RW, ys[i + 1] - ys[i] + RW, 1);
  });

  for (let k = 0; k < ROT_N; k++) {

      ca = Math.cos(a),
      sa = Math.sin(a);

      g2 = s2.getContext('2d'),
      id2 = g2.createImageData(S, S),

        const dx = x + 0.5 - S / 2,
          dy = y + 0.5 - S / 2;
        const sx = Math.floor(dx * ca + dy * sa + w / 2),
          sy = Math.floor(-dx * sa + dy * ca + h / 2);

        d[o + 1] = sd[si + 1];
        d[o + 2] = sd[si + 2];
        d[o + 3] = sd[si + 3];
        d2[o + 3] = 255;

// ===== js/audio.js =====
'use strict';
// ---------- audio ----------
// catena: effetti -> sfxBus \
//                             > master -> compressore -> uscita

let AC = null,
  master = null,
  musicGain = null,
  sfxBus = null,
  comp = null,

  comp.threshold.value = -14;
  comp.knee.value = 10;
  comp.ratio.value = 6;
  comp.attack.value = 0.003;
  comp.release.value = 0.18;
  comp.connect(AC.destination);

  master.gain.value = 0.5;
  master.connect(comp);
  musicGain = AC.createGain();
  musicGain.connect(master);
  sfxBus = AC.createGain();
  sfxBus.connect(master);
  applyVolumes();
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // pioggia: rumore filtrato in loop, il volume segue l'intensita'
  const rb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate),
    rd = rb.getChannelData(0);
  for (let i = 0; i < rd.length; i++) rd[i] = Math.random() * 2 - 1;
  rainSrc = AC.createBufferSource();
  rainSrc.buffer = rb;
  rainSrc.loop = true;
  const f = AC.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = 2600;
  f.Q.value = 0.5;
  rainGain = AC.createGain();
  rainGain.gain.value = 0;
  rainSrc.connect(f);
  f.connect(rainGain);
  rainGain.connect(sfxBus);

}
function applyVolumes() {
  if (!AC) return;
  musicGain.gain.value = (0.2 * SET.music) / 10;
  sfxBus.gain.value = SET.sfx / 7;
}

  if (rainGain) rainGain.gain.setTargetAtTime(muted ? 0 : v * 0.06, AC.currentTime, 0.4);

  hit: 0.045,
  punch: 0.04,
  shoot: 0.035,
  rapid: 0.03,
  bump: 0.08,
  boom: 0.06,
  alert: 0.25,
  hurt: 0.06,
  slash: 0.04,

      tone(140, 'sine', t, 0.08, 0.15, 60);
      break;
    case 'hit':
      tone(220, 'square', t, 0.05, 0.05, 120);
      break;
    case 'hurt':
      tone(160, 'sawtooth', t, 0.15, 0.08, 70);
      break;
    case 'boom':
      noise(t, 0.5, 0.3, 1200);
      tone(90, 'sine', t, 0.4, 0.2, 30);
      break;
    case 'switch':
      [0, 4, 7, 12].forEach((k, i) => tone(mf(72 + k), 'triangle', t + i * 0.05, 0.08, 0.07));
      break;
    case 'charge':
      tone(660, 'sine', t, 0.1, 0.06);
      tone(990, 'sine', t + 0.08, 0.12, 0.06);
      break;
    case 'alert':
      tone(1200, 'square', t, 0.05, 0.04);
      tone(1200, 'square', t + 0.09, 0.05, 0.04);
      break;
    case 'bump':
      noise(t, 0.08, 0.12, 500);
      break;
    case 'buy':
      [0, 7, 12].forEach((k, i) => tone(mf(76 + k), 'square', t + i * 0.06, 0.07, 0.05));
      break;
    case 'cash':
      [0, 4, 7, 12, 16].forEach((k, i) => tone(mf(79 + k), 'square', t + i * 0.05, 0.06, 0.05));
      break;
    case 'siren':
      for (let i = 0; i < 4; i++) tone(i % 2 ? 620 : 880, 'square', t + i * 0.18, 0.17, 0.035);
      break;
    case 'nitro':
      noise(t, 0.4, 0.15, 800, 'bandpass');
      tone(200, 'sawtooth', t, 0.4, 0.06, 900);
      break;
    case 'mount':
      tone(300, 'triangle', t, 0.06, 0.06, 500);
      break;
    case 'empty':
      tone(200, 'square', t, 0.2, 0.05, 100);
      break;
    case 'laserup':
      tone(180, 'sawtooth', t, 1, 0.05, 900);
      tone(360, 'sine', t, 1, 0.03, 1800);
      break;
    case 'laser':
      noise(t, 0.25, 0.25, 5000, 'bandpass');
      tone(1200, 'sawtooth', t, 0.3, 0.09, 120);
      tone(70, 'sine', t, 0.35, 0.2, 30);
      break;
    case 'lshield':
      tone(1600, 'triangle', t, 0.06, 0.05, 2400);
      break;
    case 'sneak':
      [0, 3, 7].forEach((k, i) => tone(mf(70 + k), 'triangle', t + i * 0.07, 0.06, 0.04));
      break;

  [53, 57, 60],
  [48, 52, 55],
  [55, 59, 62],

  if (!AC || !musicOn || muted) {
    if (AC) nextT = AC.currentTime;
    return;

    if (nextT < AC.currentTime) nextT = AC.currentTime;
    const bar = Math.floor(step / 16) % 4,
      s = step % 16,
      ch = PROG[bar];
    if (s % 2 === 0) tone(mf(ch[0] - 24 + (s % 4 === 2 ? 12 : 0)), 'sawtooth', nextT, 0.16, 0.5, 0, musicGain);
    tone(mf(ch[s % 3] + 12 + (s >= 8 ? 12 : 0)), 'square', nextT, 0.07, 0.12, 0, musicGain);
    if (s % 4 === 0) tone(120, 'sine', nextT, 0.12, 0.9, 40, musicGain);
    if (s % 8 === 4) noise(nextT, 0.12, 0.5, 3000, 'highpass', musicGain);

    step++;
  }
}

// ---------- end conditions ----------
function endGame(win, reason) {
  if (state === 'end') return;
  state = 'end';
  meta.ended = { win, reason, kills, at: meta.gameT };
  saveGame();
  msgs = [];
  sfx(win ? 'cash' : 'boom');
}
function checkEnd() {
  if (state === 'end' || !meta) return;
  const E = nightE();
  if (team.every(b => b.status === 'dead')) return endGame(false, 'TUTTI I BIKER NYX SONO MORTI');
  if (E >= NIGHT && enemies.length === 0) return endGame(true, "ALL'ALBA NESSUNO XENO E RIMASTO IN CITTA");
  if (nyxOn()) return; // con Nyx attiva non si va in game over
  if (E >= FINAL) return endGame(false, 'ALLE 6:15 GLI XENO SONO ANCORA IN CITTA');
  if (lowT >= 1800) return endGame(true, "XENO SOTTO QUOTA 3 PER MEZZ'ORA");
  if (xenoFullT !== null && xenoFullT <= 0) return endGame(false, 'GLI XENO HANNO RAGGIUNTO QUOTA 20');
}

// ---------- team logic ----------
function charge(b, dt, still) {
  if (!still) {
    b.chg = 0;
    return;
  }
  if (b.bat >= BAT_MAX) {
    b.chg = 0;
    return;
  }
  const per = inGarage(b.x, b.y) ? 15 : 30;
  b.chg += dt;
  if (b.chg >= per) {
    b.chg -= per;
    b.bat = Math.min(BAT_MAX, b.bat + 10);
    if (b === team[active] && pAvail) {
      pop(b.x, b.y - 14, '+10S SOLE', '#ffe03c');
      sfx('charge');
    }
  }
}
function heal(b, dt) {
  if (b.status === 'dead' || b.status === 'captured' || b.status === 'out' || b.status === 'hosp' || b.hp <= 0) return;
  if (b.medOn) {
    b.hp = Math.min(maxHP, b.hp + (25 / 60) * dt);
    if (b.hp >= maxHP) {
      b.medOn = false;
      if (b === team[active]) msg('CURA COMPLETATA', '#5cff7a');
    }
  } else if (atGarage(b)) b.hp = Math.min(maxHP, b.hp + (2 / 60) * dt);
}
function garageAutoMed() {
  if (garageMeds <= 0) return;
  let w = null;
  for (const b of team) if (atGarage(b) && b.hp < maxHP && !b.medOn && (!w || b.hp < w.hp)) w = b;
  if (w) {
    garageMeds--;
    w.medOn = true;
    if (state === 'play') msg('FARMACO DELLA RIMESSA A ' + w.name, '#5cff7a');
  }
}
function dismount(p) {
  const cand = [p.a + Math.PI / 2, p.a - Math.PI / 2, p.a + Math.PI];
  let fx = p.x,
    fy = p.y;
  for (const a of cand) {
    const x = p.x + Math.cos(a) * 12,
      y = p.y + Math.sin(a) * 12;
    if (!blocked(x, y, 3)) {
      fx = x;
      fy = y;
      break;
    }
  }
  p.onFoot = true;
  p.fx = fx;
  p.fy = fy;
  p.v = 0;
  p.fa = p.a;
  p.nitroT = 0;
  p.walkPath = null;
  sfx('mount');
}
function park(p) {
  if (p.inCar) exitCar(p, false);
  p.onFoot = false;
  p.v = 0;
  p.nitroT = 0;
  p.walkPath = null;
  if (inGarage(p.x, p.y)) toBay(p, 'garage');
  else {
    p.status = 'idle';
    p.waitT = 180 + R() * 420;
    p.chkT = 0;
    p.waitCharge = false;
  }
}
function nextAvail(from) {
  for (let k = 1; k <= NB; k++) {
    const j = (from + k) % NB;
    if (AVAIL(team[j].status)) return j;
  }
  return -1;
}
function activate(n) {

function leaveActive() {

function defeat() {
  const p = team[active];
  if (p.inCar) exitCar(p, false);
  const wasNyx = p.nyx;
  endNyx(p, '');
  const pb = body(p);
  boom(pb.x, pb.y);
  p.medOn = false;
  p.hp = 0;
  if (wasNyx && p.lastSrc === 'nyx') {
    p.status = 'out';
    p.outR = 'ESAUSTA';
    p.outT = 1800;
    msg('NYX SI E CONSUMATA PRIMA DELLA RIMESSA: FUORI 30 MIN', '#b48cff');
    toBay(p);
    return leaveActive();
  }
  if (p.lastSrc === 'police') {
    p.status = 'out';
    p.outR = 'ARRESTATO';
    p.outT = 3600;
    msg(p.name + ' ARRESTATO! FUORI GIOCO 1 ORA', '#3a7bff');
  } else if (p.lastSrc === 'xeno') {
    let cap = enemies.find(e => e.id === p.lastE && !e.dead);
    if (!cap) {
      let bd = 500;
      for (const e of enemies) {
        const d = dist(e.x, e.y, pb.x, pb.y);
        if (!e.dead && d < bd) {
          bd = d;
          cap = e;
        }
      }
    }
    if (!cap || R() < 0.2) {
      p.status = 'out';
      p.outR = 'FUGGITO';
      p.outT = 180;
      msg(p.name + ' SI ARRENDE MA SCAPPA! IN RIMESSA TRA 3 MIN', '#ffe03c');
    } else {
      p.status = 'captured';
      p.captor = cap.id;
      p.capT = 1800;
      msg(p.name + ' CATTURATO! UCCIDI LO XENO ENTRO 30 MIN', '#ff3df2');
    }
  } else {
    p.status = 'out';
    p.outR = 'FERITO';
    p.outT = 1800;
    msg(p.name + ' FERITO DAL NEGOZIANTE! FUORI 30 MIN', '#ff4d6d');
  }
  toBay(p);
  leaveActive();
}
function freeCaptives(e) {

function damageEnemy(e, d) {

  e.hp -= d;
  e.hitT = 0.12;
  const b = body(e);
  pop(b.x, b.y - 12, '-' + d, '#ffffff');
  spark(b.x, b.y, ACID, 5, 60);
  sfx('hit');
  if (e.state === 'wander') {
    e.state = 'chase';
    e.lock = 0;
  }
  if (e.hp <= 0) {
    e.dead = true;
    kills++;
    boom(b.x, b.y);
    addDebris(b.x, b.y, ROSTER[e.t].ui);
    hitStop = Math.max(hitStop, 0.07);
    freeCaptives(e);
    if (kills % 5 === 0) msg(kills + ' XENO ABBATTUTI!', ACID);

function damageCop(c, d) {

// kind: 'weapon' | 'punch' — lo scudo NASA ferma solo le armi Xeno
function damagePlayer(d, src, from, kind) {
  if (!pAvail) return;
  const p = team[active];
  const b = body(p);
  if (src === 'xeno' && kind === 'weapon' && p.shield) {
    if (p.shieldT === null) {
      p.shieldT = 1200;
      msg('SCUDO NASA ATTIVATO: 20 MINUTI', '#9fd4ff');
    }
    spark(b.x, b.y, '#9fd4ff', 6, 70);
    pop(b.x, b.y - 14, 'SCUDO', '#9fd4ff');
    sfx('hit');
    return;
  }
  // Melanie: scudo laser in moto, ogni colpo toglie solo 1
  if (ROSTER[p.i].laserShield && !p.onFoot && !p.inCar && d > 1) {
    d = 1;
    spark(b.x, b.y, '#ffd21f', 5, 70);
    pop(b.x, b.y - 22, 'SCUDO LASER', '#ffd21f');
    sfx('lshield');
  }
  p.hp -= d;
  p.lastSrc = src;
  p.lastE = (from && from.id) || 0;
  hurt = 0.25;
  shake = Math.max(shake, 3);
  pop(b.x, b.y - 14, '-' + d, '#ff4d6d');

function copsOut() {

function playerAttack(p) {
  const w = p.wpn;
  p.cd = w.cd;
  const fast = w === ROSTER[3].wpn,
    dmg = w.dmg + dmgBonus(p);
  if (w.k === 'laser') {
    fx.push({ k: 'laser', x: p.x, y: p.y, a: p.a, t: 0, dur: 0.35, r: w.rad, c: '#ff8a1f', own: p });
    sfx('laser');
    shake = Math.max(shake, 4);
    rumble(240, 1);
    let n = 0;
    for (const e of enemies) {
      const b = body(e);
      if (dist(b.x, b.y, p.x, p.y) < w.rad + 6) {
        damageEnemy(e, Math.max(w.dmg, e.hp));
        n++;
      }
    }
    for (const c of copsOut())
      if (dist(c.x, c.y, p.x, p.y) < w.rad + 6) {
        damageCop(c, 999);
        n++;
      }
    if (n) hitStop = Math.max(hitStop, 0.1);
    return;
  }
  if (w.k === 'gun') {
    const x = p.x + Math.cos(p.a) * 11,
      y = p.y + Math.sin(p.a) * 11;
    bullets.push({
      x,
      y,
      vx: Math.cos(p.a) * w.spd,
      vy: Math.sin(p.a) * w.spd,
      life: w.rng / w.spd,
      dmg,
      o: 'p',
      c: fast ? '#9fd4ff' : '#fff59a',
    });
    fx.push({ k: 'flash', x, y, t: 0, dur: 0.08, r: 14, c: '#ffe9a0' });
    sfx(fast ? 'rapid' : 'shoot');
  } else {
    fx.push({
      k: w.style,
      x: p.x,
      y: p.y,
      a: p.a,
      t: 0,
      dur: w.style === 'whip' ? 0.3 : 0.22,
      r: w.rad,
      c: w.style === 'whip' ? '#b48cff' : '#d8fff0',
      own: p,
    });
    sfx(w.style === 'whip' ? 'whip' : 'slash');
    let n = 0;
    for (const e of enemies) {
      const b = body(e);
      if (dist(b.x, b.y, p.x, p.y) < w.rad + 6) {
        damageEnemy(e, dmg);
        n++;
      }
    }
    for (const c of copsOut())
      if (dist(c.x, c.y, p.x, p.y) < w.rad + 6) {
        damageCop(c, dmg);
        n++;
      }
    if (n) {
      hitStop = Math.max(hitStop, 0.04);
      rumble(60, 0.3);
    }
  }
}
function playerPunch(p) {
  p.cd = p.punch.cd;
  p.punchT = 0.12;
  const px = p.fx + Math.cos(p.fa) * 9,
    py = p.fy + Math.sin(p.fa) * 9;
  let hit = false;
  const pd = p.punch.dmg + dmgBonus(p);
  for (const e of enemies) {
    const b = body(e);
    if (dist(b.x, b.y, px, py) < 12) {
      damageEnemy(e, pd);
      hit = true;
    }
  }
  for (const c of copsOut())
    if (dist(c.x, c.y, px, py) < 12) {
      damageCop(c, pd);
      hit = true;
    }
  if (hit) {
    pop(px, py - 8, 'POW!', '#ffe03c');
    spark(px, py, '#ffffff', 4, 50);
    hitStop = Math.max(hitStop, 0.05);
    rumble(70, 0.4);
  }
  sfx('punch');
}

function exitCar(p, walk) {

  p.inCar = null;
  if (c.mode === 'driven') {
    c.mode = 'abandoned';
    c.abT = 0;
  }

    fy = c.y;
  for (const a of [c.a + Math.PI / 2, c.a - Math.PI / 2, c.a + Math.PI]) {
    const x = c.x + Math.cos(a) * 14,
      y = c.y + Math.sin(a) * 14;

      fy = y;
      break;
    }

  p.onFoot = true;
  p.fx = fx;
  p.fy = fy;

function startWalk(p) {

    const s = nearestNodeLOS(p.fx, p.fy),
      t = nearestNodeLOS(p.x, p.y);
    const path = dijkstra(s, t) || [];
    for (const i of path) pts.push({ x: nodes[i].x, y: nodes[i].y });
  }
  pts.push({ x: p.x, y: p.y });
  p.walkPath = pts;
  p.wpi = 0;

function driveCar(p, c, dt, thr, brk, st) {
  const maxV = BASE * 1.15,
    acc = maxV * 1.1;
  if (thr > 0) {
    const tg = maxV * thr;
    c.v = c.v < tg ? Math.min(tg, c.v + acc * dt) : Math.max(tg, c.v - maxV * 0.6 * dt);
  } else if (brk > 0 && c.v > 0) c.v = Math.max(0, c.v - maxV * 2 * brk * dt);
  else if (brk > 0) c.v = Math.max(-maxV * 0.3, c.v - acc * 0.5 * brk * dt);
  else {
    const f = maxV * 0.6 * dt;
    c.v = Math.abs(c.v) <= f ? 0 : c.v - Math.sign(c.v) * f;
  }
  const steer = st;
  c.a += steer * 2.5 * Math.min(1, 0.3 + Math.abs(c.v) / 60) * dt * (c.v < -1 ? -1 : 1);
  if (moveCol(c, 'x', 'y', Math.cos(c.a) * c.v * dt, Math.sin(c.a) * c.v * dt, 6)) {
    if (Math.abs(c.v) > 40) {
      spark(c.x + Math.cos(c.a) * 12, c.y + Math.sin(c.a) * 12, '#ffd27a', 6, 80);
      sfx('bump');
    }
    c.v *= 0.5;
  }
  p.fx = c.x;
  p.fy = c.y;
  p.fa = c.a;
  if (inGarage(c.x, c.y)) return deliverCar(p, c);
  const hq = shops.find(s => s.type === 'cop');
  if (hq && dist(c.x, c.y, hq.x, hq.y) < 36) return copHQ(p, c);
  if (hit('mount')) exitCar(p, true);
}
function updatePlayer(p, dt) {
  // tastiera = 0/1, gamepad = valori analogici
  const st = axisSteer(),
    thr = axisThr(),
    brk = axisBrk(),
    atk = isDown('attack');
  p.cd -= dt;
  p.punchT -= dt;
  if (p.nitroT > 0) {
    p.nitroT -= dt;
    if (p.nitroT <= 0) msg('NITRO ESAURITO', '#7a6f99');
  }
  if (p.inCar) {
    driveCar(p, p.inCar, dt, thr, brk, st);
    charge(p, dt, true);
    return;
  }
  if (!p.onFoot) {
    const boost = p.nitroT > 0 ? 2 : 1,
      maxV = speedOf(p) * boost,
      acc = maxV * 1.3,
      can = p.bat > 0;
    // spada laser: tenendo premuto l'attacco la moto frena fino a fermarsi, poi carica
    const laser = p.wpn && p.wpn.k === 'laser',
      holding = laser && atk && p.cd <= 0;
    if (holding) {
      const f = maxV * 2.4 * dt;
      p.v = Math.abs(p.v) <= f ? 0 : p.v - Math.sign(p.v) * f;
    } else if (thr > 0 && can) {
      const tg = maxV * thr;
      p.v = p.v < tg ? Math.min(tg, p.v + acc * dt) : Math.max(tg, p.v - maxV * 0.7 * dt);
    } else if (brk > 0 && p.v > 0) p.v = Math.max(0, p.v - maxV * 2.4 * brk * dt);
    else if (brk > 0 && can) p.v = Math.max(-speedOf(p) * 0.3, p.v - acc * 0.5 * brk * dt);
    else {
      const f = maxV * 0.7 * dt;
      p.v = Math.abs(p.v) <= f ? 0 : p.v - Math.sign(p.v) * f;
    }
    if (p.v > maxV) p.v = Math.max(maxV, p.v - maxV * dt);
    const tr = (3.1 * Math.min(1, 0.4 + Math.abs(p.v) / 70)) / (maxV > BASE * 1.5 ? 1.15 : 1);
    p.a += st * tr * dt * (p.v < -1 ? -1 : 1);
    // inclinazione in curva (solo visiva)
    const lt = st * Math.min(1, Math.abs(p.v) / BASE);
    p.lean += (lt - p.lean) * Math.min(1, dt * 8);
    const hitW = moveCol(p, 'x', 'y', Math.cos(p.a) * p.v * dt, Math.sin(p.a) * p.v * dt, 5);
    if (hitW) {
      if (Math.abs(p.v) > 45) {
        spark(p.x + Math.cos(p.a) * 8, p.y + Math.sin(p.a) * 8, '#ffd27a', 6, 80);
        sfx('bump');
        shake = Math.max(shake, 2);
        rumble(90, 0.5);
      }
      p.v *= 0.5;
    }
    // segni di frenata / derapata e scia del nitro sull'asfalto
    p.skT -= dt;
    if (p.skT <= 0) {
      p.skT = 0.03;
      if ((brk > 0 && p.v > BASE * 0.6) || (Math.abs(st) > 0.6 && Math.abs(p.v) > BASE * 0.95) || (holding && p.v > 30))
        addSkid(p.x, p.y, p.a, '#0b0910');
      else if (p.nitroT > 0 && p.v > 40) addSkid(p.x, p.y, p.a, '#1d5a78');
    }
    if (Math.abs(p.v) > 4 && !p.nyx) {
      p.bat = Math.max(0, p.bat - dt);
      p.chg = 0;
      if (p.bat <= 0 && !p.batWarn) {
        msg('BATTERIA SCARICA! FERMO AL SOLE O ' + K('mount') + ' PER SCENDERE', '#ff4d6d');
        p.batWarn = true;
      }
    }
    if (p.bat > 0) p.batWarn = false;
    if (p.nitroT > 0 && Math.abs(p.v) > 20)
      addPart(
        p.x - Math.cos(p.a) * 10,
        p.y - Math.sin(p.a) * 10,
        -Math.cos(p.a) * 30 + (R() - 0.5) * 20,
        -Math.sin(p.a) * 30 + (R() - 0.5) * 20,
        0.3,
        R() < 0.5 ? '#3cf2ff' : '#ffffff',
        2,
      );
    if (laser) {
      if (holding && Math.abs(p.v) < 4) {
        if (!p.lchg) sfx('laserup');
        p.lchg += dt;
        if (p.lchg >= p.wpn.chg) {
          p.lchg = 0;
          playerAttack(p);
        }
      } else p.lchg = 0;
    } else if (atk && p.wpn && p.cd <= 0) playerAttack(p);
    if (hit('mount')) {
      p.lchg = 0;
      dismount(p);
    }
    charge(p, dt, Math.abs(p.v) < 4);
  } else {
    p.lchg = 0;
    let dx = (isKey('right') ? 1 : 0) - (isKey('left') ? 1 : 0),
      dy = (isKey('down') ? 1 : 0) - (isKey('up') ? 1 : 0);
    if (!dx && !dy) {
      dx = PAD.sx;
      dy = PAD.sy;
    }
    if (dx || dy) {
      p.walkPath = null;
      const l = Math.hypot(dx, dy),
        m = Math.min(1, l);
      dx /= l;
      dy /= l;
      p.fa = Math.atan2(dy, dx);
      p.walk += dt * 12 * m;
      moveCol(p, 'fx', 'fy', dx * 48 * m * dt, dy * 48 * m * dt, 3);
    } else if (p.walkPath) {
      const q = p.walkPath[p.wpi];
      const ddx = q.x - p.fx,
        ddy = q.y - p.fy,
        d = Math.hypot(ddx, ddy),
        sp = 48 * dt;
      p.fa = Math.atan2(ddy, ddx);
      p.walk += dt * 12;
      if (d <= sp) {
        p.fx = q.x;
        p.fy = q.y;
        p.wpi++;
        if (p.wpi >= p.walkPath.length) {
          p.walkPath = null;
          p.onFoot = false;
          sfx('mount');
          msg(p.name + ' DI NUOVO IN SELLA', p.ui);
        }
      } else {
        p.fx += (ddx / d) * sp;
        p.fy += (ddy / d) * sp;
      }
    }
    if (atk && p.cd <= 0) playerPunch(p);
    if (hit('mount')) {
      if (dist(p.fx, p.fy, p.x, p.y) < 26) {
        p.onFoot = false;
        p.walkPath = null;
        sfx('mount');
      } else msg('TROPPO LONTANO DALLA MOTO', '#ffe03c');
    }
    charge(p, dt, true);
  }
}

function board(b, dest) {
  b.status = 'amb';
  b.ambDest = dest;
  b.onFoot = false;
  b.v = 0;
  b.walkPath = null;
  b.path = null;

function callAmbulance(p, s) {
  garageMeds += 3;
  garageAutoMed();
  msg("ARRIVA L'AUTO MEDICA: 3 FARMACI ALLA RIMESSA", '#ff4d6d');
  sfx('siren');
  const hosp = shops.find(x => x.type === 'hosp');
  const busy = team.some(t => t.status === 'hosp');
  const cand = team
    .filter(t => (AVAIL(t.status) || t === p) && t.hp < maxHP)
    .sort((a, b) => a.hp / maxHP - b.hp / maxHP);
  const worst = cand[0] || null;
  amb = { x: s.x, y: s.y, a: 0, legs: [], li: 0, path: null, pi: 0, riders: [] };
  if (worst && worst !== p) {
    worst.status = 'waitamb';
    worst.path = null;
    worst.v = 0;
  }
  const ride = p.hp < maxHP;
  if (ride) {
    if (p.inCar) exitCar(p, false);
    board(p, worst === p && !busy ? 'hosp' : 'medbay');
  }
  if (worst && worst !== p && worst.status !== 'garage')
    amb.legs.push({ x: worst.x, y: worst.y, act: 'pick', w: worst.i });
  amb.legs.push({ x: garage.cx, y: garage.cy, act: 'garage', w: worst ? worst.i : -1 });
  if (worst && !busy) amb.legs.push({ x: hosp.x, y: hosp.y, act: 'hosp' });
  if (ride) leaveActive();
}
function ambAction(leg) {
  const busy = team.some(t => t.status === 'hosp');
  if (leg.act === 'pick') {
    const w = team[leg.w];
    if (w.status === 'waitamb') {
      board(w, busy ? 'medbay' : 'hosp');
      msg("L'AUTO MEDICA CARICA " + w.name, '#ff4d6d');
    }
  } else if (leg.act === 'garage') {
    for (const b of amb.riders.filter(b => b.ambDest === 'medbay')) {
      b.status = 'medbay';
      b.px = garage.cx + (b.i - 2.5) * 10;
      b.py = garage.cy + 20;
      msg(b.name + ' IN CURA IN RIMESSA (MOTO LASCIATA FUORI)', b.ui);
    }
    amb.riders = amb.riders.filter(b => b.status === 'amb');
    const w = leg.w >= 0 ? team[leg.w] : null;
    if (w && w.status === 'waitamb') {
      if (busy) w.status = 'garage';
      else board(w, 'hosp');
    }
  } else if (leg.act === 'hosp') {
    for (const b of amb.riders) {
      if (team.some(t => t.status === 'hosp')) {
        b.status = 'medbay';
        b.px = garage.cx;
        b.py = garage.cy + 20;
        continue;
      }
      b.status = 'hosp';
      b.px = leg.x;
      b.py = leg.y;
      msg(b.name + " RICOVERATO DALL'AUTO MEDICA", '#ff4d6d');
    }
    amb.riders = [];
  }
}
function updateAmb(dt) {
  if (!amb) return;
  const leg = amb.legs[amb.li];
  if (!leg) {
    amb = null;
    return;
  }
  if (!amb.path) {
    const s0 = nearestNodeLOS(amb.x, amb.y),
      t0 = nearestNodeLOS(leg.x, leg.y);
    amb.path = (dijkstra(s0, t0) || []).map(i => ({ x: nodes[i].x, y: nodes[i].y }));
    amb.path.push({ x: leg.x, y: leg.y });
    amb.pi = 0;
  }
  const q = amb.path[amb.pi];
  const dx = q.x - amb.x,
    dy = q.y - amb.y,
    d = Math.hypot(dx, dy),
    sp = 170 * dt;
  if (d > 0.5) amb.a += clamp(angDiff(Math.atan2(dy, dx), amb.a), -8 * dt, 8 * dt);
  if (d <= sp) {
    amb.x = q.x;
    amb.y = q.y;
    amb.pi++;
    if (amb.pi >= amb.path.length) {
      ambAction(leg);
      amb.li++;
      amb.path = null;
      if (amb.li >= amb.legs.length) {
        amb = null;
        return;
      }
    }
  } else {
    amb.x += (dx / d) * sp;
    amb.y += (dy / d) * sp;
  }
  for (const b of amb.riders) {
    b.px = amb.x;
    b.py = amb.y;
  }
}

function newMission() {

  if (!pool.length) {

// ---------- police ----------

function updatePolice(c, dt) {

      ty = pb.y;

    const dk = dist(k.x, k.y, pb.x, pb.y);
    const ks = los(k.x, k.y, pb.x, pb.y);
    let tx = pb.x,
      ty = pb.y;
    if (!ks) {
      const f = flowDir(k.x, k.y);
      if (f) {
        tx = f.x;
        ty = f.y;
      }
    }
    k.fa = Math.atan2(pb.y - k.y, pb.x - k.x);
    if (dk > 10) {
      const dx = tx - k.x,
        dy = ty - k.y,
        l = Math.hypot(dx, dy) || 1;
      moveCol(k, 'x', 'y', (dx / l) * 50 * dt, (dy / l) * 50 * dt, 3);

      const a = k.fa + (R() - 0.5) * 0.3;
      bullets.push({
        x: k.x + Math.cos(a) * 6,
        y: k.y + Math.sin(a) * 6,
        vx: Math.cos(a) * 300,
        vy: Math.sin(a) * 300,
        life: 0.7,
        dmg: 5,
        o: 'c',
        c: '#9fd4ff',
      });
      k.cd = 0.9;
      sfx('shoot');
    }
    if (dk < 15 && (p.onFoot || p.inCar || Math.abs(p.v) < 25)) touching = true;
  }
  c.arrest = touching ? c.arrest + dt : Math.max(0, c.arrest - dt * 0.5);
  if (c.arrest >= 1.2) {
    c.arrest = 0;
    p.lastSrc = 'police';
    p.hp = 0;
  }
}
function recallCops(c, out, dt) {
  for (const k of out) {
    const dx = c.x - k.x,
      dy = c.y - k.y,
      l = Math.hypot(dx, dy);
    if (l < 8) {
      k.out = false;
      continue;
    }
    moveCol(k, 'x', 'y', (dx / l) * 55 * dt, (dy / l) * 55 * dt, 3);
    k.walk += dt * 12;
    k.fa = Math.atan2(dy, dx);
  }
}

<script>
// ===== js/render.js =====
'use strict';

//  RENDER DEL MONDO

const CH = 512,

  };

    for (const L of b.lots) {
      if (L.flat) continue;

      B = nodes[e.b];

function eachCell(grid, x0, y0, x1, y1, fn) {

  for (let r = r0; r <= r1; r++)

function chunkCv(c, r) {
  const k = gIdx(c, r);

  if (cv2) {
    chunkCache.delete(k);
    chunkCache.set(k, cv2);

  }

    g.fillRect(l.x - 1, l.y - 1, 3, 3);

}

// ---------- edifici pseudo-3D ----------
let bVis = [],
  bFrame = 0;
function drawBuildings(cx, cy, X0, Y0, X1, Y1) {
  bVis.length = 0;
  bFrame++;
  eachCell(gLots, X0 - 220, Y0 - 220, X1 + 220, Y1 + 220, it => {
    const k = 0.009 * it.L.hgt;
    const ox = Math.round((it.cx - cx) * k),
      oy = Math.round((it.cy - cy) * k);
    if (
      Math.max(it.wx, it.wx + ox) > X1 ||
      Math.min(it.wx, it.wx + ox) + it.ww < X0 ||
      Math.max(it.wy, it.wy + oy) > Y1 ||
      Math.min(it.wy, it.wy + oy) + it.wh < Y0
    )
      return;
    it.ox = ox;
    it.oy = oy;
    it.fr = bFrame;
    bVis.push(it);
  });
  bVis.sort((a, b) => a.L.hgt - b.L.hgt);
  for (const it of bVis) {
    const L = it.L,
      rc = lotRoof(L, it.b),
      { wx, wy, ww, wh, ox, oy } = it;
    if (!it.cv) {
      it.cv = [-0.68, -0.6, -0.52, -0.44].map(f => shade(L.roof, f));
      it.ch = [-0.78, -0.72, -0.66, -0.6].map(f => shade(L.roof, f));
    }
    const n = Math.max(Math.abs(ox), Math.abs(oy));
    // le pareti: si "spazzano" i due bordi rivolti verso la camera, un pixel alla volta
    for (let i = 0; i < n; i++) {
      const t = i / n,
        dx = Math.round(ox * t),
        dy = Math.round(oy * t),
        lv = Math.min(3, (t * 4) | 0);
      if (ox) {
        ctx.fillStyle = it.cv[lv];
        ctx.fillRect(ox > 0 ? wx + dx : wx + ww - 1 + dx, wy + dy, 1, wh);
      }
      if (oy) {
        ctx.fillStyle = it.ch[lv];
        ctx.fillRect(wx + dx, oy > 0 ? wy + dy : wy + wh - 1 + dy, ww, 1);
      }
    }
    // finestre accese, a piani
    for (let i = 1; i < n - 1; i += 3) {
      const t = i / n,
        dx = Math.round(ox * t),
        dy = Math.round(oy * t);
      if (Math.abs(ox) > 2) {
        const x = ox > 0 ? wx + dx : wx + ww - 1 + dx;
        for (let y = wy + 3, j = 0; y < wy + wh - 3; y += 4, j++) {
          const c = L.win[(i * 5 + j) % 24];
          if (c) {
            ctx.fillStyle = c;
            ctx.fillRect(x, y + dy, 1, 2);
          }
        }
      }
      if (Math.abs(oy) > 2) {
        const y = oy > 0 ? wy + dy : wy + wh - 1 + dy;
        for (let x = wx + 3, j = 0; x < wx + ww - 3; x += 4, j++) {
          const c = L.win[(i * 3 + j + 7) % 24];
          if (c) {
            ctx.fillStyle = c;
            ctx.fillRect(x + dx, y, 2, 1);
          }
        }
      }
    }
    ctx.drawImage(rc, wx + ox, wy + oy);
  }
}
// posizione del neon a meta' parete (null se la parete non e' visibile)
function neonPos(n) {
  const it = n.L && n.L.it;
  if (!it || it.fr !== bFrame) return { x: n.x, y: n.y, vis: true };
  const L = n.L;
  let vis;
  if (n.h === 2) vis = n.y < L.y * CELL ? it.oy >= 0 : it.oy <= 0;
  else vis = n.x < L.x * CELL ? it.ox >= 0 : it.ox <= 0;

// ---------- lightmap ----------
const LS = 0.5,
  lightCv = mk(VW * LS, VH * LS),
  lctx = lightCv.getContext('2d');
// luce ambiente lungo la notte: crepuscolo -> notte fonda -> crepuscolo dell'alba (mai giorno)
const AMB_K = [
  [0, [205, 160, 178]],
  [1.5, [150, 128, 182]],
  [3.5, [116, 116, 170]],
  [9.5, [110, 112, 168]],
  [11, [138, 120, 172]],
  [12.4, [172, 138, 178]],

function ambientRGB() {
  const h = state === 'title' ? 4 : nightE() / 3600;
  for (let i = 0; i < AMB_K.length - 1; i++)
    if (h <= AMB_K[i + 1][0]) {
      const t = clamp((h - AMB_K[i][0]) / (AMB_K[i + 1][0] - AMB_K[i][0]), 0, 1);
      return AMB_K[i][1].map((v, j) => lerp(v, AMB_K[i + 1][1][j], t));

let LOX = 0,
  LOY = 0;

  if (a <= 0) return;

}
function drawLights(ox, oy, X0, Y0, X1, Y1, playing) {

  lctx.globalAlpha = 1;

  eachCell(gNeons, X0, Y0, X1, Y1, n => {
    const q = neonPos(n);
    lglow(q.x + n.w / 2, q.y + n.h / 2, Math.max(n.w, n.h) * 0.9 + 18, n.c, neonA(n) * 1.6);
  });
  eachCell(gShops, X0, Y0, X1, Y1, s => lglow(s.x, s.y, SHOP_T[s.type].sp ? 64 : 42, SHOP_T[s.type].c, 0.55));

    }

  for (const e of enemies)
    if (!e.onFoot) {

      }

      const rad = f.r * (0.35 + 0.65 * Math.min(1, k * 1.8));
      ring(o.x, o.y, rad, k < 0.5 ? '#fff3c0' : f.c, 56, k * 3, 2);
      ctx.fillStyle = f.c;
      for (let s = 0; s < 3; s++) {
        const a = f.a + k * 9 + s * 2.094;
        for (let r2 = 4; r2 < rad; r2 += 1.5)
          ctx.fillRect(Math.round(o.x + Math.cos(a) * r2), Math.round(o.y + Math.sin(a) * r2), 1, 1);
      }
    }
  }
  for (const b of bullets) {
    ctx.fillStyle = b.c;
    ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 1, 2, 2);
    const l = Math.hypot(b.vx, b.vy);
    ctx.globalAlpha = 0.5;
    ctx.fillRect(Math.round(b.x - (b.vx / l) * 4), Math.round(b.y - (b.vy / l) * 4), 1, 1);
    ctx.globalAlpha = 1;
  }
  for (const q of parts) {
    ctx.globalAlpha = Math.min(1, q.life * 3);
    ctx.fillStyle = q.c;
    ctx.fillRect(Math.round(q.x), Math.round(q.y), q.sz, q.sz);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // luce: buio della notte + sorgenti
  drawLights(ox, oy, X0, Y0, X1, Y1, playing);
  // bagliore additivo (bloom leggero)
  ctx.save();
  ctx.translate(-ox, -oy);
  ctx.globalCompositeOperation = 'lighter';
  ctx.imageSmoothingEnabled = true;
  eachCell(gNeons, X0, Y0, X1, Y1, n => {
    const q = neonPos(n);
    glow(q.x + n.w / 2, q.y + n.h / 2, Math.max(n.w, n.h) * 0.8 + 12, n.c, neonA(n) * 0.6);
  });
  eachCell(gShops, X0, Y0, X1, Y1, s =>
    glow(s.x, s.y, SHOP_T[s.type].sp ? 40 : 26, SHOP_T[s.type].c, 0.12 + 0.04 * Math.sin(T * 3 + s.i)),
  );
  if (vis(garage.cx, garage.cy)) glow(garage.cx, garage.cy, 110, '#ff3df2', 0.1 + 0.04 * Math.sin(T * 2));
  for (const c of police) {
    if (!vis(c.x, c.y) || (c.mode !== 'cops' && c.mode !== 'driven')) continue;
    const on = blink(6);
    const rx = c.x + Math.cos(c.a + Math.PI / 2) * 3,
      ry = c.y + Math.sin(c.a + Math.PI / 2) * 3,
      bx = c.x - Math.cos(c.a + Math.PI / 2) * 3,
      by = c.y - Math.sin(c.a + Math.PI / 2) * 3;
    const big = c.state === 'chase' || c.mode === 'driven';
    glow(rx, ry, big ? 24 : 14, '#ff2b4a', on ? 0.6 : 0.12);
    glow(bx, by, big ? 24 : 14, '#2b6bff', on ? 0.12 : 0.6);
  }
  if (amb && vis(amb.x, amb.y)) glow(amb.x, amb.y, 20, blink(8) ? '#ff2b4a' : '#ffffff', 0.5);
  for (const b of bullets) glow(b.x, b.y, 8, b.c, 0.5);
  for (const f of fx) {
    if (f.k === 'flash') glow(f.x, f.y, f.r * (1 - (f.t / f.dur) * 0.5), f.c, (1 - f.t / f.dur) * 0.6);
  }
  for (const e of enemies) if (!e.onFoot) glow(e.x, e.y, 12, ACID, 0.12);
  if (playing) {
    const p = team[active],
      pb = body(p);
    if (p.nyx) glow(pb.x, pb.y, 26, '#ff3df2', 0.3 + 0.12 * Math.sin(T * 5));
    if (p.nitroT > 0) glow(p.x, p.y, 20, '#3cf2ff', 0.3);
    if (p.shield && !p.inCar) glow(pb.x, pb.y, 18, '#9fd4ff', p.shieldT === null ? 0.1 : 0.2 + 0.06 * Math.sin(T * 8));
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = false;
  // sopra la luce: barre vita, insegne, etichette, numeri
  for (const e of enemies) {
    const b = body(e);
    if (!vis(b.x, b.y)) continue;
    if (e.hp < 25) {
      ctx.fillStyle = '#000';
      ctx.fillRect(b.x - 8, b.y - 12, 16, 3);
      ctx.fillStyle = ACID;
      ctx.fillRect(b.x - 7, b.y - 11, Math.max(0, (14 * e.hp) / 25), 1);
    }
  }
  for (const c of police)
    if (c.arrest > 0 && pAvail) {
      const w = Math.round((20 * c.arrest) / 1.2);
      ctx.fillStyle = '#000';
      ctx.fillRect(pBody.x - 11, pBody.y + 10, 22, 4);
      ctx.fillStyle = '#3a7bff';
      ctx.fillRect(pBody.x - 10, pBody.y + 11, w, 2);
      lab('ARRESTO', pBody.x, pBody.y + 16, '#9fd4ff');
    }
  eachCell(gShops, X0, Y0, X1, Y1, s => {
    const d = pAvail ? dist(s.x, s.y, pBody.x, pBody.y) : 1e9;
    if (s.anger > 0) {
      for (let i = 0; i < s.anger; i++) {
        ctx.fillStyle = '#ff4d6d';
        ctx.fillRect(s.x - s.anger * 2 + i * 4, s.y + 6, 3, 2);
      }
    }
    if (d < 90 || (SHOP_T[s.type].sp && d < 220)) {
      lab(s.name, s.x, s.y - 22, SHOP_T[s.type].c);
      if (s.anger > 0 && d < 24) lab('RABBIA ' + s.anger, s.x, s.y + 10, '#ff4d6d');
    }
  });
  if (playing) {
    const pb = body(team[active]);
    if (blink(4)) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(pb.x) - 1, Math.round(pb.y) - 11, 3, 1);
      ctx.fillRect(Math.round(pb.x), Math.round(pb.y) - 10, 1, 1);
    }
  }
  for (let i = 0; i < LBL.length; i += 4) txt(LBL[i], LBL[i + 1], LBL[i + 2], LBL[i + 3], 1, 'center');
  for (const q of pops) {
    ctx.globalAlpha = Math.min(1, q.life * 2);
    txt(q.t, q.x, q.y, q.c, 1, 'center');
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawRain(dt, ox, oy, dcx, dcy);
}

<script>
// ===== js/hud.js =====
'use strict';
// =====================================================================
//  HUD, MENU E SCHERMATE
// =====================================================================
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(8,5,16,.8)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ff3df2';
  ctx.fillRect(x, y, w, 1);
  ctx.fillRect(x, y, 1, h);
  ctx.fillStyle = '#3cf2ff';
  ctx.fillRect(x, y + h - 1, w, 1);
  ctx.fillRect(x + w - 1, y, 1, h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y, 2, 1);
  ctx.fillRect(x + w - 2, y + h - 1, 2, 1);
}
const barPat = (() => {
  const c = mk(4, 8),
    g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.45)';
  g.fillRect(3, 0, 1, 8);
  return ctx.createPattern(c, 'repeat');
})();
function bar(x, y, w, h, f, col) {
  ctx.fillStyle = '#1a1426';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col;
  ctx.fillRect(x, y, Math.round(w * clamp(f, 0, 1)), h);
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = barPat;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}
// bussola: anello disegnato una volta sola
const compassCv = (() => {
  const c = mk(60, 60),
    g = c.getContext('2d');
  g.fillStyle = 'rgba(8,5,16,.8)';
  g.beginPath();
  g.arc(30, 30, 28, 0, 6.283);
  g.fill();
  for (let a = 0; a < 72; a++) {
    g.fillStyle = a % 18 === 0 ? '#ffffff' : a % 2 ? '#ff3df2' : '#3cf2ff';
    g.fillRect(
      Math.round(30 + Math.cos((a / 72) * 6.283) * 27),
      Math.round(30 + Math.sin((a / 72) * 6.283) * 27),
      1,
      1,
    );
  }
  return c;
})();
function pips(x, y, n, max, col) {
  for (let i = 0; i < max; i++) {
    ctx.fillStyle = i < n ? col : '#2a2238';
    ctx.fillRect(x + i * 4, y, 3, 5);
  }
}
// riquadro con il nome del tasto/pulsante
function keyCap(k, x, y, col) {
  const w = textW(k, 1) + 6;
  ctx.fillStyle = col || '#ffe03c';
  ctx.fillRect(x, y, w, 11);
  ctx.fillStyle = '#0b0814';
  ctx.fillRect(x + 1, y + 1, w - 2, 9);
  txt(k, x + 3, y + 2, col || '#ffe03c', 1, 'left', '');
  return w;
}
function strip(s, x, y, col, a) {
  const w = textW(s, 1) + 8;
  ctx.fillStyle = 'rgba(8,5,16,' + (a == null ? 0.7 : a) + ')';
  ctx.fillRect(Math.round(x - w / 2), y - 2, w, 11);
  txt(s, x, y, col, 1, 'center');
}
const hpCol = f => (f > 0.5 ? '#5cff7a' : f > 0.25 ? '#ffe03c' : '#ff4d6d');

function statusTxt(b) {
  switch (b.status) {
    case 'active':
      return [
        b.nyx ? 'NYX' : b.inCar ? 'AUTO POLIZIA' : b.onFoot ? 'A PIEDI' : 'IN GUIDA',
        b.nyx ? '#ff3df2' : '#5cff7a',
      ];
    case 'garage':
      return ['IN RIMESSA', '#3cf2ff'];
    case 'idle':
      return [b.waitT > 0 ? 'FERMO ' + fmt(b.waitT) : 'ATTENDE CARICA', '#ffe03c'];
    case 'returning':
      return ['RIENTRO', '#ff9de6'];
    case 'amb':
      return ['AUTO MEDICA', '#ffffff'];
    case 'waitamb':
      return ['SOCCORSI', '#ff9de6'];
    case 'medbay':
      return ['IN CURA ' + Math.floor((b.hp / maxHP) * 100) + '%', '#5cff7a'];
    case 'fetch':
      return ['VA ALLA MOTO', '#ffe03c'];
    case 'hosp':
      return ['OSPEDALE ' + Math.floor((b.hp / maxHP) * 100) + '%', '#ff4d6d'];
    case 'out':
      return [
        (b.outR === 'ARRESTATO' ? 'ARRESTO' : b.outR) + ' ' + shortT(b.outT),
        b.outR === 'ARRESTATO' ? '#3a7bff' : '#ff4d6d',
      ];
    case 'captured':
      return ['RAPITO ' + shortT(b.capT), '#ff3df2'];
    case 'dead':
      return ['MORTO', '#6a5f80'];
  }
  return ['', ''];
}
// versione corta (max 9 caratteri) per le schede del roster
function statusShort(b) {
  const pc = Math.floor((b.hp / maxHP) * 100) + '%';
  switch (b.status) {
    case 'active':
      return [b.nyx ? 'NYX' : b.inCar ? 'AUTO POL' : b.onFoot ? 'A PIEDI' : 'IN GUIDA', b.nyx ? '#ff3df2' : '#5cff7a'];
    case 'garage':
      return ['RIMESSA', '#3cf2ff'];
    case 'idle':
      return [b.waitT > 0 ? 'STOP ' + fmt(b.waitT) : 'CARICA', '#ffe03c'];
    case 'returning':
      return ['RIENTRO', '#ff9de6'];
    case 'amb':
      return ['SOCCORSO', '#ffffff'];
    case 'waitamb':
      return ['SOCCORSI', '#ff9de6'];
    case 'medbay':
      return ['CURA ' + pc, '#5cff7a'];
    case 'fetch':
      return ['VA MOTO', '#ffe03c'];
    case 'hosp':
      return ['OSP ' + pc, '#ff4d6d'];
    case 'out':
      return [
        ({ ARRESTATO: 'ARR ', FERITO: 'FER ', FUGGITO: 'FUGA ', ESAUSTA: 'KO ' }[b.outR] || 'OUT ') + shortT(b.outT),
        b.outR === 'ARRESTATO' ? '#3a7bff' : '#ff4d6d',
      ];
    case 'captured':
      return ['RAP ' + shortT(b.capT), '#ff3df2'];
    case 'dead':
      return ['MORTO', '#6a5f80'];
  }
  return ['', ''];
}

function drawTopBar() {
  const E = nightE();
  panel(206, 4, 334, 36);
  txt(hhmm(E), 212, 8, E >= NIGHT ? '#ffb03c' : '#ffffff', 2);
  bar(212, 26, 58, 3, E / NIGHT, E >= NIGHT ? '#ffb03c' : '#7a6fff'); // avanzamento della notte verso le 06:00

    xc = xn >= 16 ? '#ff4d6d' : xn >= 10 ? '#ffb03c' : ACID;

  bar(280, 18, 96, 4, xn / 20, xc);
  txt(
    E >= NIGHT ? 'ALBA: NIENTE RINFORZI' : noSpawnT > 0 ? 'CHIESA STOP ' + fmt(noSpawnT) : 'RINFORZO ' + fmt(respawnT),
    280,
    26,
    noSpawnT > 0 ? '#e6e0ff' : '#ff9de6',
  );

  icon('skull', 384, 18, '#ffffff');
  txt('' + kills, 394, 18, '#ffffff');
  icon('cop', 438, 8, '#9fd4ff');
  txt('' + police.filter(c => !c.leave && !c.gone).length, 448, 8, '#9fd4ff');
  icon('med', 438, 18, '#5cff7a');

// azione contestuale vicino al giocatore: [tasto, testo]
function hudPrompt(p) {
  const b = body(p);
  if (p.onFoot && !p.inCar) {
    if (nearFreeCar(b)) return [K('use'), "RUBA L'AUTO"];
  }
  const s = nearShop(b);
  if (s && !p.inCar) {
    if (mission && mission.carrier < 0 && s.i === mission.from)

}
function drawHUD() {
  const p = team[active],
    pb = body(p),
    R0 = ROSTER[p.i];
  panel(4, 4, 198, 78);

  const lowB = p.bat < 20;
  icon('bolt', 38, 36, '#3cf2ff');
  bar(48, 37, 118, 5, p.bat / BAT_MAX, lowB && blink(4) ? '#ff4d6d' : '#3cf2ff');
  txt(fmt(p.bat), 196, 36, lowB ? '#ff4d6d' : '#ffffff', 1, 'right');
  const still = p.onFoot || Math.abs(p.v) < 4,
    gar = inGarage(p.x, p.y),
    per = gar ? 15 : 30;
  icon('sun', 9, 37, '#ffe03c');
  bar(18, 40, 16, 3, still && p.bat < BAT_MAX ? p.chg / per : 0, '#ffe03c');

  if (p.inCar) line = 'AUTO POLIZIA: RIMESSA O COMMISSARIATO';
  else if (p.onFoot)

  else if (p.bat <= 0) {
    line = 'BATTERIA SCARICA';

  } else if (p.wpn && p.wpn.k === 'laser')
    line = 'SPADA LASER: MORTALE' + (p.weapons.length > 1 ? ' [' + K('weapon') + ']' : '');
  else
    line = p.wpn
      ? p.wpn.label +
        ' ' +
        (p.wpn.dmg + dmgBonus(p)) +

      : 'NESSUNA ARMA - ' + K('mount') + ' PER I PUGNI';
  txt(line, 38, 47, lc);

  };

    cd2 = 1e9,

  }
  if (mission) {

    if (mission.carrier < 0 || mission.carrier === active) {

        (mission.carrier < 0 ? 'PACCO DA ' : 'CONSEGNA A ') +

        VW - 4,
        my2,
        '#ffe03c',
        1,

let logo = null;
function makeLogo() {
  const sc = 10,
    t = 'NYX',
    w = t.length * 6 * sc,
    h = 8 * sc;
  const c = mk(w + 8, h + 8),
    g = c.getContext('2d');
  glyphs(g, t, 6, 6, sc, '#2a0b3d');
  glyphs(g, t, 3, 3, sc, '#3cf2ff');
  const m = mk(w, h),
    mg = m.getContext('2d');
  glyphs(mg, t, 0, 0, sc, '#fff');
  mg.globalCompositeOperation = 'source-in';
  const gr = mg.createLinearGradient(0, 0, 0, 7 * sc);
  gr.addColorStop(0, '#ffe03c');
  gr.addColorStop(0.5, '#ff3df2');
  gr.addColorStop(1, '#7a2bff');
  mg.fillStyle = gr;
  mg.fillRect(0, 0, w, h);
  mg.globalCompositeOperation = 'destination-out';
  for (let y = Math.floor(3.6 * sc), k = 1; y < 7 * sc; y += 4 + k, k++) mg.fillRect(0, y, w, k > 3 ? 2 : 1);
  g.drawImage(m, 0, 0);
  return c;
}

  L.forEach((l, i) => txt(l[0], VW / 2, 40 + i * 14, l[1], 1, 'center'));
  txt(
    K('pause') +
      ' RIPRENDI   -   ' +
      (usingPad() ? 'SELECT' : K('options')) +
      ' OPZIONI E TASTI   -   ' +
      K('music') +
      ' MUSICA   -   ' +
      K('mute') +
      ' AUDIO',
    VW / 2,
    VH - 16,
    '#ffe03c',
    1,
    'center',
  );
}

// ---------- opzioni ----------
let optMenu = null; // {sel, sub:{sel,slot,listen}}
const OPT_ITEMS = [
  {
    n: 'VOLUME MUSICA',
    v: () => bar10(SET.music),
    adj: d => {
      SET.music = clamp(SET.music + d, 0, 10);
      applyVolumes();
    },
  },
  {
    n: 'VOLUME EFFETTI',
    v: () => bar10(SET.sfx),
    adj: d => {
      SET.sfx = clamp(SET.sfx + d, 0, 10);
      applyVolumes();
      sfx('menu');
    },
  },
  {
    n: 'RIDUCI LAMPEGGI',
    v: () => (SET.lowFlash ? 'SI' : 'NO'),
    adj: () => {
      SET.lowFlash = !SET.lowFlash;
    },
  },
  {
    n: 'EFFETTO CRT',
    v: () => (SET.crt ? 'SI' : 'NO'),
    adj: () => {
      SET.crt = !SET.crt;
      applyCRT();
    },
  },
  {
    n: 'SCOSSE DELLA CAMERA',
    v: () => (SET.shake ? 'SI' : 'NO'),
    adj: () => {
      SET.shake = !SET.shake;
    },
  },
  {
    n: 'VIBRAZIONE GAMEPAD',
    v: () => (SET.vibration ? 'SI' : 'NO'),
    adj: () => {
      SET.vibration = !SET.vibration;
      if (SET.vibration) rumble(200, 0.6);
    },
  },
  { n: 'SCHERMO INTERO', v: () => (document.fullscreenElement ? 'SI' : 'NO'), ok: () => toggleFS() },
  {
    n: 'RIMAPPA I TASTI',
    v: () => '>',
    ok: () => {
      optMenu.sub = { sel: 0, slot: 0, listen: false };
    },
  },
  {
    n: 'RIPRISTINA TASTI PREDEFINITI',
    v: () => '',
    ok: () => {
      resetBinds();
      toast('TASTI RIPRISTINATI');
    },
  },
  {
    n: 'INDIETRO',
    v: () => '',
    ok: () => {
      optMenu = null;
    },
  },
];
const bar10 = v => '[' + '|'.repeat(v) + ' '.repeat(10 - v) + '] ' + v;
const BIND_LIST = Object.keys(DEFAULT_BINDS);
function optionsInput() {
  const m = optMenu;
  if (!m) return;
  if (m.sub) {
    const sb = m.sub;
    if (sb.listen) return; // in attesa del tasto: lo cattura input.js
    if (mhit('up')) sb.sel = (sb.sel + BIND_LIST.length - 1) % BIND_LIST.length;
    if (mhit('down')) sb.sel = (sb.sel + 1) % BIND_LIST.length;
    if (mhit('left') || mhit('right')) sb.slot = 1 - sb.slot;
    if (mhit('del')) {
      const a = BIND_LIST[sb.sel];
      SET.binds[a][sb.slot] = '';
      saveSettings();
    }
    if (mhit('back')) {
      m.sub = null;
      saveSettings();
      return;
    }
    if (mhit('ok')) {
      sb.listen = true;
      const a = BIND_LIST[sb.sel],
        slot = sb.slot;
      rebindCb = code => {
        sb.listen = false;
        if (code !== 'Escape') bindKey(a, slot, code);
        clearPressed();
      };
    }
    return;
  }
  if (mhit('up')) m.sel = (m.sel + OPT_ITEMS.length - 1) % OPT_ITEMS.length;
  if (mhit('down')) m.sel = (m.sel + 1) % OPT_ITEMS.length;
  const it = OPT_ITEMS[m.sel];
  if (it.adj) {
    if (mhit('left')) {
      it.adj(-1);
      saveSettings();
    }
    if (mhit('right')) {
      it.adj(1);
      saveSettings();
    }
    if (mhit('ok')) {
      it.adj(1);
      saveSettings();
    }
  } else if (mhit('ok')) it.ok();
  if (mhit('back') || mhit('opts')) {
    optMenu = null;
    saveSettings();
  }
}
function drawOptions() {
  const m = optMenu;
  ctx.fillStyle = 'rgba(5,3,12,.9)';
  ctx.fillRect(0, 0, VW, VH);
  if (m.sub) {
    const sb = m.sub;
    txt('RIMAPPA I TASTI', VW / 2, 8, '#ff3df2', 2, 'center', '#2a0b3d');
    txt('AZIONE', 110, 30, '#7a6f99');
    txt('TASTO 1', 330, 30, '#7a6f99');
    txt('TASTO 2', 420, 30, '#7a6f99');
    txt('GAMEPAD', 510, 30, '#7a6f99');
    BIND_LIST.forEach((a, i) => {
      const y = 42 + i * 13,
        on = i === sb.sel;
      if (on) {
        ctx.fillStyle = 'rgba(255,61,242,.16)';
        ctx.fillRect(100, y - 3, 500, 13);
      }
      txt(ACTION_NAMES[a], 110, y, on ? '#ffffff' : '#c9c2e6');
      for (let s = 0; s < 2; s++) {
        const sel = on && sb.slot === s;
        const lbl = sel && sb.listen ? (blink(4) ? '...' : '') : keyLabel(SET.binds[a][s]);
        if (sel) {
          ctx.fillStyle = '#ffe03c';
          ctx.fillRect(326 + s * 90, y - 2, 70, 11);
          ctx.fillStyle = '#0b0814';
          ctx.fillRect(327 + s * 90, y - 1, 68, 9);
        }
        txt(lbl, 330 + s * 90, y, sel ? '#ffe03c' : '#ffffff');
      }
      txt((PAD.ps && PADN_PS[a]) || PADN_X[a] || '-', 510, y, '#7a6f99');
    });
    txt(
      sb.listen
        ? 'PREMI IL NUOVO TASTO - ESC ANNULLA'
        : '↑↓ AZIONE  ←→ TASTO 1/2  ' + KM('ok') + ' CAMBIA  ' + KM('del') + ' TOGLI  ' + KM('back') + ' INDIETRO',
      VW / 2,
      VH - 24,
      '#ffe03c',
      1,
      'center',
    );
    txt('I PULSANTI DEL GAMEPAD SONO FISSI (MAPPATURA STANDARD)', VW / 2, VH - 12, '#7a6f99', 1, 'center');
    return;
  }
  txt('OPZIONI', VW / 2, 40, '#ff3df2', 3, 'center', '#2a0b3d');
  OPT_ITEMS.forEach((it, i) => {
    const y = 86 + i * 20,
      on = i === m.sel;
    if (on) {
      ctx.fillStyle = 'rgba(255,61,242,.16)';
      ctx.fillRect(150, y - 5, 340, 17);
      txt('>', 156, y, '#ffffff');
    }
    txt(it.n, 170, y, on ? '#ffffff' : '#c9c2e6');
    txt(it.v(), 470, y, on ? '#ffe03c' : '#7a6f99', 1, 'right');
  });
  txt(
    '↑↓ SCEGLI  ←→ CAMBIA  ' + KM('ok') + ' CONFERMA  ' + KM('back') + ' INDIETRO',
    VW / 2,
    VH - 24,
    '#ffe03c',
    1,
    'center',
  );
}

</script>
<script>
// ===== js/main.js =====
'use strict';
// =====================================================================
//  MAIN LOOP: logica a timestep fisso (120 Hz), disegno a ogni frame
//  - la fisica non dipende piu' dal framerate
//  - hit-stop: il mondo si ferma per qualche centesimo sui colpi forti
// =====================================================================
const STEP = 1 / 120,
  MAX_STEPS = 8;
genCity(Math.floor(Math.random() * 1e9));
let last = performance.now(),
  acc = 0;
function titleInput() {
  if (mhit('right')) sel = (sel + 1) % NB;
  if (mhit('left')) sel = (sel + NB - 1) % NB;
  if (mhit('down') || mhit('up')) sel = (sel + NB / 2) % NB;
  const live = saved && !saved.meta.ended;
  if (mhit('del')) {
    if (saved) {
      if (delArm > 0) {
        delSave();
        saved = null;
        meta = null;
        delArm = 0;
        titleMsg = 'SALVATAGGIO CANCELLATO';
      } else {
        delArm = 2.5;
        titleMsg = 'PREMI DI NUOVO ' + KM('del') + ' PER CANCELLARE';
      }
    }
  }
  if (take('options') || mhit('opts')) {
    optMenu = { sel: 0, sub: null };
    return;
  }
  if (mhit('ok')) {
    if (live) loadGame(saved);
    else {
      newGame(sel);
      resetWeather();
    }
  }
}
function gunInput() {
  const g = gunMenu,
    p = team[active];
  let pick = -1;
  for (let k = 0; k < g.opts.length; k++)
    if (pressed.has('Digit' + (k + 1)) || pressed.has('Numpad' + (k + 1))) pick = k;
  if (mhit('up')) g.sel = (g.sel + g.opts.length - 1) % g.opts.length;
  if (mhit('down')) g.sel = (g.sel + 1) % g.opts.length;
  if (mhit('ok')) pick = g.sel;
  if (pick >= 0) {
    if (money >= 10000) {
      money -= 10000;
      p.weapons.push(g.opts[pick]);
      p.wi = p.weapons.length - 1;
      setW(p);
      sfx('cash');
      msg(p.name + ' HA UNA NUOVA ARMA: ' + p.wpn.label + ' (' + K('weapon') + ' PER CAMBIARE)', p.ui);
    }
    gunMenu = null;
  } else if (mhit('back') || take('use')) gunMenu = null;
}
function frame(t) {
  const rdt = Math.min(0.25, Math.max(0, (t - last) / 1000));
  last = t;
  T += rdt;
  delArm = Math.max(0, delArm - rdt);
  toastT = Math.max(0, toastT - rdt);
  pollPad(rdt);
  if (take('music')) musicOn = !musicOn;
  if (take('mute')) {
    muted = !muted;
    setRainVol(weather.int);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  let stepped = false,
    frozen = false;
  if (optMenu) {
    frozen = true;
    optionsInput();
    if (state === 'title') drawTitle(0);
    else drawWorld(cam.x, cam.y, 0);
    if (optMenu) drawOptions();
  } else if (state === 'title') {
    titleInput();
    if (state === 'title') drawTitle(rdt);
  } else if (state === 'play' || state === 'wait') {
    if (gunMenu) gunInput();
    else if (paused) {
      if (take('pause') || mhit('back')) paused = false;
      else if (take('options') || mhit('opts')) optMenu = { sel: 0, sub: null };
    } else if (mapOpen) {
      if (take('map') || mhit('back')) mapOpen = false;
    } else if (take('map')) mapOpen = true;
    else if (state === 'play' && take('pause')) paused = true;
    frozen = paused || mapOpen || !!gunMenu || !!optMenu;
    if (!frozen) {
      if (hitStop > 0) hitStop = Math.max(0, hitStop - rdt);
      else {
        acc += rdt;
        let n = 0;
        while (acc >= STEP && n < MAX_STEPS) {
          update(STEP);
          n++;
          acc -= STEP;
          if (n === 1) {
            clearPressed();
            stepped = true;
          }
          if (state !== 'play' && state !== 'wait') break;
        }
        if (n >= MAX_STEPS) acc = 0;
      }
    } // troppo lento: si rallenta invece di "saltare"
    if (pendingFast) {
      pendingFast = false;
      newGame(2);
      meta.gameT = 11 * 3600;
      meta.fast = true;
      msgs = [];
      msg('NOTTE VELOCE! SI RIPARTE ALLE 05:00', '#9fd4ff');
      msg("RESISTI FINO ALL'ALBA", '#ffe03c');
      saveGame();
    }
    if (state === 'play') {
      drawWorld(cam.x, cam.y, frozen ? 0 : rdt);
      drawHUD();
      if (optMenu) drawOptions();
      else if (gunMenu) drawGunMenu();
      else if (mapOpen) drawBigMap();
      else if (paused) drawPause();
    } else if (state === 'wait') {
      drawWorld(cam.x, cam.y, rdt);
      drawWait();
      if (mapOpen) drawBigMap();
    } else {
      drawWorld(cam.x, cam.y, rdt);
      drawEnd();
    }
  } else if (state === 'end') {
    drawWorld(cam.x, cam.y, rdt);
    drawEnd();
    if (mhit('ok')) {
      saved = readSave();
      state = 'title';
      titleMsg = '';
    }
  }
  if (toastT > 0) strip(toastMsg, VW / 2, 4, '#3cf2ff', 0.85);
  // i tasti premuti restano validi finche' un passo di logica non li ha letti
  if (stepped || frozen || !(state === 'play' || state === 'wait')) clearPressed();
  requestAnimationFrame(frame);
}
addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'play' || state === 'wait')) {
    saveGame();
    if (state === 'play') paused = true;
  }
});
addEventListener('pagehide', () => {
  if (state === 'play' || state === 'wait') saveGame();
});
requestAnimationFrame(frame);

</script>
